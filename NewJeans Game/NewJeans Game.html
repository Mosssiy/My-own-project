  function injectStyle() {
    if (typeof document === 'undefined') return;
    if (document.getElementById(STYLE_ID)) return;
    var s = document.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    (document.head || document.documentElement).appendChild(s);
  }

  /* =========================== 角色绘制 =========================== */
  function drawLimb(ctx, x, y, angle, len, w, color, tipColor) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    roundRect(ctx, -w / 2, -2, w, len + 2, w / 2);
    ctx.fill();
    ctx.fillStyle = tipColor;
    roundRect(ctx, -w / 2 - 0.7, len - 5, w + 1.4, 6.5, 3);
    ctx.fill();
    ctx.restore();
  }

  function drawHairBack(ctx, m) {
    ctx.fillStyle = m.hairColor;
    var style = m.hair;
    if (style === 'long') {
      roundRect(ctx, -13.5, -60, 27, 27, 11); ctx.fill();
    } else if (style === 'straight') {
      roundRect(ctx, -13, -60, 26, 31, 7); ctx.fill();
    } else if (style === 'wavy') {
      ctx.beginPath();
      ctx.moveTo(-13.5, -58);
      ctx.lineTo(13.5, -58);
      ctx.lineTo(14.5, -36);
      ctx.quadraticCurveTo(9, -31, 4, -36);
      ctx.quadraticCurveTo(0, -31, -4, -36);
      ctx.quadraticCurveTo(-9, -31, -14.5, -36);
      ctx.closePath();
      ctx.fill();
    } else if (style === 'bob') {
      roundRect(ctx, -12.5, -60, 25, 20, 9); ctx.fill();
    } else if (style === 'ponytail') {
      roundRect(ctx, -12, -60, 24, 16, 8); ctx.fill();
      ctx.save();
      ctx.translate(11, -54);
      ctx.rotate(0.5);
      ctx.beginPath();
      ctx.ellipse(2, 6, 5.5, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawHairFront(ctx, m) {
    ctx.fillStyle = m.hairColor;
    // 头顶
    ctx.beginPath();
    ctx.arc(0, -52, 12, Math.PI * 1.02, Math.PI * 1.98);
    ctx.closePath();
    ctx.fill();
    // 刘海
    if (m.hair === 'bob' || m.hair === 'straight') {
      ctx.beginPath();
      ctx.moveTo(-12, -56);
      ctx.lineTo(12, -56);
      ctx.lineTo(11, -46);
      ctx.quadraticCurveTo(0, -50, -11, -46);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(-11.5, -57);
      ctx.lineTo(11.5, -57);
      ctx.quadraticCurveTo(6, -50, 1, -55);
      ctx.quadraticCurveTo(-4, -49, -11.5, -54);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawFace(ctx, m, o) {
    var eyeY = -51.5;
    ctx.fillStyle = '#2a2029';
    if (o.blink) {
      ctx.fillRect(-6.4, eyeY - 0.7, 4.2, 1.5);
      ctx.fillRect(2.2, eyeY - 0.7, 4.2, 1.5);
    } else {
      ctx.beginPath();
      ctx.ellipse(-4.3, eyeY, 1.7, 2.2, 0, 0, Math.PI * 2);
      ctx.ellipse(4.3, eyeY, 1.7, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath();
      ctx.arc(-3.7, eyeY - 0.9, 0.6, 0, Math.PI * 2);
      ctx.arc(4.9, eyeY - 0.9, 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    // 腮红
    ctx.fillStyle = 'rgba(244,114,182,.35)';
    ctx.beginPath();
    ctx.ellipse(-7.6, -47.5, 2.6, 1.7, 0, 0, Math.PI * 2);
    ctx.ellipse(7.6, -47.5, 2.6, 1.7, 0, 0, Math.PI * 2);
    ctx.fill();
    // 嘴
    ctx.strokeStyle = 'rgba(120,60,70,.85)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(0, -45.6, 2.6, 0.25 * Math.PI, 0.75 * Math.PI);
    ctx.stroke();
  }

  function drawBunnyEars(ctx, m) {
    var ears = [[-5.4, -0.24], [5.4, 0.24]];
    for (var i = 0; i < ears.length; i++) {
      ctx.save();
      ctx.translate(ears[i][0], -62);
      ctx.rotate(ears[i][1]);
      ctx.fillStyle = m.accent;
      roundRect(ctx, -2.6, -10, 5.2, 13, 2.6);
      ctx.fill();
      ctx.fillStyle = 'rgba(244,114,182,.55)';
      roundRect(ctx, -1.2, -8.5, 2.4, 9, 1.2);
      ctx.fill();
      ctx.restore();
    }
  }

  /**
   * 绘制一位成员。
   * @param {CanvasRenderingContext2D} ctx
   * @param {object} m 成员数据
   * @param {number} cx 双脚中心 x
   * @param {number} feetY 脚底 y
   * @param {number} height 站立总高（滑铲时传滑铲高度）
   * @param {object} o {sliding, airborne, phase, blink}
   */
  function drawCharacter(ctx, m, cx, feetY, height, o) {
    o = o || {};
    var s = height / 56;
    ctx.save();
    ctx.translate(cx, feetY);

    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#0b1020';
    ctx.beginPath();
    ctx.ellipse(0, 1.5, 19, 5.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.scale(s, s);
    if (o.sliding) { ctx.rotate(-1.0); ctx.translate(3, -3); }

    var phase = o.phase || 0;
    var air = !!o.airborne;
    var legA = air ? -0.6 : Math.sin(phase) * 0.9;
    var legB = air ? 0.42 : Math.sin(phase + Math.PI) * 0.9;
    var armA = air ? -1.5 : Math.sin(phase + Math.PI) * 0.85 - 0.12;
    var armB = air ? -2.0 : Math.sin(phase) * 0.85 - 0.12;

    drawHairBack(ctx, m);

    // 腿
    drawLimb(ctx, -3.6, -20, legA, 20, 7, m.skin, '#f8fafc');
    drawLimb(ctx, 3.6, -20, legB, 20, 7, m.skin, '#f8fafc');

    // 裙子 + 上衣
    ctx.fillStyle = m.bottom;
    ctx.beginPath();
    ctx.moveTo(-10.5, -40);
    ctx.lineTo(10.5, -40);
    ctx.lineTo(14, -15);
    ctx.lineTo(-14, -15);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = m.outfit;
    roundRect(ctx, -10.8, -42, 21.6, 21, 6.5);
    ctx.fill();

    // 手臂
    drawLimb(ctx, -9, -39, armA, 15, 5.6, m.outfit, m.skin);
    drawLimb(ctx, 9, -39, armB, 15, 5.6, m.outfit, m.skin);

    // 头 + 脸 + 头发
    ctx.fillStyle = m.skin;
    ctx.beginPath();
    ctx.arc(0, -52, 11.6, 0, Math.PI * 2);
    ctx.fill();
    drawFace(ctx, m, o);
    drawHairFront(ctx, m);
    drawBunnyEars(ctx, m);

    ctx.restore();
  }

  /* ============================== 主游戏 ============================== */
  class Game {
    constructor(opts) {
      opts = opts || {};
      injectStyle();

      this.opts = opts;
      this.version = VERSION;
      this.mount = typeof opts.mount === 'string'
        ? document.querySelector(opts.mount)
        : (opts.mount || document.body);

      this.memberIndex = clamp(opts.member == null ? 0 : opts.member, 0, MEMBERS.length - 1);
      this.best = loadBest();
      this.settings = loadSettings();
      this.difficultyIndex = Math.max(0, difficultyIndexById(this.settings.difficulty));
      this.applyDifficulty(this.difficultyIndex);
      this.forceLandscape = null;      // true/false 可强制朝向（测试与外壳用），null = 读设备
      this.wantsPortrait = false;      // 玩家点了"仍然竖屏玩"
    this.enteredFs = false;          // 玩家走的是"横屏并全屏"这条路 → 完全全屏（不留操作提示）
    this.gateAnswered = false;       // 横竖屏岔路口是否已经选过（选过就不再重复问全屏）
      this.landscape = isLandscape(this.forceLandscape);
      this.state = 'menu';
      this.time = 0;
      this.menuScroll = 0;
      this.menuAnim = 0;
      this.lives = this.diff().lives;
      this.running = true;

      this.buildDom();
      this.bindEvents();
      this.reset();
      this.state = 'menu';
      this.syncUi();

      this.lastTs = 0;
      this.loopBound = this.loop.bind(this);
      if (typeof global.requestAnimationFrame === 'function') {
        global.requestAnimationFrame(this.loopBound);
      }
    }

    /* ---------------------------- DOM ---------------------------- */
    buildDom() {
      var root = document.createElement('div');
      root.className = 'nj-root';
      root.setAttribute('data-state', 'menu');
      root.setAttribute('data-touch', isTouch() ? '1' : '0');
      // 全屏图标：纯 CSS 画（四角括弧 + 内框），不引任何外部资源；浏览器不支持就整个隐藏
      var fsBtn = fullscreenApi()
        ? '<button class="nj-fs" data-act="fullscreen" title="全屏" aria-label="切换全屏" data-fs="0"><i></i></button>'
        : '';
      root.innerHTML =
        '<div class="nj-stage">' +
        '<canvas class="nj-canvas"></canvas>' +
        '<div class="nj-hud">' +
        '<div class="nj-hud-row">' +
        '<div><div class="nj-hearts"></div><div class="nj-meta"></div><div class="nj-buffs"></div><div class="nj-combo"></div></div>' +
        '<div class="nj-panel"><b class="nj-score">0</b><span class="nj-sub-score"></span><div class="nj-speed"><i></i></div>' + fsBtn + '</div>' +
        '</div>' +
        '</div>' +
        '</div>' +
        '<div class="nj-chips"></div>' +
        '<div class="nj-touch">' +
        '<button data-act="slide">滑铲</button>' +
        '<button data-act="jump">跳</button>' +
        '<button data-act="pause">⏸</button>' +
        '</div>' +
        '<div class="nj-hint">左半边按住滑铲 · 右半边点按跳跃</div>' +
        '<div class="nj-overlay"></div>' +
        // 竖屏提示层（手机竖屏进入时显示）
        '<div class="nj-rotate">' +
        '<svg class="nj-rotate-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="14" y="5" width="20" height="30" rx="4"/>' +
        '<path d="M24 40c7 0 12-4 12-9"/>' +
        '<path d="M32 28l4 3 5-2"/>' +
        '</svg>' +
        '<div class="nj-rotate-text">请把手机横过来</div>' +
        '<div class="nj-rotate-sub">横屏时画面更大、按钮浮在两侧，躲障碍更顺手；转过去就会自动切换。</div>' +
        // 「横屏并全屏」只在主页面设置里还没开全屏时出现；已经全屏了就只留"仍然竖屏玩"
        '<button class="nj-btn nj-rotate-go" data-act="rotate-fullscreen">横屏并全屏</button>' +
        '<button class="nj-btn ghost nj-rotate-skip" data-act="stay-portrait">仍然竖屏玩</button>' +
        '</div>';
      this.mount.appendChild(root);

      this.root = root;
      this.stage = root.querySelector('.nj-stage');
      this.canvas = root.querySelector('.nj-canvas');
      this.overlay = root.querySelector('.nj-overlay');
      this.rotateHint = root.querySelector('.nj-rotate');
      this.rotateGo = root.querySelector('[data-act="rotate-fullscreen"]');
      this.rotateSkip = root.querySelector('[data-act="stay-portrait"]');
      this.fullscreenBtn = root.querySelector('.nj-fs');
      this.touchPad = root.querySelector('.nj-touch');
      this.rotateText = root.querySelector('.nj-rotate-text');
      this.rotateSub = root.querySelector('.nj-rotate-sub');
      this.hud = {
        hearts: root.querySelector('.nj-hearts'),
        meta: root.querySelector('.nj-meta'),
        buffs: root.querySelector('.nj-buffs'),
        combo: root.querySelector('.nj-combo'),
        score: root.querySelector('.nj-score'),
        sub: root.querySelector('.nj-sub-score'),
        speed: root.querySelector('.nj-speed i'),
        chips: root.querySelector('.nj-chips')
      };
      this.hudCache = {};
      this.buildChips();
      this.ctx = this.canvas.getContext('2d');
      this.resize();
      this.syncOrientation();
    }

    /** HUD 里的成员胶囊：点一下就能换人（手机上最方便） */
    buildChips() {
      var html = '';
      for (var i = 0; i < MEMBERS.length; i++) {
        var m = MEMBERS[i];
        html += '<button class="nj-chip" data-act="member" data-index="' + i + '" style="--c:' + m.color + '">' +
          m.name + '</button>';
      }
      this.hud.chips.innerHTML = html;
    }

    /** 用 DOM 画 HUD：字号不随画布缩放，手机上也清楚 */
    syncHud() {
      var h = this.hud;
      if (!h || this.state === 'menu') return;
      var cache = this.hudCache;

      // 生命槽按难度给的初始数量画（多余的槽位画成黑心）
      var heartSlots = Math.max(this.diff().lives, this.heartsMax || 0, this.lives);
      var hearts = '';
      for (var i = 0; i < heartSlots; i++) hearts += i < this.lives ? '❤️' : '🖤';
      if (cache.hearts !== hearts) { cache.hearts = hearts; h.hearts.textContent = hearts; }

      var meta = (this.pal ? this.pal.name : '') + ' · ' + Math.floor(this.distance / 50) + ' m · ' + this.diff().name;
      if (cache.meta !== meta) { cache.meta = meta; h.meta.textContent = meta; }

      // buff 胶囊：显示剩余时间（免死标记没有倒计时，单独显示）
      var buffs = '';
      for (var k = 0; k < POWERUP_KEYS.length; k++) {
        var key = POWERUP_KEYS[k];
        if (this.buffs[key] <= 0) continue;
        var info = POWERUPS[key];
        buffs += '<span class="nj-buff" style="background:' + info.color + '">' + info.icon + ' ' +
          this.buffs[key].toFixed(1) + 's</span>';
      }
      if (this.buffs.heartSave > 0) {
        buffs += '<span class="nj-buff" style="background:' + POWERUPS.heart.color + '">' +
          POWERUPS.heart.icon + ' 免死</span>';
      }
      if (cache.buffs !== buffs) { cache.buffs = buffs; h.buffs.innerHTML = buffs; }

      var combo = this.combo >= 2
        ? '连击 ' + this.combo + ' ×' + (1 + Math.min(Math.floor(this.combo / 5), 4))
        : '';
      if (cache.combo !== combo) { cache.combo = combo; h.combo.textContent = combo; }

      var score = String(this.score);
      if (cache.score !== score) { cache.score = score; h.score.textContent = score; }

      var sub = '最好 ' + this.best + ' · CD ' + this.coins;
      if (cache.sub !== sub) { cache.sub = sub; h.sub.textContent = sub; }

      var sp = Math.round(clamp((this.speed / this.member().speed - CFG.baseSpeed) /
        (CFG.maxSpeed - CFG.baseSpeed), 0, 1) * 100) + '%';
      if (cache.sp !== sp) { cache.sp = sp; h.speed.style.width = sp; }

      if (cache.member !== this.memberIndex) {
        cache.member = this.memberIndex;
        var chips = h.chips.children;
        for (var c = 0; c < chips.length; c++) {
          chips[c].className = 'nj-chip' + (c === this.memberIndex ? ' is-active' : '');
        }
        h.speed.style.background = this.member().color;
      }
    }

    resize() {
      // 旋转/尺寸变化时顺手重算朝向：有些手机不派发 orientationchange，
      // 但 resize 一定会有 —— 这样"把手机横过来没反应"就不会再出现
      this.syncOrientation();
      var dpr = Math.min(global.devicePixelRatio || 1, 2);
      var cw = (this.stage && this.stage.clientWidth) || CFG.W;
      var ch = (this.stage && this.stage.clientHeight) || CFG.H;
      var aspect = cw / Math.max(1, ch);
      // 用固定的逻辑宽度保证横向比例一致，纵向按容器比例反推：
      // 横屏时看到更多天空/地面，而不是把画面拉宽（角色不会被拉胖）。
      var vw = CFG.W;
      var vh = clamp(vw / aspect, CFG.H * 0.62, CFG.H * 1.9);
      this.dpr = dpr;
      this.cw = cw;
      this.ch = ch;
      this.view = {
        w: vw,
        h: vh,
        aspect: aspect,
        scale: cw / vw,
        top: CFG.groundY - vh * 0.82
      };
      this.canvas.width = Math.round(cw * dpr);
      this.canvas.height = Math.round(ch * dpr);
    }

    /* ----------------------- 难度 / 本机设置 ----------------------- */
    diff() { return DIFFICULTIES[this.difficultyIndex] || DIFFICULTIES[1]; }

    /** 把难度写进 CFG：速度曲线 / 生命（默认「普通」时数值与旧版完全一致） */
    applyDifficulty(i) {
      var d = DIFFICULTIES[i] || DIFFICULTIES[1];
      this.difficultyIndex = DIFFICULTIES.indexOf(d);
      CFG.baseSpeed = d.baseSpeed;
      CFG.maxSpeed = d.maxSpeed;
      CFG.speedGain = d.speedGain;
      CFG.lives = d.lives;
      return d;
    }

    setDifficulty(i) {
      var d = this.applyDifficulty(i);
      this.settings.difficulty = d.id;
      saveSettings(this.settings);
      this.reset();          // 速度/生命立刻生效
      this.syncUi();
      return d;
    }

    /* ------------------- 朝向（横屏优先 / 全屏） ------------------- */
    /** 注意：玩家选了「仍然竖屏玩」之后就是**锁定竖屏**，跟手机物理朝向无关 */
    isPortrait() {
      if (this.wantsPortrait) return true;
      return !isLandscape(this.forceLandscape);
    }

    /** 同步横竖屏：写 data-orient 供 CSS 用，并决定是否弹"请把手机横过来" */
    syncOrientation() {
      // 锁了竖屏就一直是竖屏布局（不管手机怎么转）
      this.landscape = this.wantsPortrait ? false : isLandscape(this.forceLandscape);
      if (this.root && this.root.setAttribute) {
        this.root.setAttribute('data-orient', this.landscape ? 'landscape' : 'portrait');
        this.root.setAttribute('data-need-rotate', this.portraitPrompt() ? '1' : '0');
        // 旋转也会改变"是否完全全屏"（iOS 独立模式：横过来才算全屏效果），
        // 这里顺手更新，省得等下一次 syncUi 才生效
        this.root.setAttribute('data-clean', this.completeFullscreen() ? '1' : '0');
      }
      this.syncTopAction();
      this.syncFullscreenState();
      this.refreshFullscreenHint();
      return this.landscape;
    }

    /**
     * 初始界面的按钮：竖屏时永远有「横屏并全屏」+「仍然竖屏玩」（不管主页设置有没有点过全屏）；
     * 横屏时能进网页全屏就给「全屏进入游戏」，进不了（iPhone Safari / 微信内置）就给「直接开始玩」+ 说明。
     */
    refreshFullscreenHint() {
      if (!this.rotateGo) return;
      var shell = global.NJShell;
      // 能不能做出"全屏效果"（真全屏 或 从主屏幕启动）——iOS 独立模式算能，
      // 这样 iOS 上的按钮文案与行为就和 Android 完全一致了
      var canFs = this.canFullscreenLook();
      var unsupported = !canFs;                      // 只有"标签页里的 Safari / 微信内置"才需要说明
      var land = !this.isPortrait();
      // 初始界面**永远**要有「横屏并全屏」/「全屏进入游戏」——不管主页设置有没有点过全屏。
      // 唯一不显示的情况：已经是横屏、而这个浏览器又根本进不了网页全屏（那时给「直接开始玩」）。
      this.rotateGo.hidden = land && !canFs;
      this.rotateGo.setAttribute('data-fs-hidden', this.rotateGo.hidden ? '1' : '0');
      if (this.rotateGo.textContent !== undefined) {
        var label = unsupported ? '横屏并全屏（看说明）' : (land ? '全屏进入游戏' : '横屏并全屏');
        if (this.rotateGo.textContent !== label) this.rotateGo.textContent = label;
      }
      // 第二颗按钮：竖屏时 =「仍然竖屏玩」；横屏时只有进不了全屏才给「直接开始玩」（否则会卡住）
      if (this.rotateSkip) {
        var showSkip = land ? !canFs : true;
        this.rotateSkip.hidden = !showSkip;
        var skipLabel = land ? '直接开始玩' : '仍然竖屏玩';
        if (this.rotateSkip.textContent !== skipLabel) this.rotateSkip.textContent = skipLabel;
      }
      // 岔路口的标题/说明按朝向换文案
      if (this.rotateText && this.rotateSub) {
        var t = land ? '准备进入全屏' : '请把手机横过来';
        var s = land
          ? (unsupported
            ? '这个浏览器不支持网页全屏，点「直接开始玩」也能玩；想真全屏可按说明添加到主屏幕。'
            : '点下面的按钮进入全屏开始游戏（横屏操作更顺手）。')
          : '横屏时画面更大、按钮浮在两侧，躲障碍更顺手；转过去就会自动切换。';

    /** 玩家选择"仍然竖屏玩"：**锁定竖屏**（手机转成横屏也保持竖屏布局），并收起提示层 */
    stayPortrait() {
      this.wantsPortrait = true;
      this.gateAnswered = true;     // 岔路口选过了 → 菜单里不再出现"自动全屏/现在就全屏"
      if (this.root && this.root.setAttribute) this.root.setAttribute('data-need-rotate', '0');
      // 尽量让系统也锁成竖屏（需要处于全屏才生效；失败就靠布局自己锁）

        var so = global.screen && global.screen.orientation;
        if (so && typeof so.lock === 'function') {
          var r = so.lock('portrait');
          if (r && typeof r.catch === 'function') r.catch(function () { /* ignore */ });
        }
      } catch (e) { /* ignore */ }

      return false;
    }

    /**
     * 岔路口这一层什么时候显示（注意：选过之后就不能再回来挡着菜单，
     * 否则玩家点了"横屏并全屏"之后手还没转过去，提示层会重新盖住"开始跑酷"）：
     *  - 已经选过（横屏并全屏 / 仍然竖屏玩）→ 不再显示
     *  - 竖屏且还没选 → 提示"请把手机横过来"
     *  - 横屏但还没全屏、也没选过 → 要求先点「全屏进入游戏」
     */
    portraitPrompt() {
      if (this.gateAnswered) return false;
      if (this.isPortrait()) return true;
      // 横屏：只有在"还没进入全屏体验"时才要求先点「全屏进入游戏」
      // （「添加到主屏幕」启动时本来就没有地址栏，不需要再问）
      return !this.fsSatisfied();
    }

    /**
     * 是否处于"完全全屏"：没有任何操作提示（跳/滑铲/暂停按钮、角色胶囊都不显示）。
     * 只看**真的进入网页全屏**，或玩家走的是「横屏并全屏」这条路。
     * 两种例外都不算"完全全屏"：
     *  ① 「添加到主屏幕」启动（iOS 独立模式）—— 它只是没有地址栏，不算玩家选了无提示模式；
     *  ② 玩家明确点了「仍然竖屏玩」—— 那就是"带按钮的竖屏模式"，即使主页设置里已经全屏，
     *     也必须把 滑铲/跳/暂停 显示出来（否则竖屏下一个按钮都没有）。
     */
    completeFullscreen() {

      var shell = global.NJShell;
      var really = !!(shell && shell.isReallyFullscreen && shell.isReallyFullscreen());

      // 剩下的是"进不了 requestFullscreen"的情况（iOS Safari / 主屏启动）：
      //   只要**已经横过来**，就给和 Android 一样的干净界面 —— 不管走的是
      //   ① 点「横屏并全屏」进来的，还是 ② 自己直接把手机横过来（没点按钮）进来的。
      // 还是竖屏时不给干净界面，保留 滑铲/跳/暂停（iOS 锁不了横屏，没转过去就没按钮了）。
      if (this.isPortrait()) return false;
      if (this.enteredFs) return true;
      return this.fsSatisfied();               // 从主屏幕图标启动 = 无地址栏，横过来即全屏效果
    }

    /** 已经是"全屏体验"（真全屏 或 添加到主屏幕）：不用再问要不要全屏 */
    fsSatisfied() {

     *  ① 能真的进网页全屏（Android / 桌面 Chrome 等，有 requestFullscreen）
     *  ② 已经是从主屏幕图标启动（iOS 独立模式）——本来就是无地址栏
     *  ③ **就是一台手机（触摸设备）**——iOS Safari 标签页也没有 requestFullscreen，
     *     但玩家要的是和 Android 一样"干净的界面"：隐藏操作按钮、用点按/按住操作。
     *     地址栏藏不掉是浏览器的限制，但界面本身可以做到一致。

     */

    }

    /**

     *  - 「仍然竖屏玩」：收起提示层，锁定竖屏开始玩
     *  - 「横屏并全屏」/「全屏进入游戏」：能做出全屏效果就收起提示层、进全屏、锁横屏开始
     *    （iOS 独立模式虽然调不了 requestFullscreen，但本来就是全屏效果，所以照样进游戏，
     *      跟 Android 表现一致）；做不到全屏的浏览器点它不做任何事。
     */
    gateTap(act) {
      if (act === 'stay-portrait') { this.stayPortrait(); return; }
      if (act !== 'rotate-fullscreen') return;
      if (!this.canFullscreenLook()) return;     // 既进不了全屏、也不是主屏启动：点了没有任何反应
      this.rotateAndFullscreen();
    }

    syncFullscreenState() {
      if (!this.fullscreenBtn) return;
      this.fullscreenBtn.setAttribute('data-fs', fullscreenElement() ? '1' : '0');
    }

    /** 进全屏：只在用户手势里调用；不支持或失败都静默忽略 */
    requestFs(el) {

      // position:fixed 铺满整屏，把顶栏（返回 / 暂停）盖住 —— 玩家既看不到也点不到。
      var shell = global.NJShell;

      if (!api || fullscreenElement()) return false;
      var target = el || this.stage || (typeof document !== 'undefined' ? document.documentElement : null);
      if (!target || typeof target[api.enter] !== 'function') return false;
      try {
        var ret = target[api.enter]();
        if (ret && typeof ret.catch === 'function') ret.catch(function () { /* 被浏览器拒绝：忽略 */ });

      } catch (e) { return false; }
    }

    exitFs() {
      var api = fullscreenApi();
      if (!api || typeof document === 'undefined') return;
      var doc = document;
      if (doc[api.exit] && typeof doc[api.exit] === 'function') {
        try { doc[api.exit](); } catch (e) { /* ignore */ }
      }
    }

    toggleFullscreen() {
      if (fullscreenElement()) { this.exitFs(); this.syncFullscreenState(); return false; }
      var ok = this.requestFs(this.stage);
      this.syncFullscreenState();
      return ok;
    }

    /** 开始游戏时在用户手势里尝试一次：全屏 + 锁定横屏（都允许失败） */
    enterImmersive() {
      if (this.settings && this.settings.autoFs === false) return false;
      if (this.wantsPortrait) return false;      // 玩家选了竖屏模式：别去锁横屏，也别抢全屏
      this.requestFs(this.stage);
      try {
        var so = global.screen && global.screen.orientation;
        if (so && typeof so.lock === 'function') {
          var ret = so.lock('landscape');
          if (ret && typeof ret.catch === 'function') ret.catch(function () { /* ignore */ });
        }
      } catch (e) { /* 浏览器不支持 / 非全屏状态：忽略 */ }
      return true;
    }

    /** 一键"横屏并全屏"：在竖屏提示层里点，直接在用户手势里锁横屏 + 进全屏 */
    rotateAndFullscreen() {
      this.gateAnswered = true;
      this.enteredFs = true;        // 走这条路 = 完全全屏：进去之后不留任何操作提示
      this.requestFs(this.stage);
      try {
        var so = global.screen && global.screen.orientation;
        if (so && typeof so.lock === 'function') {
          var ret = so.lock('landscape');
          if (ret && typeof ret.catch === 'function') ret.catch(function () { /* ignore */ });
        }
      } catch (e) { /* ignore */ }
      this.clearPortraitWait();
      this.syncFullscreenState();
      this.syncUi();
      return true;
    }

    /** 收起岔路口这一层（不改变 wantsPortrait 的语义，只负责隐藏） */
    clearPortraitWait() {
      if (this.root && this.root.setAttribute) this.root.setAttribute('data-need-rotate', '0');
    }

    /**
     * 完全全屏时顶栏放一个"暂停"按钮（就是用户要的那个效果：
     * 顶栏保留"返回"，右侧多一个暂停；游戏内不再有任何操作提示）。
     */
    syncTopAction() {
      var shell = global.NJShell;
      if (!shell || !shell.setTopAction) return;
      var self = this;
      var want = this.completeFullscreen() && (this.state === 'playing' || this.state === 'paused');
      var label = this.state === 'paused' ? '继续' : '暂停';
      if (!want) {
        if (this._topActOn) {
          this._topActOn = false;
          this._topActEl = null;
          shell.clearTopAction('parkour-pause');
        }
        return;
      }
      if (!this._topActOn || !this._topActEl) {
        this._topActOn = true;
        this._topActEl = shell.setTopAction('parkour-pause', label, function () {
          if (self.state === 'playing') self.pause();
          else if (self.state === 'paused') self.resume();
        });
      } else if (this._topActEl.textContent !== label) {
        this._topActEl.textContent = label;
      }
    }

    bindEvents() {
      var self = this;
      this._onKeyDown = function (e) { self.onKeyDown(e); };
      this._onKeyUp = function (e) { self.onKeyUp(e); };
      this._onBlur = function () { if (self.state === 'playing') self.pause(); };

      global.addEventListener('keydown', this._onKeyDown);
      global.addEventListener('keyup', this._onKeyUp);
      global.addEventListener('blur', this._onBlur);

        document.addEventListener('fullscreenchange', this._onFsChange);
        document.addEventListener('webkitfullscreenchange', this._onFsChange);
      }

      // 竖屏提示层：点"仍然竖屏玩"就收起，游戏继续用竖屏布局

          var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;

          self.gateTap(el.getAttribute('data-act'));

      }

        self.act(el.getAttribute('data-act'), el);
      });

      // HUD 上的全屏按钮（在 .nj-hud 里，所以要单独监听）
      if (this.fullscreenBtn) {
        this.fullscreenBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          self.toggleFullscreen();
        });
      }

      // HUD 上的成员胶囊：点一下直接换人（手机上最顺手）
      if (this.hud && this.hud.chips) {
        this.hud.chips.addEventListener('click', function (e) {

          e.stopPropagation();

        else if (act === 'slide') { self.startSlide(); self.slideHeld = true; }
        else if (act === 'switch') self.nextMember(1);
        else if (act === 'pause') self.pause();
