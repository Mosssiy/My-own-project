    var cur = c.currentTime;
    var horizon = cur + 0.30;
    var evs = this.song.events;
    while (this.nextIdx < evs.length && this.startAt + evs[this.nextIdx].time < horizon) {
      var ev = evs[this.nextIdx++];
      try { playEvent(ev, this.startAt + ev.time); } catch (e) { /* 单个音失败不影响整体 */ }
    }
    if (this.nextIdx >= evs.length && this.time() >= this.song.duration - 0.08) {
      var cb = this.onEnd;
      this.stop();
      if (cb) cb();
    }
  };

  Player.prototype.time = function () {
    if (!this.playing) return 0;
    if (this.fileAudio) return this.fileAudio.currentTime - this.fileOffset;
    var c = ac();
    var wall = (Date.now() - this.wallStart) / 1000;
    // 音频被浏览器自动播放策略挂起时 AudioContext 时钟不走，用挂钟兜底；
    // 等音频真正跑起来再把时钟接回去，避免谱面突然跳回去。
    if (!c || c.state !== 'running') return wall;
    if (c.currentTime - this.startAt < wall - 0.35) {
      this.startAt = c.currentTime - wall;
      this.nextIdx = 0;
      while (this.nextIdx < this.song.events.length && this.song.events[this.nextIdx].time < wall) this.nextIdx++;
    }
    return c.currentTime - this.startAt;
  };

  Player.prototype.stop = function () {
    this.playing = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.fileAudio) {
      try { this.fileAudio.pause(); } catch (e) { /* ignore */ }
    }
  };

  Player.prototype.setLocalFile = function (url, offset) {
    if (this.fileAudio) { try { this.fileAudio.pause(); } catch (e) { /* ignore */ } }
    var self = this;
    this.fileAudio = new Audio(url);
    this.fileAudio.loop = false;
    this.fileOffset = offset || 0;
    // 本地音频播完以音频元素为准收尾（currentTime 会停在 duration 上，用时间比较容易差一点点）
    this.fileAudio.addEventListener('ended', function () {
      if (!self.playing) return;
      var cb = self.onEnd;
      self.stop();
      if (cb) cb();
    });
  };

  /* ====================== 音频分析（给"我的音乐"用） ====================== */
  /* 思路：把音频解码成 PCM → 分帧做 FFT → 算谱通量（spectral flux）找起音点
     → 用 4 个频段的能量分布决定音符落在哪条轨 → 自相关估 BPM → 生成谱面。
     全程在浏览器本地完成，音频不会上传到任何地方。 */

  var FFT_SIZE = 1024;
  var HOP = 512;

  function makeFFT(n) {
    var half = n >> 1;
    var cos = new Float32Array(half);
    var sin = new Float32Array(half);
    for (var i = 0; i < half; i++) {
      cos[i] = Math.cos(-2 * Math.PI * i / n);
      sin[i] = Math.sin(-2 * Math.PI * i / n);
    }
    var bits = Math.round(Math.log(n) / Math.LN2);
    var rev = new Uint32Array(n);
    for (var j = 0; j < n; j++) {
      var x = j, r = 0;
      for (var b = 0; b < bits; b++) { r = (r << 1) | (x & 1); x >>= 1; }
      rev[j] = r;
    }
    return function (re, im) {
      var i2, j2, t;
      for (i2 = 0; i2 < n; i2++) {
        j2 = rev[i2];
        if (j2 > i2) {
          t = re[i2]; re[i2] = re[j2]; re[j2] = t;
          t = im[i2]; im[i2] = im[j2]; im[j2] = t;
        }
      }
      for (var size = 2; size <= n; size <<= 1) {
        var h = size >> 1;
        var step = n / size;
        for (var s = 0; s < n; s += size) {
          for (var k = s, idx = 0; k < s + h; k++, idx += step) {
            var tre = re[k + h] * cos[idx] - im[k + h] * sin[idx];
            var tim = re[k + h] * sin[idx] + im[k + h] * cos[idx];
            re[k + h] = re[k] - tre; im[k + h] = im[k] - tim;
            re[k] += tre; im[k] += tim;
          }
        }
      }
    };
  }

  function nextTick() {
    return new Promise(function (r) { setTimeout(r, 0); });
  }

  /** 分析 AudioBuffer → {notes, bpm, level, density, duration}（异步分片，带进度） */
  function analyzeBuffer(buffer, onProgress) {
    var chCount = buffer.numberOfChannels;
    var len = buffer.length;
    var sr = buffer.sampleRate;
    var mono = new Float32Array(len);
    for (var c = 0; c < chCount; c++) {
      var data = buffer.getChannelData(c);
      for (var i = 0; i < len; i++) mono[i] += data[i] / chCount;
    }

    var fft = makeFFT(FFT_SIZE);
    var win = new Float32Array(FFT_SIZE);
    for (var w = 0; w < FFT_SIZE; w++) win[w] = 0.5 - 0.5 * Math.cos(2 * Math.PI * w / (FFT_SIZE - 1));

    var frames = Math.max(1, Math.floor((len - FFT_SIZE) / HOP));
    var re = new Float32Array(FFT_SIZE);
    var im = new Float32Array(FFT_SIZE);
    var mag = new Float32Array(FFT_SIZE >> 1);
    var prevMag = new Float32Array(FFT_SIZE >> 1);
    var flux = new Float32Array(frames);
    var lowF = new Float32Array(frames);
    var midF = new Float32Array(frames);
    var highF = new Float32Array(frames);

    // 频段边界（bin 下标）
    function hz(h) { return Math.max(1, Math.min((FFT_SIZE >> 1) - 1, Math.round(h * FFT_SIZE / sr))); }
    var b1 = hz(180), b2 = hz(700), b3 = hz(2600);
    var halfN = FFT_SIZE >> 1;

    var frame = 0;
    function step() {
      var budget = Math.max(200, Math.floor(frames / 40));   // 每片处理一批，保证 UI 不卡
      for (var n = 0; n < budget && frame < frames; n++, frame++) {
        var off = frame * HOP;
        for (var k = 0; k < FFT_SIZE; k++) {
          re[k] = mono[off + k] * win[k];
          im[k] = 0;
        }
        fft(re, im);
        for (var m = 0; m < halfN; m++) {
          mag[m] = Math.sqrt(re[m] * re[m] + im[m] * im[m]);
        }
        var f = 0, lo = 0, mi = 0, hi = 0;
        for (var q = 0; q < halfN; q++) {
          var d = mag[q] - prevMag[q];
          if (d > 0) {
            f += d;
            if (q < b1) lo += d;
            else if (q < b2) mi += d;
            else if (q < b3) hi += d;
          }
          prevMag[q] = mag[q];
        }
        flux[frame] = f;
        lowF[frame] = lo;
        midF[frame] = mi;
        highF[frame] = hi;
      }
      if (onProgress) onProgress(Math.min(1, frame / frames) * 0.8);
      if (frame < frames) return nextTick().then(step);
      return null;
    }

    return step().then(function () {
      return finishAnalysis(flux, lowF, midF, highF, sr / HOP, buffer.duration, onProgress);
    });
  }

  /** 起音点 → 谱面 */
  function finishAnalysis(flux, lowF, midF, highF, frameRate, duration, onProgress) {
    var n = flux.length;
    // 自适应阈值：局部窗口均值 + 系数
    var winFrames = Math.max(4, Math.round(frameRate * 0.35));
    var onsets = [];
    var extraChord = [];        // 与主起音几乎同时、但强度也够的起音 → 困难/大师用的"和弦"音符
    var minGapFrames = Math.max(2, Math.round(frameRate * 0.105));
    var lastOnset = -999;

    // 前缀和用于快速求局部均值
    var prefix = new Float64Array(n + 1);
    for (var i = 0; i < n; i++) prefix[i + 1] = prefix[i] + flux[i];
    function localMean(idx) {
      var a = Math.max(0, idx - winFrames);
      var b = Math.min(n, idx + winFrames);
      return (prefix[b] - prefix[a]) / Math.max(1, b - a);
    }

    // 全局峰值参考
    var peak = 0;
    for (var p = 0; p < n; p++) if (flux[p] > peak) peak = flux[p];

    for (var f = 1; f < n - 1; f++) {
      var v = flux[f];
      if (v <= 0) continue;
      if (v < peak * 0.06) continue;                       // 太弱的忽略
      if (v < localMean(f) * 1.35) continue;               // 不突出的忽略
      if (!(v >= flux[f - 1] && v >= flux[f + 1])) continue; // 只取局部极大
      if (f - lastOnset < minGapFrames) {
        // 离上一个太近：先看它是不是"同一拍上的另一个强音"（和弦/重击），是的话留作和弦候选，
        // 再按强弱决定谁当主音符。低难度会把和弦候选丢掉，困难/大师才放出来。
        if (onsets.length) {
          var lastIdx = onsets[onsets.length - 1];
          if (f - lastIdx <= Math.max(2, Math.round(frameRate * 0.040)) && v > peak * 0.34) {
            extraChord.push({ frame: f, strength: v });
          }
          if (v > flux[lastIdx]) { onsets[onsets.length - 1] = f; lastOnset = f; }
        }
        continue;
      }
      onsets.push(f);
      lastOnset = f;
    }

    // ---- BPM 估计 ----
    // 只用自相关容易被"底鼓+反拍镲"骗到半速/错拍，这里用三个证据一起投票：
    //   ① 起音间隔直方图（最常见的相邻起音间隔，通常是最小的音符单位）
    //   ② 自相关支撑（把候选周期对齐到整首歌的起音强度上）
    //   ③ 速度先验（人对节拍的感觉集中在 100~150 BPM）
    function foldBpm(b) {
      while (b < 70) b *= 2;
      while (b > 180) b /= 2;
      return b;
    }
    function tempoPrior(b) {
      var l = Math.log2(b / 130) / 0.6;
      return Math.exp(-0.5 * l * l);
    }
    function periodSupport(periodSec) {
      var lag = Math.round(periodSec * frameRate);
      if (lag < 1 || lag >= n) return 0;
      var s = 0;
      for (var t = 0; t + lag < n; t++) s += flux[t] * flux[t + lag];
      return s / (n - lag);                       // 按项数归一，避免偏爱短滞后
    }

    var hist = {};
    for (var oi2 = 1; oi2 < onsets.length; oi2++) {
      var dt = (onsets[oi2] - onsets[oi2 - 1]) / frameRate;
      if (dt < 0.08 || dt > 1.2) continue;
      var bin = Math.round(dt * 100);
      hist[bin] = (hist[bin] || 0) + 1;
    }
    var bins = Object.keys(hist).map(Number);
    var bestBin = 0, bestCount = 0;
    for (var bi = 0; bi < bins.length; bi++) {
      var c0 = hist[bins[bi]] + (hist[bins[bi] - 1] || 0) + (hist[bins[bi] + 1] || 0);
      if (c0 > bestCount) { bestCount = c0; bestBin = bins[bi]; }
    }
    var modeDt = bestBin > 0 ? bestBin / 100 : 0.5;

    var candPeriods = [];
    // 众数间隔通常是最小的音符单位（八分/十六分音符），它的整数倍才是"拍"；
    // 注意不能按"拍的范围"过滤众数本身，否则会把八分音符这种关键候选丢掉。
    [modeDt, modeDt * 2, modeDt * 3, modeDt * 4, modeDt / 2, modeDt / 3, modeDt * 1.5].forEach(function (d) {
      if (d > 0.09 && d < 1.6) candPeriods.push(d);
    });
    // 再补上自相关最强的几个滞后
    var lagMin = Math.round(frameRate * 0.30);
    var lagMax = Math.round(frameRate * 1.10);
    var acBest = 0, acBestVal = -1;
    for (var lag2 = lagMin; lag2 <= lagMax; lag2++) {
      var v2 = periodSupport(lag2 / frameRate);
      if (v2 > acBestVal) { acBestVal = v2; acBest = lag2; }
    }
    if (acBest) candPeriods.push(acBest / frameRate);

    var bpm = 120, bpmBest = -1;
    var candDebug = [];
    for (var ci = 0; ci < candPeriods.length; ci++) {
      var per = candPeriods[ci];
      var bp = foldBpm(60 / per);
      // 证据 = 该周期的自相关支撑 × 先验；再给"直方图众数"一点加成
      var evidence = periodSupport(per) * tempoPrior(bp);
      var boosted = false;
      if (Math.abs(per - modeDt) < 0.006 || Math.abs(per - modeDt * 2) < 0.006) { evidence *= 1.15; boosted = true; }
      candDebug.push({
        period: Math.round(per * 1000) / 1000, bpm: Math.round(bp),
        support: Math.round(periodSupport(per) * 1e3) / 1e3,
        prior: Math.round(tempoPrior(bp) * 1000) / 1000,
        evidence: Math.round(evidence * 1e4) / 1e4, boosted: boosted
      });
      if (evidence > bpmBest) { bpmBest = evidence; bpm = bp; }
    }
    bpm = Math.round(bpm * 10) / 10;
    if (!isFinite(bpm) || bpm <= 0) bpm = 120;

    var totalTime = duration;

    // 起音 → 音符
    var notes = [];
    var laneLast = [-9, -9, -9, -9];
    var laneCount = [0, 0, 0, 0];
    var maxSim = 2;
    var laneTurn = 0;
    var minGap = 0.115;
    var sustainFrames = Math.round(frameRate * 0.28);

    function pickLess(a, b) { return laneCount[a] <= laneCount[b] ? a : b; }

    for (var oi = 0; oi < onsets.length; oi++) {
      var idx = onsets[oi];
      var time = idx / frameRate;
      if (time < 0.35 || time > totalTime - 0.15) continue;

      // 分频段决定轨道：低频→外侧两轨，中频→内侧两轨，高频→全局最空的一轨；
      // 组内再按当前计数挑更空的那条，保证四条轨用得上、不会偏科。
      var lo = lowF[idx] || 0, mi = midF[idx] || 0, hi = highF[idx] || 0;
      var lane;
      if (lo >= mi && lo >= hi) lane = pickLess(0, 3);
      else if (mi >= hi) lane = pickLess(1, 2);
      else {
        lane = 0;
        for (var lq = 1; lq < 4; lq++) if (laneCount[lq] < laneCount[lane]) lane = lq;
      }
      laneTurn++;

      if (time - laneLast[lane] < minGap) {
        var alt = (lane + (laneTurn % 3) + 1) % 4;
        if (time - laneLast[alt] >= minGap) lane = alt;
        else continue;
      }
      // 同时按键数控制（手机友好）
      var sim = 0;
      for (var ni = notes.length - 1; ni >= 0 && notes[ni].time > time - 0.05; ni--) {
        if (Math.abs(notes[ni].time - time) < 0.028) sim++;
      }
      if (sim >= maxSim) continue;

      // 持续能量 → 长按
      var hold = 0;
      var sustained = 0;
      for (var sf = idx; sf < Math.min(n, idx + Math.round(frameRate * 0.9)); sf++) {
        if (flux[sf] > (flux[idx] || 0) * 0.35) sustained++;
        else break;
      }
      if (sustained > sustainFrames) hold = Math.min(1.1, sustained / frameRate);

      laneLast[lane] = time + hold;
      laneCount[lane]++;
      notes.push({
        time: Math.round(time * 1000) / 1000,
        lane: lane,
        hold: Math.round(hold * 1000) / 1000,
        bonus: oi % 21 === 10
      });
    }

    // ---- 和弦音符：把"同一拍上的另一个强起音"补成第二条轨上的音符 ----
    // 只做标记（chord: true），由游戏按难度决定要不要显示（困难/大师才用）。
    function laneBusyAt(t, lane) {
      for (var q = 0; q < notes.length; q++) {
        if (notes[q].lane === lane && Math.abs(notes[q].time - t) < 0.09) return true;
      }
      return false;
    }
    var chordCount = 0;
    for (var ci = 0; ci < extraChord.length; ci++) {
      var ct = extraChord[ci].frame / frameRate;
      // 找最近的已生成音符（±50ms）当主音符
      var bestI = -1, bestD = 0.05;
      for (var qi = 0; qi < notes.length; qi++) {
        var d = Math.abs(notes[qi].time - ct);
        if (d < bestD && !notes[qi].chord) { bestD = d; bestI = qi; }
      }
      if (bestI < 0) continue;
      var prim = notes[bestI];
      if (prim.hold > 0) continue;                       // 长按旁边再塞一个太难了
      if (prim.chordOf != null) continue;
      // 挑一条不同的、同一时刻没被占用的轨
      var pickLane = -1;
      for (var li = 0; li < 4; li++) {
        var cand = (prim.lane + 1 + li) % 4;
        if (cand !== prim.lane && !laneBusyAt(prim.time, cand)) { pickLane = cand; break; }
      }
      if (pickLane < 0) continue;
      notes.push({
        time: prim.time,
        lane: pickLane,
        hold: 0,
        bonus: false,
        chord: true,
        chordOf: prim.lane
      });
      prim.chordWith = pickLane;
      chordCount++;
    }
    if (chordCount) notes.sort(function (a, b) { return a.time - b.time || a.lane - b.lane; });

    // 给"我的音乐"也加滑音 + 方向滑音（用户可在游戏里关掉）
    notes = addSlides(notes, 0.12, 20240707);
    notes = addSwipes(notes, 0.09, 20240909);

    var density = notes.length / Math.max(1, totalTime);
    var debugInfo = { modeDt: Math.round(modeDt * 1000) / 1000, candidates: candDebug };
    var level = Math.max(1, Math.min(15, Math.round(density * 3.2)));
    if (onProgress) onProgress(1);
    return {
      notes: notes,
      bpm: Math.round(bpm * 10) / 10,
      level: level,
      density: density,
      duration: totalTime,
      noteCount: notes.length,
      debug: debugInfo
    };
  }

  /** 分析一个 File/Blob（本地文件，不会上传） */
  function analyzeFile(file, onProgress) {
    return new Promise(function (resolve, reject) {
      var c = ac();
      if (!c) { reject(new Error('当前浏览器不支持 Web Audio')); return; }
      if (!c.decodeAudioData) { reject(new Error('当前浏览器不支持音频解码')); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('读取文件失败')); };
      reader.onload = function () {
        var buf = reader.result;
        var done = function (audioBuffer) {
          try {
            analyzeBuffer(audioBuffer, onProgress).then(function (res) {
              res.name = (file.name || '未命名').replace(/\.[^.]+$/, '');
              res.size = file.size || 0;
              resolve(res);
            }, reject);
          } catch (e) { reject(e); }
        };
        var fail = function () { reject(new Error('解码失败：格式可能不受支持（试试 mp3 / m4a / wav）')); };
        try {
          var p = c.decodeAudioData(buf, done, fail);
          if (p && p.then) p.then(done, fail);
        } catch (e) { fail(); }
      };
      reader.readAsArrayBuffer(file);
    });
  }

  /* ====================== 本地曲库（IndexedDB） ====================== */
  var DB_NAME = 'nj-music-library';
  var DB_STORE = 'tracks';
  var dbPromise = null;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!global.indexedDB) { reject(new Error('浏览器不支持本地曲库（IndexedDB）')); return; }
      var req = global.indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: 'id' });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('打开曲库失败')); };
    });
    return dbPromise;
  }

  function tx(mode, fn) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(DB_STORE, mode);
        var store = t.objectStore(DB_STORE);
        var out = fn(store);
        t.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { reject(t.error); };
      });
    });
  }

  function metaOf(rec) {
    return {
      id: rec.id, name: rec.name, size: rec.size, addedAt: rec.addedAt,
      bpm: rec.bpm, duration: rec.duration, noteCount: rec.noteCount,
      level: rec.level, density: rec.density, local: true
    };
  }

  var library = {
    available: function () { return !!global.indexedDB; },
    list: function () {
      return tx('readonly', function (store) { return store.getAll(); }).then(function (all) {
        return (all || []).filter(function (r) { return r && r.meta !== false; })
          .map(metaOf)
          .sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });
      });
    },
    get: function (id) {
      return tx('readonly', function (store) { return store.get(id); }).then(function (rec) {
        if (!rec) throw new Error('曲库里没有这条记录');
        return rec;
      });
    },
    remove: function (id) {
      return tx('readwrite', function (store) { return store.delete(id); });
    },
    /** 分析 + 入库；已存在同名同大小的记录会直接复用 */
    add: function (file, onProgress) {
      var id = 'local-' + file.name + '-' + file.size;
      return library.list().then(function (list) {
        var dup = list.filter(function (t) { return t.id === id; })[0];
        if (dup) return dup;
        return analyzeFile(file, onProgress).then(function (res) {
          var rec = {
            id: id, name: res.name, size: res.size, addedAt: Date.now(),
            bpm: res.bpm, duration: res.duration, noteCount: res.noteCount,
            level: res.level, density: res.density,
            notes: res.notes, blob: file
          };
          return tx('readwrite', function (store) { store.put(rec); }).then(function () { return metaOf(rec); });
        });
      });
    }
  };

  /** 播放本地曲目（原曲 + 自动谱面）。audio 用 <audio> 播放，时钟即 currentTime。 */
  function playLocal(id, opts) {
    opts = opts || {};
    return library.get(id).then(function (rec) {
      stop();
      var url = URL.createObjectURL(rec.blob);
      var song = {
        events: [],
        notes: rec.notes || [],
        duration: rec.duration || 0,
        noteCount: (rec.notes || []).length,
        density: rec.density || 0,
        level: rec.level || 1,
        local: true

    '.rg-result{width:100%;display:flex;flex-direction:column;gap:6px;font-size:12.5px}',
    '.rg-result>div{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.06)}',
    '.rg-result span{color:#a9b6d6}',
    '.rg-result b{font-weight:800}',
    '.rg-bars{width:100%;display:flex;flex-direction:column;gap:5px;font-size:11px}',
    '.rg-bars i{display:block;height:8px;border-radius:4px;background:currentColor;width:0;transition:width .6s ease}',
    '.rg-newbest{margin:0;font-size:13px;font-weight:800;color:#fcd34d}',
    '.rg-fail{color:#fca5a5;font-weight:800}',
    '.rg-legal{margin:10px 0 2px;font-size:11.5px;color:#8fa0c4;text-align:center;letter-spacing:.02em}',
    /* 建议全屏（跟主页面设置联动，已全屏就不显示） */
    '.rg-fs-hint{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;',
    'padding:10px 12px;border-radius:14px;border:1px solid rgba(125,211,252,.45);',
    'background:linear-gradient(135deg,rgba(125,211,252,.16),rgba(249,168,212,.10));',
    'font-size:13px;font-weight:700;color:#dbeeff}',
    '.rg-fs-hint[hidden]{display:none!important}',
    '.rg-fs-btn{font:inherit;font-size:13px;font-weight:800;min-height:44px;padding:10px 20px;border-radius:999px;border:0;',
    'color:#0b1020;background:linear-gradient(135deg,#7dd3fc,#f9a8d4);flex:none}',
    '.rg-fs-btn:active{transform:translateY(1px)}',
    /* 等待音频/谱面加载的弹窗（加载完自动关闭） */
    '.rg-loading{position:fixed;inset:0;z-index:97;display:flex;align-items:center;justify-content:center;',
    'background:rgba(4,7,16,.72);backdrop-filter:blur(3px);padding:24px}',
    '.rg-loading-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 24px;border-radius:18px;',
    'background:linear-gradient(160deg,#1b2440,#101728);border:1px solid rgba(125,211,252,.4);box-shadow:0 24px 60px rgba(0,0,0,.5);',
    'text-align:center;max-width:88vw}',
    '.rg-loading-card b{font-size:16px;font-weight:800;color:#eaf1ff}',
    '.rg-loading-card span{font-size:12px;color:#93a4c8}',
    '.rg-loading-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(125,211,252,.25);border-top-color:#7dd3fc;',
    'animation:rg-spin .8s linear infinite}',
    '@keyframes rg-spin{to{transform:rotate(360deg)}}',
  ].join('');

  function ensureStyle() {
    if (typeof document === 'undefined') return;
    if (document.getElementById(STYLE_ID)) return;
    var s = document.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    (document.head || document.documentElement).appendChild(s);
  }

  function create(container, opts) {
    opts = opts || {};
    ensureStyle();
    var self = {};
    var music = global.NJMusic;
    var tracks = music ? music.tracks : [];
    var set = loadSettings();

    /* ----------------------------- DOM ----------------------------- */
    var root = document.createElement('div');
    root.className = 'rg';
    root.innerHTML =
      '<canvas class="rg-canvas"></canvas>' +
      '<div class="rg-hud">' +
      '  <div class="rg-hud-top">' +
      '    <button class="rg-icon" data-act="back" title="返回首页">‹ 首页</button>' +
      '    <div class="rg-song"><b></b><span></span></div>' +
      '    <button class="rg-icon" data-act="pause" title="暂停">❚❚</button>' +
      '  </div>' +
      '  <div class="rg-progress"><i></i></div>' +
      '</div>' +
      '<div class="rg-overlay"></div>';
    container.appendChild(root);

    var canvas = root.querySelector('.rg-canvas');
    var ctx = canvas.getContext('2d');
    var overlay = root.querySelector('.rg-overlay');
    var songTitle = root.querySelector('.rg-song b');
    var songSub = root.querySelector('.rg-song span');
    var progressBar = root.querySelector('.rg-progress i');

    /* --------------------------- 画布尺寸 --------------------------- */
    var vw = 720, vh = 960, dpr = 1;
    function resize() {
      var w = container.clientWidth || 720;
      var h = container.clientHeight || 960;
      var aspect = w / Math.max(1, h);
      vh = 960;
      vw = Math.round(clamp(vh * aspect, 420, 1500));
      dpr = Math.min(global.devicePixelRatio || 1, 2);
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      layout();
    }
    function layout() {
      var laneAreaW = Math.min(vw * 0.94, 660);
      S.laneW = laneAreaW / 4;
      S.x0 = (vw - laneAreaW) / 2;
      S.judgeY = vh - Math.max(132, vh * 0.17);
      S.topY = Math.max(90, vh * 0.09);
      S.speed = (S.judgeY - S.topY) / (S.approach / set.speed);   // 音符速度可调
    }
    var S = { laneW: 120, x0: 60, judgeY: 800, topY: 90, speed: 400, approach: 1.65 };

    /* ---------------------------- 状态 ---------------------------- */
    var state = 'select';           // select | playing | paused | result
    function setState(s) {
      state = s;
      if (root && root.setAttribute) root.setAttribute('data-state', s);
    }
    var track = null;               // 选中的曲目对象
    var song = null;                // 谱面数据
    var player = null;
    var notes = [];                 // 运行时音符
    var combo = 0, maxCombo = 0, score = 0;
    var counts = { perfect: 0, great: 0, good: 0, miss: 0 };
    var totalNotes = 0, judged = 0, weightSum = 0;
    var effects = [];               // 打击特效
    var popups = [];                // 判定飘字
    var laneFlash = [0, 0, 0, 0];
    var laneHeld = [false, false, false, false];
    var pointerLane = {};           // pointerId -> lane
    var pointerSlide = {};          // pointerId -> 正在滑动的音符
    var pointerStart = {};          // pointerId -> {x,y,t,lane} 用于识别滑动
    var swipeTrails = [];           // 滑动轨迹特效
    var sparks = [];                // 长按火花的持续特效
    var holdActiveCount = 0;        // 当前正在按住的长按音符数
    var startTime = 0, lastTime = 0, songTime = 0;
    var rafId = 0, ended = false;
    var volume = music ? music.getVolume() : 0.85;
    var isLocalTrack = false;       // 这局是不是"我的音乐"
    var isRemoteTrack = false;      // 这局是不是 music/ 里的原曲
    var bgHue = 0;
    var hp = 100, failed = false;   // 血条：漏太多会当场失败
    var autoplay = false;           // 演示模式
    var comboFlash = 0;             // 连击里程碑闪光
    var beatPulse = 0;              // 节拍脉动 0~1
    var lastBeat = -1;
    var firstNoteTime = 0;

    /* ---------------------------- 曲目列表 ---------------------------- */
    var TRACK_COLORS = ['#7dd3fc', '#f9a8d4', '#fcd34d', '#a7f3d0', '#c4b5fd'];

    function stars(level) {
      var n = clamp(Math.round(level / 3), 1, 5);
      var s = '';
      for (var i = 0; i < 5; i++) s += i < n ? '★' : '☆';
      return s;
    }

    function trackRow(t, idx) {
      var best = loadBest(t.id);
      var color = TRACK_COLORS[idx % TRACK_COLORS.length];
      return '<button class="rg-track" data-act="track" data-track="' + t.id + '" style="--c:' + color + '">' +
        '<span class="rg-track-name">' + t.name + ' <span class="rg-stars">' + stars(t.level) + '</span></span>' +
        '<span class="rg-track-sub">' + t.sub + '</span>' +
        '<span class="rg-track-meta">BPM ' + t.bpm + ' · ' + t.difficulty.toUpperCase() + ' · Lv.' + t.level +
        ' · ' + t.noteCount + ' 音符 · ' + Math.round(t.duration) + 's</span>' +
        '<span class="rg-track-best">' + bestHtmlOf(best) + '</span>' +
        '</button>';
    }

    function bestKey(id) { return 'njrhythm-best-' + id; }
    function loadBest(id) {
      try {
        var v = global.localStorage && global.localStorage.getItem(bestKey(id));
        return v ? JSON.parse(v) : null;
      } catch (e) { return null; }
    }
    function saveBest(id, data) {
      try {
        if (!global.localStorage) return false;
        global.localStorage.setItem(bestKey(id), JSON.stringify(data));
        return true;
      } catch (e) { return false; }        // 隐私模式等：存不了也不能崩
    }
    /* ---------------------- 全屏（跟主页面设置联动） ----------------------
       主页面设置里已经点过全屏 → 这里就不再提示"建议全屏游玩"，也不放按钮。 */
    function fsSupported() {
      var shell = global.NJShell;
      if (shell && shell.supported) return !!shell.supported();
      var el = global.document && global.document.documentElement;
      return !!(el && (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen));
    }
    function fsOn() {
      var shell = global.NJShell;
      if (shell && shell.fullscreenOn) return !!shell.fullscreenOn();
      var d = global.document;
      return !!(d && (d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement));
    }
    function enterFs() {
      var shell = global.NJShell;
      // 用整个外壳进全屏（而不是只让游戏容器全屏），否则顶栏的"返回"会被盖住
      if (shell && shell.enterFullscreen) return shell.enterFullscreen();
      var d = global.document;
      var el = (self.root || (d && d.documentElement));
      if (!d || !el) return false;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
      if (!fn) return false;
      try {
        var r = fn.call(el);
        if (r && r.catch) r.catch(function () { /* 被拒：忽略 */ });
        return true;
      } catch (e) { return false; }
    }
    /**
     * 该不该显示"建议全屏游玩（竖屏）"：
     *  - 已经全屏（或从主屏图标启动）→ 不显示
     *  - 支持全屏但没开 → 显示，按钮直接进全屏
     *  - 浏览器不支持（iPhone Safari / 微信内置）→ 也显示，按钮改成"怎么全屏"的说明
     *    （否则用户会像之前那样"一个按钮都看不到"）
     */
    function refreshFullscreenHint() {
      var el = overlay && overlay.querySelector ? overlay.querySelector('[data-fs-hint]') : null;
      if (!el) return;
      var shell = global.NJShell;
      var satisfied = !!(shell && shell.fullscreenOn && shell.fullscreenOn());
      var unsupported = !fsSupported();
      el.hidden = satisfied;
      var btn = el.querySelector ? el.querySelector('[data-act="fullscreen"]') : null;
      var label = el.querySelector ? el.querySelector('[data-fs-text]') : null;
      if (btn) btn.textContent = unsupported ? '怎么全屏' : '全屏';
      if (label) label.textContent = unsupported ? '全屏游玩（参见说明）' : '建议全屏游玩（竖屏）';
    }

    /** 卡片上的"最好成绩"两行文字 */
    function bestHtmlOf(best) {
      if (!best) return '尚未挑战';
      var rankTxt = best.failed ? '未完成' : best.rank;
      var html = '最好 ' + best.score + '<br>' + rankTxt + ' · ' + ((best.acc || 0) * 100).toFixed(1) + '%';
      // 之前中途结束、后来又通关过：额外显示通关成绩，避免"未完成"误导
      if (best.failed && best.clearedScore != null) {
        html += '<br>通关 ' + best.clearedScore + ' ' + (best.clearedRank || '');
      }
      return html;
    }
    /** 最近一局的存档情况（调试/自动化用） */
    var lastSave = null;

    /* ---------------------- 原曲（服务端 music/） ---------------------- */
    var remoteTracks = [];       // 原曲列表（有 music/charts.json 时才有）
    var remoteLoaded = false;

    function loadRemote() {
      if (!music || !music.loadRemoteCharts) { remoteLoaded = true; return Promise.resolve([]); }
      showAudioLoading();                       // 等待音频/谱面加载 → 弹窗提示，加载完自动关
      return music.loadRemoteCharts('music/charts.json').then(function () {
        remoteTracks = music.remoteTracks ? music.remoteTracks() : [];
        remoteLoaded = true;
        hideAudioLoading();
        return remoteTracks;
      }, function () {
        remoteLoaded = true; remoteTracks = [];
        hideAudioLoading();
        return [];
      });
    }

    /* ------------------- "等待音频加载…" 弹窗 ------------------- */
    var loadModal = null, loadTimer = 0;
    function showAudioLoading() {
      if (loadModal || loadTimer) return;
      var d = global.document;
      if (!d) return;
      // 很快加载完就不闪这一下了
      loadTimer = setTimeout(function () {
        loadTimer = 0;
        if (remoteLoaded || !global.document) return;
        var el = global.document.createElement('div');
        el.className = 'rg-loading';
        el.setAttribute('role', 'status');
        el.innerHTML =
          '<div class="rg-loading-card">' +
          '  <div class="rg-loading-spin"></div>' +
          '  <b>等待音频加载…</b>' +
          '  <span>正在读取 music/ 里的音频与谱面</span>' +
          '</div>';
        (root && root.parentNode ? root.parentNode : global.document.body).appendChild(el);
        loadModal = el;
      }, 140);
    }
    function hideAudioLoading() {
      if (loadTimer) { clearTimeout(loadTimer); loadTimer = 0; }
      if (loadModal && loadModal.parentNode) loadModal.parentNode.removeChild(loadModal);
      loadModal = null;
    }

    function remoteRow(t) {
      var best = loadBest(t.id);
      return '<button class="rg-track rg-track-orig" data-act="remotetrack" data-track="' + t.id + '" style="--c:#f9a8d4">' +
        '<span class="rg-track-name">' + escapeHtml(t.name) + '</span>' +
        '<span class="rg-track-sub">你自己的音频 · 谱面已按音频生成</span>' +
        '<span class="rg-track-meta">BPM ' + t.bpm + ' · Lv.' + t.level + ' · ' + t.noteCount +
        ' 音符 · ' + fmtDur(t.duration) + '</span>' +
        '<span class="rg-track-best">' + bestHtmlOf(best) + '</span>' +
        '</button>';
    }

    function synthRow(t) {
      var best = loadBest(t.id);
      return '<button class="rg-track" data-act="track" data-track="' + t.id + '" style="--c:#a5b4fc">' +
        '<span class="rg-track-name">' + t.name + ' <span class="rg-tag rg-tag-synth">合成</span></span>' +
        '<span class="rg-track-sub">' + t.sub + '</span>' +
        '<span class="rg-track-meta">BPM ' + t.bpm + ' · ' + t.difficulty.toUpperCase() + ' · Lv.' + t.level +
        ' · ' + t.noteCount + ' 音符 · ' + fmtDur(t.duration) + '</span>' +
        '<span class="rg-track-best">' + bestHtmlOf(best) + '</span>' +
        '</button>';
    }

    /** 曲目列表：有你自己的音频就列它们；完全没有音频时才兜底列合成编曲版 */
    function trackListHtml() {
      var html = '';
      if (remoteTracks.length) {
        html += '<div class="rg-group">曲目（谱面已按音频生成）</div>';
        html += '<div class="rg-tracks">' + remoteTracks.map(remoteRow).join('') + '</div>';
      } else {
        // 只有"没放音频"的兜底情况才会走到这里
        html += '<div class="rg-group">' + (remoteLoaded
          ? '没找到 music/ 里的音频（把 mp3 放进 music/ 并运行 node tools/build-charts.js）'
          : '正在检查音频…') + '</div>';
        html += '<div class="rg-tracks">' + tracks.map(synthRow).join('') + '</div>';
      }
      return html;
    }

    /** 音符密度：稀疏/标准/密集（和弦音符不能被抽稀掉，否则它和主音符会错位） */
    function densityApply(list) {
      var gap = DENSITY[set.density];
      if (!gap) return list;
      var out = [];
      var last = -9;
      for (var i = 0; i < list.length; i++) {
        var n = list[i];
        if (n.chord) { out.push(n); continue; }
        if (n.time - last < gap) continue;
        out.push(n);
        last = n.time + (n.hold || 0);
      }
      return out;
    }
    /* ---------------------- 我的音乐（本地曲库） ---------------------- */
    var localTracks = [];        // 曲库里的曲目（只含元数据）
    var localLoading = false;
    var localProgress = 0;
    var localMessage = '';

    function refreshLibrary() {
      if (!music || !music.library || !music.library.available()) {
        localTracks = [];
        return Promise.resolve(localTracks);
      }
      return music.library.list().then(function (list) {
        localTracks = list || [];
        return localTracks;
      }, function () { localTracks = []; return localTracks; });
    }

    function fmtDur(sec) {
      sec = Math.max(0, Math.round(sec || 0));
      return Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2);
    }

    function localRow(t) {
      var best = loadBest(t.id);
      return '<div class="rg-local">' +
        '<button class="rg-track" data-act="localtrack" data-track="' + t.id + '" style="--c:#a7f3d0">' +
        '<span class="rg-track-name">' + escapeHtml(t.name) + '</span>' +
        '<span class="rg-track-sub">你自己的音频 · 本地分析</span>' +
        '<span class="rg-track-meta">BPM ' + t.bpm + ' · Lv.' + t.level + ' · ' + t.noteCount +
        ' 音符 · ' + fmtDur(t.duration) + '</span>' +
        '<span class="rg-track-best">' + bestHtmlOf(best) + '</span>' +
        '</button>' +
        '<button class="rg-del" data-act="localtrack-del" data-track="' + t.id + '" title="从曲库删除">✕</button>' +
        '</div>';
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function libraryHtml() {
      var supported = music && music.library && music.library.available();
      var head = '<div class="rg-lib">' +
        '<div class="rg-lib-head"><b>我的音乐</b><span>用你自己拥有的音频文件来玩，谱面按音频自动生成</span></div>';
      if (!supported) {
        return head + '<p class="rg-note">当前浏览器不支持本地曲库（IndexedDB），只能玩内置曲目。</p></div>';
      }
      var body = '';
      if (localLoading) {
        body += '<div class="rg-analyzing"><div class="rg-analyzing-bar"><i style="width:' +
          Math.round(localProgress * 100) + '%"></i></div><span>分析中 ' + Math.round(localProgress * 100) +
          '% · 正在识别鼓点与旋律（文件不会上传）</span></div>';
      } else {
        body += '<label class="rg-add">＋ 添加音频文件（可多选：mp3 / m4a / wav / flac…）' +
          '<input type="file" accept="audio/*" multiple data-act="localfiles"></label>';
        body += '<div class="rg-drop" data-drop="1">或把音频文件拖到这里</div>';
      }
      if (localMessage) body += '<p class="rg-note">' + escapeHtml(localMessage) + '</p>';
      if (localTracks.length) {
        body += '<div class="rg-tracks">' + localTracks.map(localRow).join('') + '</div>';
      } else if (!localLoading) {
        body += '<p class="rg-note">曲库还是空的。添加后文件只保存在这台设备的浏览器里，下次打开直接能玩。</p>';
      }
      return head + body + '</div>';
    }

    function addLocalFiles(files) {
      if (!files || !files.length || localLoading) return;
      var list = [];
      for (var i = 0; i < files.length; i++) {
        if (files[i] && (!files[i].type || /audio|octet-stream/.test(files[i].type) || /\.(mp3|m4a|aac|wav|flac|ogg|opus|webm)$/i.test(files[i].name))) {
          list.push(files[i]);
        }
      }
      if (!list.length) { localMessage = '没有识别到音频文件'; showSelect(); return; }
      localLoading = true;
      localProgress = 0;
      localMessage = '';
      showSelect();
      var idx = 0;
      var okCount = 0;
      function next() {
        if (idx >= list.length) {
          localLoading = false;
          localMessage = '已添加 ' + okCount + ' 首到本地曲库';
          refreshLibrary().then(showSelect);
          return;
        }
        var f = list[idx++];
        localMessage = '正在分析：' + f.name;
        localProgress = 0;
        music.library.add(f, function (p) {
          localProgress = p;
          var bar = overlay.querySelector('.rg-analyzing-bar i');
          if (bar) bar.style.width = Math.round(p * 100) + '%';
          var lab = overlay.querySelector('.rg-analyzing span');
          if (lab) lab.textContent = f.name + ' · 分析中 ' + Math.round(p * 100) + '%';
        }).then(function () {
          okCount++;
          next();
        }, function (err) {
          localMessage = '「' + f.name + '」失败：' + (err && err.message ? err.message : '未知错误');
          next();
        });
      }
      next();
    }

    function diffBtn(key) {
      var d = DIFFS[key];
      return '<button class="rg-diff' + (set.diff === key ? ' is-active' : '') + '" data-act="diff" data-diff="' + key + '">' +
        '<b>' + d.name + '</b><span>' + d.desc + '</span></button>';
    }

    function showSelect() {
      setState('select');
      stopMusic();
      songTitle.textContent = '节奏打击';
      songSub.textContent = '内置 5 首 + 我的音乐';
      progressBar.style.width = '0%';
      overlay.hidden = false;
      overlay.innerHTML =
        '<div class="rg-panel">' +
        '<h2 class="rg-h2">选择曲目</h2>' +
        '<div class="rg-fs-hint" data-fs-hint hidden>' +
        '  <span data-fs-text>建议全屏游玩（竖屏）</span>' +
        '  <button class="rg-fs-btn" data-act="fullscreen" type="button">全屏</button>' +
        '</div>' +
        trackListHtml() +
        '<p class="rg-note">上面的曲目用你自己放在 <b>music/</b> 的音频，谱面由音频离线分析生成（鼓点/贝斯/旋律分别落到不同轨）。</p>' +
        '<div class="rg-adv">' +
        '  <div class="rg-adv-title">难度</div>' +
        '  <div class="rg-diffs">' + DIFF_KEYS.map(diffBtn).join('') + '</div>' +
        '</div>' +
        '<div class="rg-adv">' +
        '  <div class="rg-adv-title">音符与判定</div>' +
        '  <label class="rg-speed">音符速度 <input type="range" min="60" max="220" step="5" value="' + Math.round(set.speed * 100) + '" data-act="speed"><b data-speed-val>' + set.speed.toFixed(2) + '×</b></label>' +
        '  <div class="rg-dens">音符密度' + ['sparse', 'normal', 'dense'].map(function (k) {
          var label = { sparse: '稀疏', normal: '标准', dense: '密集' }[k];
          return '<button class="rg-densbtn' + (set.density === k ? ' is-active' : '') + '" data-act="density" data-d="' + k + '">' + label + '</button>';
        }).join('') + '</div>' +
        '  <label class="rg-vib">长按音符（按住不放）<input type="checkbox" data-act="hold"' + (set.hold ? ' checked' : '') + '></label>' +
        '  <label class="rg-vib">滑动音符（按住横向滑）<input type="checkbox" data-act="slide"' + (set.slide ? ' checked' : '') + '></label>' +
        '  <label class="rg-vib">方向滑音（上滑/左滑/右滑）<input type="checkbox" data-act="swipe"' + (set.swipe ? ' checked' : '') + '></label>' +
        '  <label class="rg-vib">打击震动 <input type="checkbox" data-act="vibrate"' + (set.vibrate ? ' checked' : '') + '>（部分手机支持）</label>' +
        '  <label class="rg-offset">判定延迟校准 <input type="range" min="-300" max="300" step="5" value="' + set.offset + '" data-act="offset"><b data-offset-val>' + set.offset + ' ms</b></label>' +
        '</div>' +
        // 我的音乐放在最后（在 难度 / 音符与判定 之后），下面是操作提示与版权提示两行小字
        libraryHtml() +
        '<p class="rg-tip">手机：点按对应轨道；长按音符按住不放；<b>方向滑音</b>朝箭头方向快速滑一下 · 蓝牙耳机建议用延迟校准</p>' +
        '<p class="rg-legal">如有侵权，请联系我。</p>' +
        '</div>';
      refreshFullscreenHint();
    }

    function showResult() {
      setState('result');
      overlay.hidden = false;
      var acc = totalNotes ? weightSum / totalNotes : 0;
      var rank = rankOf(acc);
      var prev = loadBest(track.id) || {};
      var hasPrev = prev.score != null;
      // 失败（血条耗尽）也保存最高分 —— 否则玩家"打了却没记录"，体验很差
      var data = {
        score: prev.score || 0, acc: prev.acc || 0, rank: prev.rank || '-',
        combo: prev.combo || 0, failed: !!prev.failed,
        clearedScore: prev.clearedScore != null ? prev.clearedScore : null,
        clearedRank: prev.clearedRank || null
      };
      var isBest = !hasPrev || score > prev.score;      // 第一次记录（哪怕 0 分）也算
      if (isBest) {
        data.score = score;
        data.acc = acc;
        data.rank = rank;
        data.combo = maxCombo;
        data.failed = !!failed;
      }
      if (!failed && score > (prev.clearedScore == null ? -1 : prev.clearedScore)) {
        data.clearedScore = score;
        data.clearedRank = rank;
      }
      var wrote = false;
      if (!hasPrev || isBest || (data.clearedScore !== prev.clearedScore)) wrote = saveBest(track.id, data);
      lastSave = { key: bestKey(track.id), score: score, failed: !!failed, isBest: isBest, wrote: wrote, data: data };
      var dist = [
        ['完美', 'perfect', '#fcd34d'],
        ['优秀', 'great', '#7dd3fc'],
        ['良好', 'good', '#a7f3d0'],
        ['失误', 'miss', '#fca5a5']
      ];
      var barHtml = '';
      for (var i = 0; i < dist.length; i++) {
        var key = dist[i][1];
        var pct = totalNotes ? (counts[key] / totalNotes) * 100 : 0;
        barHtml += '<div style="color:' + dist[i][2] + '">' + dist[i][0] + ' ' + counts[key] +
          '<i style="width:' + pct.toFixed(1) + '%"></i></div>';
      }
      overlay.innerHTML =
        '<div class="rg-panel">' +
        '<h2 class="rg-h2">' + track.name + ' · 结算</h2>' +
        (failed ? '<p class="rg-fail">生命值耗尽，中途结束</p>' : '') +
        '<div class="rg-rank rg-rank-' + rank + '">' + rank + '</div>' +
        '<div class="rg-result">' +
        '  <div><span>分数</span><b>' + score + '</b></div>' +
        '  <div><span>准确率</span><b>' + (acc * 100).toFixed(2) + '%</b></div>' +
        '  <div><span>最大连击</span><b>' + maxCombo + ' / ' + totalNotes + '</b></div>' +
        '  <div><span>击打数 / 总音符</span><b>' + judged + ' / ' + totalNotes + '</b></div>' +
        '</div>' +
        '<div class="rg-bars">' + barHtml + '</div>' +
        (isBest ? '<p class="rg-newbest">🎉 新纪录！</p>'
          : (prev.score ? '<p class="rg-note">历史最好 ' + prev.score + '（' + (prev.failed ? '未完成' : prev.rank) + '）</p>' : '')) +
        '<div class="rg-row">' +
        '  <button class="rg-btn" data-act="retry">再来一次</button>' +
        '  <button class="rg-btn ghost" data-act="select">换一首</button>' +
        '  <button class="rg-btn ghost" data-act="home">返回首页</button>' +
        '</div>' +
        '<p class="rg-legal">如有侵权，请联系我。</p>' +
        '</div>';
    }

    function showPause() {
      setState('paused');
      if (player) player.stop();
      overlay.hidden = false;
      overlay.innerHTML =
        '<div class="rg-panel">' +
        '<h2 class="rg-h2">已暂停</h2>' +
        '<p class="rg-note">' + track.name + ' · 分数 ' + score + ' · 连击 ' + combo + '</p>' +
        '<div class="rg-volume">音量 <input type="range" min="0" max="100" value="' + Math.round(volume * 100) + '" data-act="volume"></div>' +
        '<div class="rg-row">' +
        '  <button class="rg-btn" data-act="resume">继续</button>' +
        '  <button class="rg-btn ghost" data-act="retry">重来</button>' +
        '  <button class="rg-btn ghost" data-act="select">换一首</button>' +
        '  <button class="rg-btn ghost" data-act="home">返回首页</button>' +
        '</div>' +
        '<p class="rg-legal">如有侵权，请联系我。</p>' +
        '</div>';
    }

    /* ---------------------------- 开始游戏 ---------------------------- */
    /** 内置合成曲目 / 原曲 / 我的音乐。原曲谱面已离线生成，取回后立即开局。 */
    function startTrack(id, offset) {
      track = null;
      isLocalTrack = false;
      isRemoteTrack = false;
      for (var i = 0; i < tracks.length; i++) if (tracks[i].id === id) track = tracks[i];
      if (!track) {
        for (var r = 0; r < remoteTracks.length; r++) {
          if (remoteTracks[r].id === id) { track = remoteTracks[r]; isRemoteTrack = true; }
        }
      }
      if (!track) {
        for (var j = 0; j < localTracks.length; j++) {
          if (localTracks[j].id === id) { track = localTracks[j]; isLocalTrack = true; }
        }
      }
      if (!track) return null;

      if (isRemoteTrack) {
        var rc = music.remoteChart ? music.remoteChart(id) : null;
        if (!rc) { localMessage = '这首曲目的谱面没加载成功'; showSelect(); return null; }
        song = {
          notes: rc.notes || [], events: [],
          duration: rc.duration || 0,
          noteCount: (rc.notes || []).length,
          density: rc.density || 0, level: rc.level || 1, local: true
        };
        beginRun(id, offset || 0);
        return null;
      }

      if (isLocalTrack) {
        // 我的音乐：谱面存在 IndexedDB 里，取回来再开局
        return music.library.get(id).then(function (rec) {
          song = {
            notes: rec.notes || [],
            events: [],
            duration: rec.duration || 0,
            noteCount: (rec.notes || []).length,
            density: rec.density || 0,
            level: rec.level || 1,
            local: true
          };
          beginRun(id, offset || 0);
        }, function (err) {
          localMessage = '读取本地曲目失败：' + (err && err.message ? err.message : '未知错误');
          showSelect();
        });
      }

      song = music.getSong(id);
      beginRun(id, offset || 0);
      return null;
    }

    /** 重置本局状态并开跑 */
    function beginRun(id, offset) {
      var useSlide = !!set.slide;
      var useHold = !!set.hold;
      var useSwipe = !!set.swipe;
      // 和弦音符（同一时刻两个方块）：只有困难和大师模式会出现
      var useChords = !!(DIFFS[set.diff] && DIFFS[set.diff].chords);
      notes = [];
      var src = song.notes || [];
      for (var i = 0; i < src.length; i++) {
        var n = src[i];
        if (n.chord && !useChords) continue;      // 低难度：丢掉和弦的第二个音符
        if (n.slideTail) {
          // 关掉滑音时，被吸收的尾部音符要回归成普通音符
          if (useSlide) continue;
          notes.push({ time: n.time, lane: n.lane, hold: 0, slide: -1, swipe: null, bonus: !!n.bonus, state: 0, y: 0 });
          continue;
        }
        notes.push({
          time: n.time,
          lane: n.lane,
          hold: useHold ? (n.hold || 0) : 0,
          slide: (useSlide && n.slide != null) ? n.slide : -1,
          slideTime: n.slideTime || 0,
          swipe: (useSwipe && n.swipe) ? n.swipe : null,
          chord: !!n.chord,
          bonus: !!n.bonus,
          state: 0,
          y: 0
        });
      }
      notes = densityApply(notes);      // 按"音符密度"设置抽稀（原曲鼓点很密时很有用）
      totalNotes = notes.length;
      judged = 0; weightSum = 0; combo = 0; maxCombo = 0; score = 0;
      counts = { perfect: 0, great: 0, good: 0, miss: 0 };
      effects = [];
      popups = [];
      hp = 100;
      failed = false;
      comboFlash = 0;
      beatPulse = 0;
      lastBeat = -1;
      ended = false;
      songTime = 0;
      firstNoteTime = notes.length ? notes[0].time : 0;
      songTitle.textContent = track.name;
      songSub.textContent = 'BPM ' + track.bpm + ' · Lv.' + track.level + ' · ' + totalNotes + ' 音符' +
        (isLocalTrack ? ' · 本地音频' : '');
      overlay.hidden = true;
      setState('playing');
      launch(id, isLocalTrack, offset);
    }

    /** 起播（原曲=HTTP 音频，内置=合成器，我的音乐=IndexedDB Blob） */
    function launch(id, isLocal, offset) {
      music.stop();
      player = null;
      if (isRemoteTrack) {
        return music.playRemote(id, { offset: offset, onEnd: function () { finish(); } })
          .then(function (p) { player = p || null; }, function (err) {
            localMessage = '播放失败：' + (err && err.message ? err.message : '未知错误') + '（音频文件还在吗？）';
            finish();
          });
      }
      if (isLocal) {
        return music.playLocal(id, { offset: offset, onEnd: function () { finish(); } })
          .then(function (p) { player = p || null; }, function (err) {
            localMessage = '播放失败：' + (err && err.message ? err.message : '未知错误');
            finish();
          });
      }
      player = music.play(id, { offset: offset, onEnd: function () { finish(); } });
      return null;
    }

    function stopMusic() { if (music) music.stop(); player = null; }

    function finish() {
      if (state === 'result') return;
      stopMusic();
      showResult();
    }

    /* ---------------------------- 判定逻辑 ---------------------------- */
    /** 判定窗口随难度缩放 */
    function win(k) {
      var d = DIFFS[set.diff] || DIFFS.normal;
      return WIN[k] * d.win;
    }

    function judgeOf(dt) {
      var a = Math.abs(dt);
      if (a <= win('perfect')) return 'perfect';
      if (a <= win('great')) return 'great';
      if (a <= win('good')) return 'good';
      return 'miss';
    }

    /** 滑音：头部命中后，在 slideDeadline 前把手指（或按键）移到目标轨就算完成 */
    function completeSlide(note, lane) {
      note.state = 2;
      score += 500;
      popups.push({ text: 'SLIDE!', color: '#a7f3d0', lane: lane, t: 0, y: S.judgeY - vh * 0.1, big: false });
      addEffect(lane, 'great', S.judgeY);
      if (music) music.sfx('great');
    }

    function breakSlide(note) {
      note.state = 2;
      combo = 0;
      counts.miss++;
      judged++;
      if (set.hp) hp = Math.max(0, hp - 5);
      popups.push({ text: '滑偏了', color: '#fca5a5', lane: note.lane, t: 0, y: S.judgeY - vh * 0.08, big: false });
      addEffect(note.lane, 'miss', S.judgeY);
      if (music) music.sfx('miss');
      if (set.hp && hp <= 0 && !failed) { failed = true; finish(); }
    }

    function addEffect(lane, j, y) {
      effects.push({
        lane: lane, judge: j, y: y, t: 0,
        parts: (function () {
          var arr = [];
          for (var i = 0; i < (j === 'miss' ? 4 : 9); i++) {
            arr.push({ a: rand(0, Math.PI * 2), v: rand(60, 320), size: rand(2, 6) });
          }
          return arr;
        })()
      });
      if (effects.length > 60) effects.shift();
    }

    function applyJudge(j, note) {
      var lane = note ? note.lane : 0;
      if (j === 'miss') {
        counts.miss++;
        combo = 0;
        hp = Math.max(0, hp - 6);            // 连续漏约 17 个才会挂，容错 ≈25%
        if (set.vibrate) vibrate(35);
      } else {
        counts[j]++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        var mult = 1 + Math.min(combo, 60) * 0.01;
        var base = SCORE[j] * (note && note.bonus ? 2 : 1);
        score += Math.round(base * mult);
        weightSum += j === 'perfect' ? 1 : (j === 'great' ? 0.72 : 0.42);
        hp = Math.min(100, hp + (j === 'perfect' ? 1.8 : j === 'great' ? 0.9 : 0.3));
        if (combo > 0 && combo % 25 === 0) {
          comboFlash = 0.8;
          popups.push({ text: combo + ' COMBO!', color: '#fcd34d', t: 0, y: S.judgeY - vh * 0.2, big: true });
          if (set.vibrate) vibrate([12, 30, 12]);
        } else if (set.vibrate && j === 'perfect' && combo % 5 === 0) {
          vibrate(8);
        }
      }
      judged++;
      popups.push({ text: j.toUpperCase(), color: JUDGE_COLOR[j], lane: lane, t: 0, y: S.judgeY - vh * 0.06, big: false });
      if (popups.length > 24) popups.shift();
      if (music) music.sfx(j === 'miss' ? 'miss' : (j === 'perfect' ? 'perfect' : 'great'));
      if (set.hp && hp <= 0 && !failed) {
        failed = true;
        finish();
      }
    }

    function hitLane(lane, pointerId) {
      if (state !== 'playing') return;
      laneFlash[lane] = 1;
      var bestIdx = -1, bestDt = win('miss');
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (n.lane !== lane || n.state !== 0) continue;
        if (n.swipe) continue;                     // 方向滑音只能用滑动打，点按不算（但也不立刻判错）
        var dt = n.time - songTime;
        if (dt > win('miss')) break;               // 谱面按时间排序，后面的更晚
        if (dt < -win('miss')) continue;
        if (Math.abs(dt) < bestDt) { bestDt = Math.abs(dt); bestIdx = i; }
      }
      if (bestIdx < 0) return;                     // 空按不惩罚
      var note = notes[bestIdx];
      var j = judgeOf(note.time - songTime);
      if (j === 'miss') j = 'good';
      note.headJudge = j;
      if (note.slide >= 0) {
        // 滑音：先判头部，然后要求把手指滑到目标轨
        note.state = 1;
        note.slideDeadline = (note.slideTime || note.time + 0.3) + win('good');
        if (pointerId != null) pointerSlide[pointerId] = note;
        applyJudge(j, note);
      } else if (note.hold > 0.12) {
        note.state = 1;                            // 进入长按
        note.holdEnd = note.time + note.hold;
        note.holdFx = 0;
        applyJudge(j, note);
      } else {
        note.state = 2;
        applyJudge(j, note);
      }
      addEffect(lane, j, S.judgeY);
    }

    /* ------------------- 方向滑音：上滑 / 左滑 / 右滑 ------------------- */
    /** 找这条轨上时间最近的方向滑音 */
    function findSwipeNote(lane, atTime) {
      var best = null, bestDt = win('miss');
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (n.lane !== lane || n.state !== 0 || !n.swipe) continue;
        var dt = n.time - atTime;
        if (dt > win('miss')) break;
        if (Math.abs(dt) < bestDt) { bestDt = Math.abs(dt); best = n; }
      }
      return best;
    }

    /** 判定一次滑动：方向对就按时间给判定，方向错直接算失误 */
    function judgeSwipe(lane, dir, atTime, x0, y0, x1, y1) {
      var note = findSwipeNote(lane, atTime);
      addSwipeTrail(x0, y0, x1, y1, note ? SWIPE_INFO[note.swipe].color : '#94a3b8');
      if (!note) return false;
      if (note.swipe !== dir) {
        // 方向错：算失误（给出正确方向的提示）
        note.state = 2;
        applyJudge('miss', note);
        popups.push({
          text: '要' + SWIPE_INFO[note.swipe].name + '!', color: '#fca5a5', lane: lane,
          t: 0, y: S.judgeY - vh * 0.09, big: false
        });
        return false;
      }
      var j = judgeOf(note.time - atTime);
      if (j === 'miss') j = 'good';
      note.state = 2;
      note.headJudge = j;
      applyJudge(j, note);
      var info = SWIPE_INFO[dir];
      popups.push({
        text: info.name + '!', color: info.color, lane: lane,
        t: 0, y: S.judgeY - vh * 0.11, big: false
      });
      addEffect(lane, j, S.judgeY);
      // 方向性火花：沿着滑动方向甩出去
      for (var p = 0; p < 12; p++) {
        var spread = rand(-0.5, 0.5);
        var speed = rand(220, 520);
        var a = dir === 'up' ? -Math.PI / 2 : (dir === 'left' ? Math.PI : 0);
        a += spread;
        sparks.push({
          x: S.x0 + lane * S.laneW + S.laneW / 2, y: S.judgeY,
          vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
          life: 0.42, max: 0.42, size: rand(2, 4.5), color: info.color, gravity: 240
        });
      }
      if (set.vibrate) vibrate(dir === 'up' ? [10, 20, 10] : 12);
      return true;
    }

    /** 手指/指针移动时识别滑动方向 */
    function detectSwipe(pointerId, x, y) {
      var st = pointerStart[pointerId];
      if (!st) return null;
      var dx = x - st.x;
      var dy = y - st.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var minDist = Math.max(22, Math.min(vw, vh) * 0.035);
      if (dist < minDist) return null;
      var dt = (Date.now() - st.t) / 1000;
      if (dt > 0.6) return null;                   // 太慢不算"快速滑动"
      var dir;
      if (Math.abs(dy) >= Math.abs(dx) * 1.25) dir = dy < 0 ? 'up' : null;   // 只认上滑（下滑留给滑铲式的操作）
      else dir = dx < 0 ? 'left' : 'right';
      if (!dir) return null;
      return { dir: dir, x0: st.x, y0: st.y, x1: x, y1: y };
    }

    function addSwipeTrail(x0, y0, x1, y1, color) {
      swipeTrails.push({ x0: x0, y0: y0, x1: x1, y1: y1, color: color, t: 0 });
      if (swipeTrails.length > 12) swipeTrails.shift();
    }

    function releaseLane(lane, pointerId) {
      var sliding = pointerId != null ? pointerSlide[pointerId] : null;
      if (sliding && sliding.state === 1) {
        if (songTime < (sliding.slideDeadline || 0)) breakSlide(sliding);
        if (pointerId != null) delete pointerSlide[pointerId];
      }
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (n.state === 1 && n.lane === lane && n.slide < 0) {
          if (songTime < n.holdEnd - 0.14) {
            n.state = 2;
            applyJudge('miss', n);
            addEffect(lane, 'miss', S.judgeY);
          }
        }
      }
    }

    function updateJudge() {
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (n.state === 2) continue;
        if (n.state === 1) {
          if (n.slide >= 0) {
            // 滑音没在时限内滑到目标轨 → 算滑偏
            if (songTime > (n.slideDeadline || 0)) breakSlide(n);
            continue;
          }
          if (songTime >= n.holdEnd) {
            n.state = 2;
            score += 400;
            addEffect(n.lane, 'perfect', S.judgeY);
          }
          continue;
        }
        if (songTime > n.time + win('miss')) {
          n.state = 2;
          applyJudge('miss', n);
          addEffect(n.lane, 'miss', S.judgeY);
        }
        if (n.time > songTime + S.approach + 0.5) break;
      }
    }

    /* ---------------------------- 输入 ---------------------------- */
    function laneAt(clientX) {
      var rect = canvas.getBoundingClientRect();
      var x = (clientX - rect.left) / rect.width * vw;
      return clamp(Math.floor((x - S.x0) / S.laneW), 0, 3);
    }

    function onPointerDown(e) {
      if (state !== 'playing') return;
      e.preventDefault();
      var lane = laneAt(e.clientX);
      var rect = canvas.getBoundingClientRect();
      pointerLane[e.pointerId] = lane;
      pointerStart[e.pointerId] = {
        x: e.clientX - rect.left, y: e.clientY - rect.top,
        t: Date.now(), lane: lane
      };
      laneHeld[lane] = true;
      hitLane(lane, e.pointerId);
    }

    /** 按住时横向滑动：滑音就把手指移到目标轨完成；方向滑音则识别方向并判定 */
    function onPointerMove(e) {
      if (state !== 'playing') return;
      var rect = canvas.getBoundingClientRect();
      var lx = e.clientX - rect.left;
      var ly = e.clientY - rect.top;
      var st = pointerStart[e.pointerId];
      if (st) {
        var sw = detectSwipe(e.pointerId, lx, ly);
        if (sw) {
          judgeSwipe(st.lane, sw.dir, songTime, sw.x0, sw.y0, sw.x1, sw.y1);
          st.x = lx; st.y = ly; st.t = Date.now();   // 重置基准，一次手势只判一次
        }
      }
      var lane = laneAt(e.clientX);
      if (pointerLane[e.pointerId] === lane) return;
      var prev = pointerLane[e.pointerId];
      if (prev != null) laneHeld[prev] = false;
      pointerLane[e.pointerId] = lane;
      laneHeld[lane] = true;
      laneFlash[lane] = Math.max(laneFlash[lane], 0.6);
      var note = pointerSlide[e.pointerId];
      if (note && note.state === 1 && note.slide === lane) {
        completeSlide(note, lane);
        delete pointerSlide[e.pointerId];
      }
    }

    function onPointerUp(e) {
      var lane = pointerLane[e.pointerId];
      if (lane != null) {
        laneHeld[lane] = false;
        releaseLane(lane, e.pointerId);
        delete pointerLane[e.pointerId];
        delete pointerSlide[e.pointerId];
        delete pointerStart[e.pointerId];
      }
    }

    function onKeyDown(e) {
      var k = (e.key || '').toLowerCase();
      if (e.repeat) return;
      if (k === 'escape' || k === 'p') {
        if (state === 'playing') showPause();
        else if (state === 'paused') resume();
        e.preventDefault();
        return;
      }
      if (state !== 'playing') return;
      // 键盘辅助：方向键判"方向滑音"（哪条轨有待判音符就打哪条）
      var dirKey = { arrowup: 'up', arrowleft: 'left', arrowright: 'right' }[k];
      if (dirKey) {
        e.preventDefault();
        var pick = null, pickDt = win('miss');
        for (var q = 0; q < notes.length; q++) {
          var nq = notes[q];
          if (nq.state !== 0 || nq.swipe !== dirKey) continue;
          var dq = nq.time - songTime;
          if (dq > win('miss')) break;
          if (Math.abs(dq) < pickDt) { pickDt = Math.abs(dq); pick = nq; }
        }
        if (pick) judgeSwipe(pick.lane, dirKey, songTime, 0, 0, 0, 0);
        return;
      }
      var lane = LANE_KEY[k];
      if (lane == null && k >= '1' && k <= '4') lane = parseInt(k, 10) - 1;
      if (lane == null) return;
      e.preventDefault();
      laneHeld[lane] = true;
      // 键盘上滑音 = 依次按下起点轨和目标轨
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (n.state === 1 && n.slide >= 0 && n.slide === lane) {
          completeSlide(n, lane);
          return;
        }
      }
      hitLane(lane, null);
    }
    function onKeyUp(e) {
      var k = (e.key || '').toLowerCase();
      var lane = LANE_KEY[k];
      if (lane == null && k >= '1' && k <= '4') lane = parseInt(k, 10) - 1;
      if (lane == null) return;
      laneHeld[lane] = false;
      releaseLane(lane, null);
    }

    /* ---------------------------- 更新 ---------------------------- */
    function update(dt) {
      if (state !== 'playing') return;
      var raw = (player && player.playing) ? player.time() : songTime + dt;
      // 判定延迟校准：蓝牙耳机等输出延迟会让音乐比画面晚，这里把判定时钟对齐
      songTime = raw - (set.offset || 0) / 1000;
      updateJudge();

      // 节拍脉动（按 BPM 计算，每拍一次）
      if (track) {
        var beatDur = 60 / track.bpm;
        var beatIdx = Math.floor(songTime / beatDur);
        if (beatIdx !== lastBeat) {
          lastBeat = beatIdx;
          beatPulse = 1;
        }
      }
      beatPulse = Math.max(0, beatPulse - dt * 3.2);

      // 自动化测试用的自动演奏（界面无入口）：滑音自动补"滑到目标轨"，方向滑音自动甩一下
      if (autoplay) {
        for (var a = 0; a < notes.length; a++) {
          var na = notes[a];
          if (na.state === 1 && na.slide >= 0) {
            if (songTime >= (na.slideTime || 0) - 0.02) completeSlide(na, na.slide);
            continue;
          }
          if (na.state !== 0) continue;
          if (na.time > songTime + 0.004) break;
          if (songTime - na.time > win('perfect')) continue;
          if (na.swipe) {
            var sinfo = SWIPE_INFO[na.swipe];
            var lx2 = S.x0 + na.lane * S.laneW + S.laneW / 2;
            judgeSwipe(na.lane, na.swipe, songTime, lx2, S.judgeY,
              lx2 + (na.swipe === 'left' ? -60 : na.swipe === 'right' ? 60 : 0),
              S.judgeY + (na.swipe === 'up' ? -60 : 0));
          } else {
            hitLane(na.lane, null);
          }
        }
      }

      for (var i = 0; i < effects.length; i++) effects[i].t += dt;
      effects = effects.filter(function (e) { return e.t < 0.55; });
      for (var q2 = 0; q2 < popups.length; q2++) popups[q2].t += dt;
      popups = popups.filter(function (p) { return p.t < 0.7; });

      // 滑动轨迹特效
      for (var t3 = 0; t3 < swipeTrails.length; t3++) swipeTrails[t3].t += dt;
      swipeTrails = swipeTrails.filter(function (s) { return s.t < 0.4; });

      // 长按火花 + 持续粒子
      holdActiveCount = 0;
      for (var hi = 0; hi < notes.length; hi++) {
        var hn = notes[hi];
        if (hn.state !== 1 || hn.slide >= 0 || !(hn.hold > 0.12)) continue;
        holdActiveCount++;
        hn.holdFx = (hn.holdFx || 0) + dt;
        // 每 0.06 秒冒一簇火花（从判定线往上）
        if (hn.holdFx > 0.06) {
          hn.holdFx = 0;
          var hx = S.x0 + hn.lane * S.laneW + S.laneW / 2 + rand(-S.laneW * 0.28, S.laneW * 0.28);
          sparks.push({
            x: hx, y: S.judgeY + rand(-4, 4),
            vx: rand(-40, 40), vy: rand(-260, -140),
            life: 0.5, max: 0.5, size: rand(1.6, 3.4),
            color: laneColor(hn.lane), gravity: 120
          });
        }
      }
      for (var si = 0; si < sparks.length; si++) {
        var sk = sparks[si];
        sk.life -= dt;
        sk.x += sk.vx * dt;
        sk.y += sk.vy * dt;
        sk.vy += (sk.gravity || 0) * dt;
      }
      sparks = sparks.filter(function (s) { return s.life > 0; });
      if (sparks.length > 400) sparks.splice(0, sparks.length - 400);
      for (var l = 0; l < 4; l++) laneFlash[l] = Math.max(0, laneFlash[l] - dt * 4);
      comboFlash = Math.max(0, comboFlash - dt * 1.3);
      bgHue += dt * 20;
      if (song) progressBar.style.width = clamp(songTime / song.duration, 0, 1) * 100 + '%';
      // 兜底结束：即使音频被拦截/播放器异常，歌曲长度到了也会结算
      if (song && songTime >= song.duration - 0.08) finish();
    }

    /* ---------------------------- 渲染 ---------------------------- */
    function laneColor(lane) {
      var pal = ['#7dd3fc', '#f9a8d4', '#fcd34d', '#a7f3d0'];
      return pal[lane];
    }

    /** 长按 / 滑音的进度条：判定线下方一条会填满的横条 + 百分比 */
    function drawHoldProgress(lane, prog, isSlide, showText) {
      var bx = S.x0 + lane * S.laneW + S.laneW * 0.12;
      var bw = S.laneW * 0.76;
      var by = S.judgeY + 16;
      var bh = 11;
      var col = isSlide ? '#a7f3d0' : laneColor(lane);
      ctx.save();
      ctx.fillStyle = 'rgba(8,14,28,.78)';
      roundRect(ctx, bx, by, bw, bh, bh / 2);
      ctx.fill();
      ctx.fillStyle = col;
      var fw = Math.max(0, (bw - 4) * clamp(prog, 0, 1));
      if (fw > 1) {
        roundRect(ctx, bx + 2, by + 2, fw, bh - 4, (bh - 4) / 2);
        ctx.fill();
      }
      // 快完成时闪一下
      if (prog > 0.93) {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(songTime * 24);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        roundRect(ctx, bx, by, bw, bh, bh / 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (showText) {
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.textAlign = 'center';
        ctx.font = '800 ' + Math.round(vh * 0.018) + 'px "PingFang SC",sans-serif';
        ctx.fillText(Math.round(clamp(prog, 0, 1) * 100) + '%', bx + bw / 2, by + bh + Math.round(vh * 0.019));
      }
      ctx.restore();
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // 背景（随节拍脉动）
      var pulse = beatPulse * 0.5;
      var g = ctx.createLinearGradient(0, 0, 0, vh);
      g.addColorStop(0, '#0a0f1f');
      g.addColorStop(0.5, mixDark('#131b34', pulse));
      g.addColorStop(1, mixDark('#1d1030', pulse));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, vw, vh);

      // 轨道
      for (var l = 0; l < 4; l++) {
        var x = S.x0 + l * S.laneW;
        var grad = ctx.createLinearGradient(0, S.topY, 0, S.judgeY);
        grad.addColorStop(0, 'rgba(255,255,255,0.015)');
        grad.addColorStop(1, laneHeld[l] ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.05)');
        ctx.fillStyle = grad;
        ctx.fillRect(x + 2, S.topY, S.laneW - 4, S.judgeY - S.topY);
        // 节拍脉动：轨道微微发亮
        if (pulse > 0.02) {
          ctx.fillStyle = 'rgba(255,255,255,' + (pulse * 0.06) + ')';
          ctx.fillRect(x + 2, S.topY, S.laneW - 4, S.judgeY - S.topY);
        }
        if (laneFlash[l] > 0) {
          ctx.fillStyle = 'rgba(255,255,255,' + (laneFlash[l] * 0.28) + ')';
          ctx.fillRect(x + 2, S.topY, S.laneW - 4, S.judgeY - S.topY);
        }
        // 判定线
        ctx.fillStyle = laneColor(l);
        ctx.globalAlpha = laneHeld[l] ? 0.95 : 0.4 + pulse * 0.3;
        ctx.fillRect(x + 4, S.judgeY, S.laneW - 8, 4);
        ctx.globalAlpha = 1;
      }

      // 方向滑音 / 长按的"提前提示"窗口：按秒算，速度调快时提示会更早出现（而不是更短）
      var warnSec = 1.25 + 0.25 * set.speed;

      // 音符
      if (song) {
        for (var i = 0; i < notes.length; i++) {
          var n = notes[i];
          if (n.state === 2) continue;
          var y = S.judgeY - (n.time - songTime) * S.speed;
          var ncol = n.bonus ? '#fcd34d' : laneColor(n.lane);
          // 滑音：先画一条从起始轨指向目标轨的斜带（提示"往那边滑"）
          if (n.slide >= 0) {
            var sx = S.x0 + n.lane * S.laneW + S.laneW / 2;
            var sy = S.judgeY - (n.time - songTime) * S.speed;
            var tx = S.x0 + n.slide * S.laneW + S.laneW / 2;
            var ty = S.judgeY - ((n.slideTime || n.time + 0.3) - songTime) * S.speed;
            var bw2 = S.laneW * 0.5;
            if (sy > S.topY - 120 && ty < vh + 80) {
              ctx.save();
              ctx.globalAlpha = 0.42;
              ctx.fillStyle = '#a7f3d0';
              ctx.beginPath();
              ctx.moveTo(sx - bw2 / 2, sy);
              ctx.lineTo(sx + bw2 / 2, sy);
              ctx.lineTo(tx + bw2 / 2, ty);
              ctx.lineTo(tx - bw2 / 2, ty);
              ctx.closePath();
              ctx.fill();
              ctx.globalAlpha = 0.85;
              ctx.strokeStyle = '#a7f3d0';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(sx, sy);
              ctx.lineTo(tx, ty);
              ctx.stroke();
              ctx.restore();
            }
          }
          if (n.state === 1) {
            // 长按/滑音：主体 + 已按住部分 + 尾部
            var endTime = n.slide >= 0 ? (n.slideDeadline || n.slideTime || n.time + 0.3) : n.holdEnd;
            var yEnd = S.judgeY - (endTime - songTime) * S.speed;
            var lx = S.x0 + n.lane * S.laneW + S.laneW * 0.16;
            var lw = S.laneW * 0.68;
            var top = Math.min(y, yEnd);
            var hgt = Math.abs(yEnd - y);
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = ncol;
            roundRect(ctx, lx, top, lw, Math.max(4, hgt), lw * 0.3);
            ctx.fill();
            // 已经完成的部分：从判定线往上（跟进度一致）
            var total = Math.max(0.001, endTime - n.time);
            var prog = clamp((songTime - n.time) / total, 0, 1);
            var doneH = prog * ((endTime - n.time) * S.speed);
            ctx.globalAlpha = 0.85;
            roundRect(ctx, lx, S.judgeY - doneH, lw, Math.max(0, doneH), lw * 0.3);
            ctx.fill();
            // 进度条：判定线下方一条会填满的横条 + 百分比
            drawHoldProgress(n.lane, prog, n.slide >= 0, true);
            ctx.globalAlpha = 1;
            ctx.fillStyle = ncol;
            roundRect(ctx, lx, clamp(y, -40, vh), lw, 20, 9);
            ctx.fill();
            roundRect(ctx, lx, clamp(yEnd - 6, -40, vh), lw, 12, 6);
            ctx.fill();
            ctx.fillStyle = 'rgba(11,16,32,.75)';
            ctx.textAlign = 'center';
            ctx.font = '700 11px "PingFang SC",sans-serif';
            ctx.fillText(n.slide >= 0 ? '滑' : 'HOLD', lx + lw / 2, clamp(y + 14, -20, vh + 20));
          } else {
            if (y < S.topY - 90 || y > vh + 60) {
              if (n.time > songTime + S.approach / set.speed + 0.4) break;
              continue;
            }
            var bx = S.x0 + n.lane * S.laneW + S.laneW * 0.15;
            var bw = S.laneW * 0.7;
            ctx.fillStyle = n.slide >= 0 ? '#a7f3d0' : ncol;
            roundRect(ctx, bx, y - 13, bw, 26, 12);
            ctx.fill();
            ctx.fillStyle = n.bonus ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.55)';
            roundRect(ctx, bx + 3, y - 9, bw - 6, 7, 3);
            ctx.fill();
            if (n.slide >= 0) {
              // 滑音标记：一个指向目标轨的小箭头
              var dir = n.slide > n.lane ? 1 : -1;
              ctx.save();
              ctx.globalAlpha = 0.95;
              ctx.fillStyle = '#0b1020';
              ctx.beginPath();
              ctx.moveTo(bx + bw / 2 + dir * 9, y - 5);
              ctx.lineTo(bx + bw / 2 + dir * 9, y + 5);
              ctx.lineTo(bx + bw / 2 + dir * 16, y);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            } else if (n.swipe) {
              // 方向滑音：按方向着色 + 大箭头；提前"按秒"给出提示（跟速度无关，保证来得及反应）
              var sinfo2 = SWIPE_INFO[n.swipe];
              var bx2 = S.x0 + n.lane * S.laneW + S.laneW * 0.15;
              var bw3 = S.laneW * 0.7;
              var ttl = n.time - songTime;                 // 距离判定线还有多少秒
              var near = ttl <= warnSec && ttl > -0.25;    // 提示窗口（秒）
              ctx.save();
              if (near) {
                // 收缩光环：越接近判定线越小 —— 相当于一个看得见倒计时
                var k = clamp(ttl / warnSec, 0, 1);
                var grow = 1 + 0.85 * k;
                // 提前期给整条轨上色，扫一眼就知道"这条轨要滑"
                ctx.globalAlpha = 0.10 + 0.14 * (1 - k);
                ctx.fillStyle = sinfo2.color;
                ctx.fillRect(S.x0 + n.lane * S.laneW + 2, S.topY, S.laneW - 4, S.judgeY - S.topY);
                ctx.globalAlpha = 0.45 + 0.4 * (1 - k);
                ctx.strokeStyle = sinfo2.color;
                ctx.lineWidth = 3 + 2 * (1 - k);
                var rw = bw3 * grow, rh = 30 * grow;
                roundRect(ctx, bx2 + (bw3 - rw) / 2, y - rh / 2, rw, rh, rh * 0.45);
                ctx.stroke();
                ctx.globalAlpha = 1;
              }
              ctx.fillStyle = sinfo2.color;
              roundRect(ctx, bx2, y - 15, bw3, 30, 14);
              ctx.fill();
              ctx.fillStyle = 'rgba(11,16,32,.85)';
              ctx.textAlign = 'center';
              ctx.font = '900 ' + Math.round(vh * 0.026) + 'px "PingFang SC",sans-serif';
              ctx.fillText(sinfo2.arrow, bx2 + bw3 / 2, y + Math.round(vh * 0.009));
              if (near) {
                // 方向文字 + 剩余时间，提前量足够看清
                ctx.fillStyle = sinfo2.color;
                ctx.font = '800 ' + Math.round(vh * 0.021) + 'px "PingFang SC",sans-serif';
                ctx.fillText(sinfo2.name, bx2 + bw3 / 2, y - 26);
                ctx.font = '700 ' + Math.round(vh * 0.016) + 'px "PingFang SC",sans-serif';
                ctx.globalAlpha = 0.85;
                ctx.fillText(Math.max(0, ttl).toFixed(1) + 's', bx2 + bw3 / 2, y + 34);
                ctx.globalAlpha = 1;
              }
              ctx.restore();
            } else if (n.hold > 0.12) {
              // 长按音符：同样按"秒"提前提示（空进度条 + 呼吸光环 + "长按"）
              if (n.time - songTime <= warnSec) {
                drawHoldProgress(n.lane, 0, false, true);
                ctx.save();
                var hk = clamp((n.time - songTime) / warnSec, 0, 1);
                ctx.globalAlpha = 0.45 + 0.45 * (1 - hk);
                ctx.strokeStyle = '#7dd3fc';
                ctx.lineWidth = 3;
                var hw = bw + 10 + 26 * hk;
                roundRect(ctx, bx + (bw - hw) / 2, y - 15 * (1 + hk), hw, 30 * (1 + hk), 16);
                ctx.stroke();
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#7dd3fc';
                ctx.textAlign = 'center';
                ctx.font = '800 ' + Math.round(vh * 0.019) + 'px "PingFang SC",sans-serif';
                ctx.fillText('长按', S.x0 + n.lane * S.laneW + S.laneW / 2, y - 26);
                ctx.restore();
              }
            }
            if (n.bonus) {
              ctx.globalAlpha = 0.5 + 0.5 * Math.sin(songTime * 12);
              ctx.strokeStyle = '#fff7d6';
              ctx.lineWidth = 2;
              roundRect(ctx, bx - 3, y - 16, bw + 6, 32, 14);
              ctx.stroke();
              ctx.globalAlpha = 1;
            }
          }
        }
      }

      // 特效
      for (var e2 = 0; e2 < effects.length; e2++) {
        var ef = effects[e2];
        var cx = S.x0 + ef.lane * S.laneW + S.laneW / 2;
        var k = ef.t / 0.55;
        ctx.globalAlpha = 1 - k;
        var col = ef.judge === 'miss' ? '#f87171' : laneColor(ef.lane);
        ctx.strokeStyle = col;
        ctx.lineWidth = 3 * (1 - k) + 1;
        ctx.beginPath();
        ctx.arc(cx, ef.y, 12 + k * 70, 0, Math.PI * 2);
        ctx.stroke();
        for (var p = 0; p < ef.parts.length; p++) {
          var pt = ef.parts[p];
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(pt.a) * pt.v * k, ef.y + Math.sin(pt.a) * pt.v * k - 40 * k * k, pt.size * (1 - k), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // 滑动轨迹特效（位置在 update 里推进）
      for (var t3 = 0; t3 < swipeTrails.length; t3++) {
        var tr = swipeTrails[t3];
        var k3 = clamp(tr.t / 0.4, 0, 1);
        ctx.save();
        ctx.globalAlpha = (1 - k3) * 0.8;
        ctx.strokeStyle = tr.color;
        ctx.lineWidth = 14 * (1 - k3) + 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tr.x0, tr.y0);
        ctx.lineTo(tr.x1, tr.y1);
        ctx.stroke();
        ctx.restore();
      }

      // 长按火花
      for (var sp = 0; sp < sparks.length; sp++) {
        var sk2 = sparks[sp];
        ctx.save();
        ctx.globalAlpha = clamp(sk2.life / (sk2.max || 0.5), 0, 1);
        ctx.fillStyle = sk2.color;
        ctx.beginPath();
        ctx.arc(sk2.x, sk2.y, sk2.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 长按持续中的判定线光晕 + 呼吸环（长按特效提示）
      if (holdActiveCount > 0) {
        for (var l2 = 0; l2 < 4; l2++) {
          var held = false;
          for (var hn2 = 0; hn2 < notes.length; hn2++) {
            var n3 = notes[hn2];
            if (n3.state === 1 && n3.slide < 0 && n3.hold > 0.12 && n3.lane === l2) { held = true; break; }
          }
          if (!held) continue;
          var hx2 = S.x0 + l2 * S.laneW + S.laneW / 2;
          var hpulse = 0.5 + 0.5 * Math.sin(songTime * 14);

  function hexToRgb(h) {

    ctx.lineTo(x + w - r, y);

    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);

    '.nj-root[data-orient="landscape"] .nj-touch button[data-act="jump"]{justify-self:end;margin-right:6px;background:rgba(125,211,252,.3)}',
    '.nj-root[data-orient="landscape"] .nj-touch button[data-act="slide"]{justify-self:start;margin-left:6px}',
    '.nj-root[data-orient="landscape"] .nj-touch button[data-act="pause"]{justify-self:center;width:52px;padding:0;height:52px;font-size:18px}',
    /* 成员胶囊浮在按钮上方：画布 540 高时地面线在 82%，胶囊压在地面线附近会挡住角色，所以紧贴按钮上沿 */
    // 横屏：天空区域很大，把成员胶囊放到顶部中央，避免压到地面上的角色
    '.nj-root[data-orient="landscape"] .nj-chips{position:absolute;left:50%;transform:translateX(-50%);right:auto;bottom:auto;top:8px;padding:0;gap:5px;z-index:6;pointer-events:none;max-width:62%}',
    /* 完全全屏：游玩中不留任何操作提示 */
    '.nj-root[data-clean="1"][data-state="playing"] .nj-touch{display:none!important}',
    '.nj-root[data-clean="1"][data-state="playing"] .nj-chips{display:none!important}',
    '.nj-root[data-clean="1"] .nj-fs{display:none!important}',
    '.nj-root[data-clean="1"] .nj-hint{display:none!important}',   // 完全全屏：连底部那句操作提示也不留
    '.nj-root[data-orient="landscape"] .nj-chip{pointer-events:auto;min-height:32px;padding:4px 9px;font-size:10.5px;border-radius:10px;background:rgba(8,14,28,.42);flex:0 0 auto;min-width:0}',
    '.nj-root[data-orient="landscape"][data-touch="1"] .nj-hint{display:none}',
    '.nj-root[data-orient="landscape"] .nj-overlay{gap:6px;padding:10px 14px}',
    '.nj-root[data-orient="landscape"] .nj-members{gap:5px}',
    '.nj-root[data-orient="landscape"] .nj-member{width:66px;padding:4px 3px}',
    '.nj-root[data-orient="landscape"] .nj-btn{padding:9px 20px;min-height:44px;font-size:14px}',
    '.nj-root[data-orient="landscape"] .nj-diffbtn{min-height:44px;min-width:64px;padding:4px 10px}',
    '.nj-root[data-orient="landscape"] .nj-keys{font-size:10px;line-height:1.6}',
    '@media (orientation: landscape) {',
    '.nj-root[data-orient="landscape"] .nj-stage{max-height:100%}',
    '}',
    '@media (max-height:430px) {',
    '.nj-root[data-orient="landscape"] .nj-hint{display:none}',
    '.nj-root[data-orient="landscape"] .nj-keys{display:none}',
    '}'
