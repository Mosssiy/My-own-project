      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
        self.touchPad.addEventListener(ev, function () {
          self.releaseJump();
          self.slideHeld = false;
        });
      });

      // 画面：右半边点按 = 跳，左半边按住 = 滑铲（手机主操作）
      this.canvas.addEventListener('pointerdown', function (e) {
        if (self.state === 'menu' || self.state === 'over') { self.start(); return; }
        if (self.state === 'paused') { self.resume(); return; }
        var rect = self.canvas.getBoundingClientRect();
        var rel = rect.width ? (e.clientX - rect.left) / rect.width : 0.5;
        if (rel < 0.45) {
          e.preventDefault();
          self.startSlide();
          self.slideHeld = true;
        } else {
          self.jump();
        }
      });
      ['pointerup', 'pointercancel'].forEach(function (ev) {
        self.canvas.addEventListener(ev, function () {
          self.releaseJump();
          self.slideHeld = false;
        });
      });
    }

    destroy() {
      this.running = false;
      global.removeEventListener('keydown', this._onKeyDown);
      global.removeEventListener('keyup', this._onKeyUp);
      global.removeEventListener('blur', this._onBlur);
      if (this._onOrient) {
        global.removeEventListener('orientationchange', this._onOrient);
        try {
          if (this._mq && typeof this._mq.removeEventListener === 'function') this._mq.removeEventListener('change', this._onOrient);
          else if (this._mq && typeof this._mq.removeListener === 'function') this._mq.removeListener(this._onOrient);
        } catch (e) { /* ignore */ }
        this._mq = null;
      }
      if (this._onFsChange && typeof document !== 'undefined' && document.removeEventListener) {
        document.removeEventListener('fullscreenchange', this._onFsChange);
        document.removeEventListener('webkitfullscreenchange', this._onFsChange);
      }
      if (this.root && this.root.parentNode) this.root.parentNode.removeChild(this.root);
    }

    /* --------------------------- 输入 --------------------------- */
    onKeyDown(e) {
      var k = e.key;
      var code = e.keyCode;
      if (k === ' ' || k === 'Spacebar' || code === 32 || k === 'ArrowUp' || k === 'w' || k === 'W') {
        e.preventDefault();
        if (this.state === 'menu' || this.state === 'over') this.start();
        else if (this.state === 'paused') this.resume();
        else this.jump();
        return;
      }
      if (k === 'ArrowDown' || k === 's' || k === 'S') {
        e.preventDefault();
        this.startSlide();
        return;
      }
      if (k >= '1' && k <= '5') {
        if (this.state === 'playing') return;      // 游玩中不换人（换人在选人页 / 暂停页做）
        this.selectMember(parseInt(k, 10) - 1);
        return;
      }
      if (k === 'q' || k === 'Q') { if (this.state !== 'playing') this.nextMember(-1); return; }
      if (k === 'e' || k === 'E') { if (this.state !== 'playing') this.nextMember(1); return; }
      if (k === 'p' || k === 'P' || k === 'Escape') {
        if (this.state === 'playing') this.pause();
        else if (this.state === 'paused') this.resume();
        return;
      }
      if (k === 'r' || k === 'R') { this.start(); return; }
      if (k === 'Enter') {
        if (this.state === 'menu' || this.state === 'over') this.start();
        else if (this.state === 'paused') this.resume();
      }
    }

    onKeyUp(e) {
      var k = e.key;
      if (k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W') this.releaseJump();
      if (k === 'ArrowDown' || k === 's' || k === 'S') this.endSlide();
    }

    act(name, el) {
      if (name === 'start' || name === 'restart') this.start();
      else if (name === 'resume') this.resume();
      else if (name === 'pause') this.pause();
      else if (name === 'menu') this.backToMenu();
      else if (name === 'member') this.selectMember(parseInt(el.getAttribute('data-index'), 10));
      else if (name === 'difficulty') this.setDifficulty(parseInt(el.getAttribute('data-index'), 10));
      else if (name === 'fullscreen') this.toggleFullscreen();
      else if (name === 'stay-portrait') this.stayPortrait();
      else if (name === 'rotate-fullscreen') this.rotateAndFullscreen();
      else if (name === 'autofs') {
        this.settings.autoFs = this.settings.autoFs === false;
        saveSettings(this.settings);
        if (this.settings.autoFs !== false) this.requestFs(this.stage);
        this.syncUi();
      }
    }

    /* --------------------------- 状态 --------------------------- */
    member() { return MEMBERS[this.memberIndex]; }

    selectMember(i) {
      if (isNaN(i)) return;
      this.memberIndex = (i + MEMBERS.length) % MEMBERS.length;
      if (this.player) {
        this.player.jumpsLeft = this.member().jumps;
        if (this.player.sliding) this.endSlide();
      }
      this.syncUi();
    }

    nextMember(dir) { this.selectMember(this.memberIndex + (dir || 1)); }

    reset() {
      this.time = 0;
      this.speed = CFG.baseSpeed * this.member().speed;
      this.camX = 0;
      this.lives = this.diff().lives;
      this.heartsMax = this.lives;
      this.coins = 0;
      this.coinScore = 0;
      this.score = 0;
      this.distance = 0;
      this.chunkCount = 0;
      this.shake = 0;
      this.flash = 0;
      this.jumpBuffer = 0;
      this.isNewBest = false;

      this.segments = [{ x0: -900, x1: 1200 }];
      this.groundX = 1200;
      this.obstacles = [];
      this.platforms = [];
      this.coins_ = [];
      this.powerups = [];
      this.springs = [];
      this.particles = [];
      this.texts = [];

      // 道具与连击状态（所有道具一份倒计时，瞬间道具用后即清零）
      this.buffs = {};
      for (var bi = 0; bi < POWERUP_KEYS.length; bi++) this.buffs[POWERUP_KEYS[bi]] = 0;
      this.combo = 0;
      this.comboTimer = 0;
      this.comboBest = 0;
      this.paletteT = 0;          // 昼夜进度（0~3 循环）

      var m = this.member();
      this.player = {
        x: CFG.playerX,
        y: CFG.groundY - 54,
        w: 34,
        h: 54,
        vy: 0,
        onGround: true,
        sliding: false,
        slideT: 0,
        jumpsLeft: m.jumps,
        invuln: 0,
        coyote: 0,
        anim: 0,
        jumpHeld: false,
        blinkTimer: 2,
        blinkDur: 0,
        squash: 0,          // 起跳/落地的挤压拉伸
        trail: [],          // 残影
        springT: 0,
        jumpBoost: 1        // 弹簧靴：跳跃力倍率
      };
      this.slideHeld = false;
      this.dashHit = 0;
    }

    start() {
      this.reset();
      this.state = 'playing';
      this.enterImmersive();       // 必须在用户手势里（点击"开始"）尝试全屏+锁横屏
      this.syncUi();
    }

    pause() {
      if (this.state !== 'playing') return;
      this.state = 'paused';
      this.syncUi();
    }

    resume() {
      if (this.state !== 'paused') return;
      this.state = 'playing';
      this.lastTs = 0;
      this.syncUi();
    }

    backToMenu() {
      this.reset();
      this.state = 'menu';
      this.syncUi();
    }

    gameOver(reason) {
      if (this.state === 'over') return;
      this.state = 'over';
      this.overReason = reason || '';
      this.isNewBest = this.score > this.best;
      if (this.isNewBest) { this.best = this.score; saveBest(this.best); }
      this.syncUi();
    }

    difficulty() { return clamp(this.time / 70, 0, 1); }

    /* --------------------------- 输入动作 --------------------------- */
    jump() {
      if (this.state !== 'playing') return;
      var p = this.player;
      var m = this.member();
      var boost = p.jumpBoost || 1;          // 弹簧靴
      if (p.sliding) this.endSlide();

      if (p.onGround || p.coyote > 0) {
        p.vy = -CFG.jumpVel * m.jump * boost;
        p.onGround = false;
        p.coyote = 0;
        p.jumpsLeft = Math.max(0, m.jumps - 1);
        p.squash = 0.7;
        this.burst(p.x + p.w / 2, p.y + p.h, 6, '#ffffff', 0.18);
        this.sfx('jump');
      } else if (p.jumpsLeft > 0) {
        p.jumpsLeft--;
        p.vy = -CFG.jumpVel * m.jump * 0.9 * boost;
        this.burst(p.x + p.w / 2, p.y + p.h * 0.5, 10, m.accent, 0.3);
        this.sfx('double');
      } else {
        this.jumpBuffer = 0.14;
      }
      p.jumpHeld = true;
    }

    releaseJump() {
      if (this.player) this.player.jumpHeld = false;
    }

    startSlide() {
      if (this.state !== 'playing') return;
      var p = this.player;
      if (p.sliding) return;
      var m = this.member();
      p.sliding = true;
      p.slideT = CFG.slideTime * m.slide;
      var bottom = p.y + p.h;
      p.h = 30;
      p.y = bottom - p.h;
      this.burst(p.x + p.w / 2, p.y + p.h, 8, '#e2e8f0', 0.24);
      this.sfx('slide');
    }

    endSlide() {
      var p = this.player;
      if (!p.sliding) return;
      var bottom = p.y + p.h;
      p.sliding = false;
      p.h = 54;
      p.y = bottom - p.h;
      p.slideT = 0;
    }

    /* --------------------------- 世界生成 --------------------------- */
    ensureWorld() {
      var guard = 0;
      while (this.groundX < this.camX + CFG.W * 2 && guard++ < 40) this.buildChunk();
    }

    buildChunk() {
      var d = this.difficulty();
      var dd = this.diff();
      // 坑的宽度按当前速度反推，保证任何成员都跳得过去（留出安全余量）：
      // 上限随速度走，下限取"上限的 60%"。注意 rand 的上下限要按可用空间伸缩——
      // 速度慢时 maxGap 会接近 80，若还用固定 rand(100, maxGap) 就会一直被钳到 80，
      // 那样慢速难度永远刷不出坑（旧版正是这个行为）。
      var maxGap = clamp(this.speed * 0.52 - 40, 80, 340);
      var minGapW = Math.max(60, maxGap * 0.6);
      var gap = 0;
      if (this.chunkCount > 1 && Math.random() < (dd.pitBase || 0.26) + (dd.pitGain || 0.34) * d && maxGap > minGapW) {
        gap = rand(minGapW, maxGap);
      }
      var pitStart = this.groundX;
      this.groundX += gap;

      // 段长必须够放得下"段首缓冲 + 若干个障碍 + 段尾净空"，否则多数段会是空的
      // （旧版 620~900px 配上 ~1 秒的净空区，导致障碍平均间隔高达 4.4 秒）
      // 每段放 ~6 个障碍：段首/段尾的固定死区占比就被摊薄了，
      // 各难度的"实际间隔"才会紧贴 obGap（死区占比不同会把难度差异抵消掉）
      var need = this.speed * ((dd.obGap || 1.2) * 6.2) * dd.window + 560;
      var len = Math.max(need, rand(900, 1400));
      var seg = { x0: this.groundX, x1: this.groundX + len };
      this.segments.push(seg);

      // 坑上方的 CD 弧线（诱导跳跃）
      if (gap > 0) {
        var n = Math.max(2, Math.round(gap / 52));
        for (var i = 0; i < n; i++) {
          var t = (i + 1) / (n + 1);
          this.coins_.push({
            x: pitStart + gap * t,
            y: CFG.groundY - 76 - Math.sin(t * Math.PI) * 48,
            r: 11, phase: rand(0, 6.28), taken: false
          });
        }
      }

      this.populate(seg, d, gap > 0);
      this.groundX = seg.x1;
      this.chunkCount++;
    }

    populate(seg, d, afterGap) {
      var dd = this.diff();
      var v = Math.max(120, this.speed);
      // 段尾净空：够玩家看清并起跳即可（旧版按"整整一秒"预留，把段塞满了）
      var reserve = clamp(v * 0.44 + 80, 180, 480);
      // 刚跨过坑时，第一个障碍要留出落地缓冲，避免"落地即撞"
      var offset = afterGap ? Math.max(rand(160, 220), v * 0.55) : rand(130, 200);
      var gapSec = dd.obGap || 1.2;
      var cursor = seg.x0 + offset;
      var last = '';
      var lastW = 0;
      var guard = 0;
      var placed = [];        // 本段已放置物的横向范围，用来给道具让位

      while (cursor < seg.x1 - reserve && guard++ < 40) {
        var roll = Math.random();
        var kind;
        if (this.chunkCount === 1 && this.obstacles.length === 0) kind = 'crate';
        else if (roll < 0.38) kind = 'crate';
        else if (roll < 0.60) kind = 'gate';
        else if (roll < 0.76) kind = 'platform';
        else if (roll < 0.88) kind = 'drone';
        else kind = 'coins';

        // 无人机只能"贴地躲"，跳箱/跳台阶之后必须留出落地缓冲
        if (kind === 'drone' && (last === 'platform' || last === 'crate' || last === 'crate_tall')) kind = 'coins';
        if (kind === 'platform' && last === 'drone') kind = 'crate';
        if (kind === 'crate' && last === 'crate' && Math.random() < 0.5) kind = 'coins';

        lastW = this.spawnKind(kind, cursor, d);
        last = kind === 'crate' && lastW === 42 ? 'crate_tall' : kind;
        if (kind !== 'coins') placed.push({ x0: cursor - 40, x1: cursor + lastW + 40 });
        // 间距按"秒"换算：反应时间（秒）基本不随速度变化，所以难度差异是稳定的手感差异；
        // 再叠一个温和的速度渐进（速度越高，像素间距增长得比速度慢一点），
        // 让"越跑越快"也体现在障碍变密上，而不只是画面在加速。
        var ramp = Math.pow((dd.baseSpeed || 330) / v, 0.35);
        var mul = rand(0.86, 1.22);
        // 公平性：上一个是"要跳"的（木箱/台阶），下一个却要"滑铲/贴地"，
        // 必须多留一点时间——否则会出现"刚落地就要趴下"的不可能连招
        var jumped = (last === 'crate' || last === 'crate_tall' || last === 'platform');
        if (jumped && (kind === 'gate' || kind === 'drone')) mul *= 1.45;
        var advance = Math.max(lastW, 40) + v * gapSec * ramp * mul;
        // 硬性公平下限：相邻两个障碍之间至少留 0.78 秒（≈单跳滞空 0.66s + 余量）。
        // 只在"高难度 + 满速"时才会顶到这个下限，保证再快也不会刷出跳不过来的连排。
        cursor += Math.max(advance, v * 0.78);
      }

      this.placeTimed(seg, placed, v, dd);
    }

    /**
     * 道具 / 弹簧：跟障碍流解耦，按"行进秒数"定时投放。
     * 这样"障碍更密"不会顺带把道具挤掉，道具频率可以单独按难度调。
     */
    placeTimed(seg, placed, v, dd) {
      var segSec = (seg.x1 - seg.x0) / v;
      this.puAcc = (this.puAcc || 0) + segSec;
      this.springAcc = (this.springAcc || 0) + segSec;
      var puEvery = dd.puEvery || 9.5;
      var spEvery = dd.springEvery || 12.5;

      // 最多在本段放 2 个，避免某一段道具扎堆
      for (var n = 0; n < 2; n++) {
        if (this.puAcc >= puEvery) {
          var x = this.freeSpot(seg, placed, v);
          if (x == null) break;
          this.puAcc -= puEvery;
          this.spawnKind('power', x, 0);
          placed.push({ x0: x - 150, x1: x + 150 });
        }
        if (this.springAcc >= spEvery) {
          var sx = this.freeSpot(seg, placed, v);
          if (sx == null) break;
          this.springAcc -= spEvery;
          this.spawnKind('spring', sx, 0);
          placed.push({ x0: sx - 150, x1: sx + 150 });
        }
      }
      // 长时间没地方放（段太短）时别让计数无限累积
      if (this.puAcc > puEvery * 2.5) this.puAcc = puEvery;
      if (this.springAcc > spEvery * 2.5) this.springAcc = spEvery;
    }

    /** 在本段里找一个不和障碍重叠的空位 */
    freeSpot(seg, placed, v) {
      var lo = seg.x0 + v * 0.35;
      var hi = seg.x1 - v * 0.35;
      if (hi - lo < 80) return null;
      for (var tryN = 0; tryN < 10; tryN++) {
        var x = rand(lo, hi);
        var ok = true;
        for (var i = 0; i < placed.length; i++) {
          if (x > placed[i].x0 - 90 && x < placed[i].x1 + 90) { ok = false; break; }
        }
        if (ok) return x;
      }
      return null;
    }

    /** 生成一种障碍物/道具，返回其占用的宽度（用于计算后续间距）。 */
    spawnKind(kind, x, d) {
      var gy = CFG.groundY;
      if (kind === 'crate') {
        var tall = Math.random() < 0.22 + 0.3 * d;
        var w = tall ? 42 : (Math.random() < 0.4 ? 68 : 44);
        var h = tall ? 86 : 44;
        this.obstacles.push({ kind: 'crate', x: x, y: gy - h, w: w, h: h, dead: false });
        return w;
      }
      if (kind === 'gate') {
        var gw = rand(80, 118);
        this.obstacles.push({ kind: 'gate', x: x, y: gy - 74, w: gw, h: 24, dead: false });
        return gw;
      }
      if (kind === 'drone') {
        var baseY = gy - rand(168, 190);
        var patrol = Math.random() < 0.35 + 0.3 * d;      // 会左右巡逻的无人机
        this.obstacles.push({
          kind: 'drone', x: x, y: baseY, w: 56, h: 30,
          baseY: baseY, phase: rand(0, 6.28), dead: false,
          patrol: patrol, patrolAmp: patrol ? rand(34, 70) : 0, baseX: x
        });
        return 56 + (patrol ? 40 : 0);
      }
      if (kind === 'platform') {
        var py = gy - rand(118, 178);
        var pw = rand(150, 236);
        this.platforms.push({ x: x, y: py, w: pw, h: 18 });
        for (var i = 0; i < 3; i++) {
          this.coins_.push({ x: x + pw * (0.25 + i * 0.25), y: py - 34, r: 11, phase: rand(0, 6.28), taken: false });
        }
        return pw;
      }
      if (kind === 'spring') {
        this.springs.push({ x: x, y: gy - 22, w: 46, h: 22, used: false, phase: rand(0, 6.28) });
        // 弹簧上方撒一串金币，鼓励弹跳
        for (var s2 = 0; s2 < 4; s2++) {
          this.coins_.push({ x: x + 23 + s2 * 40 - 60, y: gy - 180 - s2 * 26, r: 11, phase: rand(0, 6.28), taken: false });
        }
        return 46;
      }
      if (kind === 'power') {
        var pk = POWERUP_KEYS[randInt(0, POWERUP_KEYS.length - 1)];
        this.powerups.push({
          kind: pk, x: x, y: gy - rand(90, 150), phase: rand(0, 6.28), taken: false
        });
        return 30;
      }
      if (kind === 'coins') {
        var n = randInt(3, 5);
        for (var j = 0; j < n; j++) {
          this.coins_.push({
            x: x + j * 42,
            y: gy - 66 - Math.sin((j + 1) / (n + 1) * Math.PI) * 58,
            r: 11, phase: rand(0, 6.28), taken: false
          });
        }
        return n * 42;
      }
      return 0;
    }

    /* --------------------------- 更新逻辑 --------------------------- */
    update(dt) {
      var m = this.member();
      var target = clamp(CFG.baseSpeed + this.time * CFG.speedGain, CFG.baseSpeed, CFG.maxSpeed) * m.speed;
      var mult = this.buffs.slow > 0 ? 0.55 : 1;             // 慢动作道具
      if (this.buffs.dash > 0) mult *= 1.28;                 // 冲刺道具：速度提升
      this.speed = target * mult;
      this.dashHit = Math.max(0, this.dashHit - dt * 4);
      this.camX += this.speed * dt;
      this.distance = this.camX;

      // 道具倒计时（瞬时道具 heart / rain 的时长是 0，不受影响）
      var b = this.buffs;
      for (var bk = 0; bk < POWERUP_KEYS.length; bk++) {
        var bkey = POWERUP_KEYS[bk];
        if (b[bkey] > 0) b[bkey] = Math.max(0, b[bkey] - dt);
      }

      // 昼夜循环：跑得越远天色越晚（4 段循环渐变）
      this.paletteT = (this.paletteT + dt * 0.055) % 4;

      // 金币连击
      if (this.comboTimer > 0) {
        this.comboTimer -= dt;
        if (this.comboTimer <= 0) this.combo = 0;
      }

      this.ensureWorld();
      this.updatePlayer(dt);
      this.updateObjects(dt);
      this.updateParticles(dt);
      this.cull();

      this.score = Math.floor(this.distance / 12) + this.coinScore;
      this.shake = Math.max(0, this.shake - dt * 22);
      this.flash = Math.max(0, this.flash - dt * 2.6);
    }

    updatePlayer(dt) {
      var p = this.player;
      var m = this.member();

      p.x = this.camX + CFG.playerX;
      p.coyote = Math.max(0, p.coyote - dt);
      p.invuln = Math.max(0, p.invuln - dt);
      p.squash = Math.max(0, p.squash - dt * 4);
      p.springT = Math.max(0, p.springT - dt);
      p.anim += dt * (8 + this.speed / 90);
      // 弹簧靴：跳跃力提升
      p.jumpBoost = this.buffs.boots > 0 ? 1.42 : 1;

      p.blinkTimer -= dt;
      if (p.blinkTimer <= 0) { p.blinkTimer = rand(1.8, 5); p.blinkDur = 0.11; }
      if (p.blinkDur > 0) p.blinkDur -= dt;

      if (p.sliding) {
        // 按住滑铲键可延长滑行
        if (this.slideHeld) p.slideT = Math.max(p.slideT, 0.12);
        p.slideT -= dt;
        if (p.slideT <= 0) this.endSlide();
        // 滑铲火花
        if (p.onGround && Math.random() < 0.5) {
          this.burst(p.x + 4, p.y + p.h - 1, 1, '#fde68a', 0.12);
        }
      }

      var g = CFG.gravity * m.gravity;
      if (p.jumpHeld && p.vy < 0) g *= 0.62;
      if (p.sliding && !p.onGround) g *= 1.5;
      p.vy = Math.min(p.vy + g * dt, 1600);

      var prevBottom = p.y + p.h;
      p.y += p.vy * dt;

      var wasGround = p.onGround;
      p.onGround = false;

      // 地面支撑（以脚中心判断是否在实心地面段上）
      var cx = p.x + p.w / 2;
      var bottom = p.y + p.h;
      var onSeg = false;
      for (var i = 0; i < this.segments.length; i++) {
        var sg = this.segments[i];
        if (cx > sg.x0 && cx < sg.x1) { onSeg = true; break; }
      }
      if (onSeg && p.vy >= 0 && bottom >= CFG.groundY && prevBottom <= CFG.groundY + 14) {
        p.y = CFG.groundY - p.h;
        if (!wasGround && p.vy > 700) {
          p.squash = 1;
          this.burst(p.x + p.w / 2, CFG.groundY, 7, '#dbeafe', 0.22);
          this.sfx('land');
        }
        p.vy = 0;
        p.onGround = true;
      }

      // 弹簧跳台
      for (var s = 0; s < this.springs.length; s++) {
        var sp = this.springs[s];
        if (sp.used) continue;
        if (aabb(p, sp, 4)) {
          sp.used = true;
          p.vy = -CFG.jumpVel * 1.32;
          p.onGround = false;
          p.squash = 1;
          p.springT = 0.45;
          this.addText(p.x + p.w / 2, sp.y - 10, '弹簧!', '#a7f3d0');
          this.burst(sp.x + sp.w / 2, sp.y, 14, '#6ee7b7', 0.4);
          this.sfx('power');
        }
      }

      // 浮空平台
      for (var j = 0; j < this.platforms.length; j++) {
        var pl = this.platforms[j];
        if (p.x + p.w > pl.x + 5 && p.x < pl.x + pl.w - 5) {
          var b2 = p.y + p.h;
          if (p.vy >= 0 && b2 >= pl.y && prevBottom <= pl.y + 14) {
            p.y = pl.y - p.h;
            p.vy = 0;
            p.onGround = true;
            if (!wasGround) this.burst(p.x + p.w / 2, pl.y, 6, '#ddd6fe', 0.2);
          }
        }
      }

      if (p.onGround) {
        p.coyote = 0.1;
        p.jumpsLeft = m.jumps;
        if (this.jumpBuffer > 0) { this.jumpBuffer = 0; this.jump(); }
      }
      this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);

      // 残影（高速或道具状态下更明显）
      if (!p.onGround || this.buffs.double > 0) {
        p.trail.push({ x: p.x, y: p.y, h: p.h, sliding: p.sliding, life: 0.28 });
        if (p.trail.length > 8) p.trail.shift();
      }
      for (var t2 = 0; t2 < p.trail.length; t2++) p.trail[t2].life -= dt;
      p.trail = p.trail.filter(function (t) { return t.life > 0; });

      // 掉进坑里
      if (p.y > CFG.H + 120) this.fallDeath();

      this.handleCollisions();
    }

    handleCollisions() {
      var p = this.player;
      var i;

      // 障碍
      for (i = 0; i < this.obstacles.length; i++) {
        var o = this.obstacles[i];
        if (o.dead) continue;
        if (aabb(p, o, 5)) { this.hitObstacle(o); }
      }

      // 平台侧面撞击（从下方/侧面撞到平台才算碰撞，容错 14px）
      for (i = 0; i < this.platforms.length; i++) {
        var pl = this.platforms[i];
        if (pl.crushed) continue;
        if (aabb(p, pl, 5) && p.y + p.h > pl.y + 14) this.hitObstacle(pl);
      }

      // 道具
      for (i = 0; i < this.powerups.length; i++) {
        var pu = this.powerups[i];
        if (pu.taken) continue;
        if (aabb(p, { x: pu.x - 14, y: pu.y - 14, w: 28, h: 28 }, 2)) this.pickup(pu);
      }
    }

    /* --------------------------- 道具 --------------------------- */
    pickup(pu) {
      pu.taken = true;
      var info = POWERUPS[pu.kind];
      this.buffs[pu.kind] = info.time;
      this.addText(pu.x + 14, pu.y - 8, info.label, info.color);
      this.burst(pu.x + 14, pu.y + 14, 16, info.color, 0.45);
      this.flash = Math.max(this.flash, 0.45);
      this.sfx('power');

      if (pu.kind === 'double') this.coinBuffNote = '双倍分数!';
      if (pu.kind === 'dash') {
        // 冲刺：短时间无敌 + 撞碎前方障碍 + 速度提升（速度提升在 update 里）
        this.player.invuln = Math.max(this.player.invuln, info.time);
        this.addText(this.player.x + this.player.w / 2, this.player.y - 30, '冲!', info.color);
      } else if (pu.kind === 'boots') {
        // 弹簧靴：跳跃力提升，效果持续 time 秒
        this.player.jumpBoost = 1.42;
      } else if (pu.kind === 'heart') {
        // 复活心：立刻 +1 生命；生命已经溢出时存成一次免死
        if (this.lives < this.diff().lives) {
          this.lives++;
          this.addText(this.player.x + this.player.w / 2, this.player.y - 30, '+1 ♥', info.color);
        } else {
          this.buffs.heartSave = 1;
          this.addText(this.player.x + this.player.w / 2, this.player.y - 30, '免死一次!', info.color);
        }
        this.heartsMax = Math.max(this.heartsMax, this.lives);
      } else if (pu.kind === 'rain') {
        // 金币雨：立刻在角色前方撒一串 CD
        this.spawnCoinRain();
      }
    }

    /** 金币雨：从角色前方一段距离开始，波浪形撒一串金币（高度在正常跳跃能吃到的高度内） */
    spawnCoinRain(n) {
      var count = n || 8;
      var x0 = (this.player ? this.player.x : this.camX + CFG.playerX) + 120;
      for (var i = 0; i < count; i++) {
        this.coins_.push({
          x: x0 + i * 52,
          y: CFG.groundY - 80 - Math.sin((i + 1) / (count + 1) * Math.PI) * 38,
          r: 11,
          phase: rand(0, 6.28),
          taken: false
        });
      }
      this.addText(x0 + 40, CFG.groundY - 190, '金币雨!', POWERUPS.rain.color);
      this.flash = Math.max(this.flash, 0.3);
      return count;
    }

    sfx(name) {
      if (this.muted) return;
      if (global.NJMusic && global.NJMusic.sfx) global.NJMusic.sfx(name);
    }

    setMuted(b) {
      this.muted = !!b;
      if (global.NJMusic && global.NJMusic.setMuted) global.NJMusic.setMuted(this.muted);
    }


    hitObstacle(o) {
      var p = this.player;
      if (p.invuln > 0) return;

      // 冲刺：无敌并直接撞碎前方障碍
      if (this.buffs.dash > 0) {
        this.crush(o, POWERUPS.dash.color);
        this.dashHit = 1;
        this.shake = Math.max(this.shake, 7);
        this.sfx('power');
        return;
      }

      // 护盾：免疫一次撞击并把障碍撞碎
      if (this.buffs.shield > 0) {
        this.buffs.shield = 0;
        p.invuln = 0.7;
        this.shake = 10;
        this.flash = 0.55;
        this.burst(p.x + p.w / 2, p.y + p.h * 0.4, 22, '#7dd3fc', 0.55, true);
        this.addText(p.x + p.w / 2, p.y - 10, '护盾抵挡!', '#7dd3fc');
        if (o && o.kind) o.dead = true;
        else if (o) o.crushed = true;
        this.sfx('power');
        return;
      }

      this.lives--;
      p.invuln = CFG.invuln;
      this.shake = 12;
      this.flash = 0.7;
      this.combo = 0;
      this.burst(p.x + p.w / 2, p.y + p.h * 0.4, 18, '#fca5a5', 0.5, true);
      this.addText(p.x + p.w / 2, p.y - 10, '-1 ♥', '#fecaca');
      this.sfx('hit');
      if (o && o.kind) o.dead = true;
      else if (o) o.crushed = true;
      if (this.lives <= 0) {
        // 复活心存的"免死一次"
        if (this.buffs.heartSave > 0) {
          this.buffs.heartSave = 0;
          this.lives = 1;
          p.invuln = CFG.invuln * 1.6;
          this.flash = 0.55;
          this.addText(p.x + p.w / 2, p.y - 36, '复活心救了你!', POWERUPS.heart.color);
          this.burst(p.x + p.w / 2, p.y + p.h * 0.4, 24, POWERUPS.heart.color, 0.6, true);
          return;
        }
        this.gameOver('撞到障碍了');
      }
    }

    /** 冲刺撞碎障碍：碎屑 + 提示文字 */
    crush(o, color) {
      if (!o) return;
      if (o.kind) o.dead = true;
      else o.crushed = true;
      var cx = (o.x || 0) + (o.w || 0) / 2;
      var cy = (o.y || 0) + (o.h || 0) / 2;
      this.burst(cx, cy, 20, color || '#fb923c', 0.55, true);
      this.addText(cx, cy - 22, '撞碎!', color || '#fb923c');
    }


    fallDeath() {
      var p = this.player;
      this.lives--;
      this.shake = 14;
      this.flash = 0.8;

      if (this.lives <= 0) {
        // 复活心存的"免死一次"：掉坑也能救回来
        if (this.buffs.heartSave > 0) {
          this.buffs.heartSave = 0;
          this.lives = 1;
          this.addText(p.x + p.w / 2, p.y - 30, '复活心救了你!', POWERUPS.heart.color);
        } else {
          this.gameOver('掉进坑里了');
          return;
        }
      }

      // 落到下一段实心地面继续跑
      var next = null;
      for (var i = 0; i < this.segments.length; i++) {
        if (this.segments[i].x0 > p.x + 20) { next = this.segments[i]; break; }
      }
      if (!next) { this.gameOver('掉进坑里了'); return; }

      p.x = next.x0 + 90;
      this.camX = p.x - CFG.playerX;
      p.y = CFG.groundY - p.h - 220;
      p.vy = 0;
      p.onGround = false;
      p.invuln = CFG.invuln;
      p.jumpsLeft = this.member().jumps;
      this.addText(p.x + p.w / 2, p.y - 10, '复活!', '#a7f3d0');
      this.ensureWorld();
    }

    updateObjects(dt) {
      var p = this.player;
      var i;

      for (i = 0; i < this.obstacles.length; i++) {
        var o = this.obstacles[i];
        if (o.kind !== 'drone') continue;
        o.phase += dt * 3.2;
        o.y = o.baseY + Math.sin(o.phase) * 14;
        if (o.patrol) {
          o.patrolT = (o.patrolT || 0) + dt * 1.4;
          o.x = o.baseX + Math.sin(o.patrolT) * o.patrolAmp;
        }
      }

      for (i = 0; i < this.springs.length; i++) {
        this.springs[i].phase += dt * 6;
      }
      for (i = 0; i < this.powerups.length; i++) {
        var pu = this.powerups[i];
        if (!pu.taken) pu.phase += dt * 3;
      }

      var pcx = p.x + p.w / 2;
      var pcy = p.y + p.h / 2;
      var magnet = this.buffs.magnet > 0;
      for (i = 0; i < this.coins_.length; i++) {
        var c = this.coins_[i];
        if (c.taken) continue;
        c.phase += dt * 4.5;

        // 磁铁：把附近的金币吸过来
        if (magnet) {
          var mdx = pcx - c.x;
          var mdy = pcy - c.y;
          var dist = Math.sqrt(mdx * mdx + mdy * mdy);
          if (dist < 260 && dist > 1) {
            var pull = (1 - dist / 260) * 620 * dt;
            c.x += (mdx / dist) * pull;
            c.y += (mdy / dist) * pull;
          }
        }

        var dx = c.x - pcx;
        var dy = c.y - pcy;
        if (Math.abs(dx) < c.r + p.w * 0.45 && Math.abs(dy) < c.r + p.h * 0.45) {
          c.taken = true;
          this.takeCoin(c);
        }
      }

      for (i = 0; i < this.texts.length; i++) {
        this.texts[i].y -= dt * 42;
        this.texts[i].life -= dt;
      }
      this.texts = this.texts.filter(function (t) { return t.life > 0; });
    }

    /** 吃到金币：连击倍率 + 双倍分道具 */
    takeCoin(c) {
      this.combo++;
      this.comboTimer = 1.6;
      if (this.combo > this.comboBest) this.comboBest = this.combo;
      var mult = 1 + Math.min(Math.floor(this.combo / 5), 4);      // 最多 ×5
      var gain = 15 * mult * (this.buffs.double > 0 ? 2 : 1);
      this.coins++;
      this.coinScore += gain;
      this.burst(c.x, c.y, 8, '#fde68a', 0.35);
      this.addText(c.x, c.y - 6, '+' + gain + (mult > 1 ? ' ×' + mult : ''), mult > 1 ? '#fcd34d' : '#fde68a');
      this.sfx('coin');
      if (this.combo > 0 && this.combo % 10 === 0) {
        this.addText(this.player.x + this.player.w / 2, this.player.y - 34,
          this.combo + ' 连击!', '#f9a8d4');
        this.flash = Math.max(this.flash, 0.3);
      }
    }

    updateParticles(dt) {
      for (var i = 0; i < this.particles.length; i++) {
        var pt = this.particles[i];
        pt.life -= dt;
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vy += pt.g * dt;
        pt.vx *= 0.99;
      }
      this.particles = this.particles.filter(function (p) { return p.life > 0; });
    }

    cull() {
      var left = this.camX - 320;
      this.segments = this.segments.filter(function (s) { return s.x1 > left; });
      this.obstacles = this.obstacles.filter(function (o) { return !o.dead && o.x + o.w > left; });
      this.platforms = this.platforms.filter(function (p) { return !p.crushed && p.x + p.w > left; });
      this.coins_ = this.coins_.filter(function (c) { return !c.taken && c.x + 40 > left; });
      this.powerups = this.powerups.filter(function (p) { return !p.taken && p.x + 60 > left; });
      this.springs = this.springs.filter(function (s) { return s.x + s.w > left; });
    }

    burst(x, y, n, color, spread, heavy) {
      for (var i = 0; i < n; i++) {
        var a = rand(0, Math.PI * 2);
        var sp = rand(40, 220) * (spread || 0.3) * 3;
        this.particles.push({
          x: x, y: y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 60,
          g: heavy ? 1500 : 900,
          life: rand(0.25, 0.6),
          size: rand(2, heavy ? 6 : 4),
          color: color
        });
      }
    }

    addText(x, y, text, color) {
      this.texts.push({ x: x, y: y, text: text, color: color, life: 0.9 });
    }

    /* --------------------------- 主循环 --------------------------- */
    loop(ts) {
      if (!this.running) return;
      if (!this.lastTs) this.lastTs = ts;
      var dt = (ts - this.lastTs) / 1000;
      this.lastTs = ts;
      if (!isFinite(dt) || dt < 0) dt = 0;
      if (dt > 0.05) dt = 0.05;

      this.time += dt;

      if (this.state === 'playing') {
        this.update(dt);
      } else {
        this.menuScroll += dt * 150;
        this.menuAnim += dt * 9;
        this.shake = Math.max(0, this.shake - dt * 22);
        this.flash = Math.max(0, this.flash - dt * 2.6);
        this.updateParticles(dt);
        if (this.state === 'over') this.updateObjects(dt);
      }

      this.render();

      // 每 ~0.25 秒自己对一次朝向：有些手机在全屏/锁屏状态下不派发 orientationchange，
      // 也没有 matchMedia 的 change 事件，"把手机横过来没反应"就是这两种情况造成的。
      this._orientTick = (this._orientTick || 0) + 1;
      if (this._orientTick % 15 === 0) {
        var land = this.wantsPortrait ? false : isLandscape(this.forceLandscape);
        if (land !== this.landscape) this.syncOrientation();
      }

      if (typeof global.requestAnimationFrame === 'function') {
        global.requestAnimationFrame(this.loopBound);
      }
    }

    /* ---------------------------- 渲染 ---------------------------- */
    render() {
      var ctx = this.ctx;
      if (!ctx) return;
      var view = this.view || { w: CFG.W, h: CFG.H, scale: 1, top: 0 };
      var s = view.scale * this.dpr;
      var shakeX = 0, shakeY = 0;
      if (this.shake > 0.2) {
        shakeX = rand(-1, 1) * this.shake * 0.5;
        shakeY = rand(-1, 1) * this.shake * 0.5;
      }

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

      this.pal = this.palette();          // 每帧算一次昼夜配色

      // 背景层：无相机平移，纵向把视口顶端对齐到 view.top
      ctx.setTransform(s, 0, 0, s, shakeX * s, (-view.top + shakeY) * s);
      this.drawSky();
      this.drawFarCity();
      this.drawTrees();

      // 世界层：叠上相机平移
      ctx.setTransform(s, 0, 0, s, (-this.camX + shakeX) * s, (-view.top + shakeY) * s);
      if (this.state === 'menu') {
        this.drawMenuStage();
      } else {
        this.drawGround();
        this.drawPlatforms();
        this.drawSprings();
        this.drawCoins();
        this.drawPowerups();
        this.drawObstacles();
        this.drawParticles();
        this.drawPlayer();
        this.drawTexts();
      }

      this.syncHud();

      if (this.flash > 0) {
        ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        ctx.fillStyle = 'rgba(255,255,255,' + (this.flash * 0.45).toFixed(3) + ')';
        ctx.fillRect(0, 0, this.cw || CFG.W, this.ch || CFG.H);
      }
    }

    /* -------------------------- 昼夜配色 -------------------------- */
    palette() {
      var i = Math.floor(this.paletteT) % PALETTES.length;
      var f = this.paletteT - Math.floor(this.paletteT);
      var a = PALETTES[i], b = PALETTES[(i + 1) % PALETTES.length];
      var out = { name: f < 0.5 ? a.name : b.name };
      out.sky = [];
      for (var s = 0; s < 4; s++) out.sky.push(mixHex(a.sky[s], b.sky[s], f));
      out.city = mixHex(a.city, b.city, f);
      out.cityLight = mixHex(a.cityLight, b.cityLight, f);
      out.grass = mixHex(a.grass, b.grass, f);
      out.dirt = mixHex(a.dirt, b.dirt, f);
      out.trunk = mixHex(a.trunk, b.trunk, f);
      out.leaves = [];
      for (var l = 0; l < 3; l++) out.leaves.push(mixHex(a.leaves[l], b.leaves[l], f));
      out.sunAlpha = a.sun * (1 - f) + b.sun * f;
      out.star = a.star * (1 - f) + b.star * f;
      out.lamp = a.lamp * (1 - f) + b.lamp * f;
      out.platform = mixHex(a.platform, b.platform, f);
      return out;
    }

    drawSky() {
      var ctx = this.ctx;
      var pal = this.pal || (this.pal = this.palette());
      var v = this.view || { w: CFG.W, h: CFG.H, top: 0 };
      var g = ctx.createLinearGradient(0, v.top, 0, v.top + v.h);
      g.addColorStop(0, pal.sky[0]);
      g.addColorStop(0.45, pal.sky[1]);
      g.addColorStop(0.78, pal.sky[2]);
      g.addColorStop(1, pal.sky[3]);
      ctx.fillStyle = g;
      ctx.fillRect(0, v.top, v.w, v.h);

      // 星星（夜晚）
      if (pal.star > 0.02) {
        ctx.save();
        ctx.globalAlpha = pal.star * 0.9;
        ctx.fillStyle = '#ffffff';
        for (var s = 0; s < 60; s++) {
          var sx = (hash1(s * 3.7) * v.w + this.viewX() * 0.02) % v.w;
          var sy = v.top + hash1(s * 9.1) * v.h * 0.5;
          var tw = 0.5 + 0.5 * Math.sin(this.time * 2 + s);
          ctx.fillRect(sx, sy, 1.6 + tw, 1.6 + tw);
        }
        ctx.restore();
      }

      // 太阳 / 月亮
      ctx.save();
      var sunX = v.w * 0.79 - Math.sin(this.paletteT / PALETTES.length * Math.PI * 2) * 60;
      var sunY = v.top + v.h * 0.2 + Math.cos(this.paletteT / PALETTES.length * Math.PI * 2) * 30;
      ctx.globalAlpha = 0.85 * pal.sunAlpha;
      var sg = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 130);
      sg.addColorStop(0, 'rgba(255,247,214,.95)');
      sg.addColorStop(1, 'rgba(255,247,214,0)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 130, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 云
      var off = (this.viewX() * 0.08) % 520;
      var cloudCount = Math.ceil(v.w / 520) + 2;
      for (var i = -1; i < cloudCount; i++) {
        var x = i * 520 - off + 60;
        var y = v.top + v.h * 0.11 + hash1(i + 3) * v.h * 0.16;
        this.drawCloud(x, y, 0.7 + hash1(i + 11) * 0.7, pal);
      }
    }

    drawCloud(x, y, s, pal) {
      var ctx = this.ctx;
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.35 * (pal ? pal.sunAlpha : 1);
      ctx.fillStyle = pal && pal.star > 0.4 ? '#6b7bb0' : '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y, 46 * s, 24 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 40 * s, y + 6 * s, 34 * s, 18 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x - 42 * s, y + 8 * s, 30 * s, 16 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    drawFarCity() {
      var ctx = this.ctx;
      var pal = this.pal || (this.pal = this.palette());
      var par = this.viewX() * 0.14;
      var base = CFG.groundY + 14;
      var spacing = 96;
      var start = Math.floor((par - 200) / spacing);
      ctx.save();
      var vw = (this.view ? this.view.w : CFG.W);
      for (var k = start; k < start + vw / spacing + 4; k++) {
        var x = k * spacing - par;
        var h = 70 + hash1(k * 1.7) * 170;
        var w = 62 + hash1(k * 3.1) * 26;
        ctx.fillStyle = pal.city;
        ctx.fillRect(x, base - h, w, h);
        // 窗户：夜晚亮灯
        for (var r = 0; r < Math.floor(h / 26); r++) {
          for (var c = 0; c < 3; c++) {
            if (hash1(k * 7 + r * 5 + c) <= 0.5) continue;
            var lit = hash1(k * 13 + r * 3 + c * 7) < 0.25 + pal.lamp * 0.5;
            ctx.fillStyle = lit ? pal.cityLight : 'rgba(255,255,255,.28)';
            ctx.fillRect(x + 8 + c * 18, base - h + 12 + r * 26, 9, 11);
          }
        }
      }
      ctx.restore();
    }

    drawTrees() {
      var ctx = this.ctx;
      var pal = this.pal || (this.pal = this.palette());
      var par = this.viewX() * 0.42;
      var base = CFG.groundY + 16;
      var spacing = 300;
      var start = Math.floor((par - 340) / spacing);
      var vw = (this.view ? this.view.w : CFG.W);
      for (var k = start; k < start + vw / spacing + 4; k++) {
        var x = k * spacing - par + hash1(k * 2.3) * 90;
        var s = 0.8 + hash1(k * 5.7) * 0.55;
        this.drawTree(x, base, s, pal);
        // 路灯（黄昏/夜晚）
        if (pal.lamp > 0.15) {
          var lx = k * spacing - par - 120;
          this.drawLamp(lx, base, pal);
        }
      }
    }

    drawLamp(x, base, pal) {
      var ctx = this.ctx;
      ctx.save();
      ctx.globalAlpha = pal.lamp;
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(x - 3, base - 130, 6, 130);
      ctx.fillRect(x - 3, base - 132, 34, 5);
      var glow = ctx.createRadialGradient(x + 30, base - 126, 2, x + 30, base - 126, 70);
      glow.addColorStop(0, 'rgba(255,236,170,.95)');
      glow.addColorStop(1, 'rgba(255,236,170,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x + 30, base - 126, 70, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    drawTree(x, base, s, pal) {
      var ctx = this.ctx;
      pal = pal || this.pal || (this.pal = this.palette());
      ctx.save();
      ctx.translate(x, base);
      ctx.scale(s, s);
      // 树干
      ctx.fillStyle = pal.trunk;
      roundRect(ctx, -7, -74, 14, 76, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.12)';
      roundRect(ctx, 1, -74, 5, 76, 3);
      ctx.fill();
      // 树冠
      for (var i = 0; i < 3; i++) {
        ctx.fillStyle = pal.leaves[i];
        ctx.beginPath();
        ctx.ellipse((i - 1) * 22, -96 - (i === 1 ? 18 : 0), 34, 26, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    viewX() { return this.state === 'playing' || this.state === 'paused' ? this.camX : this.menuScroll; }

    drawMenuStage() {
      var ctx = this.ctx;
      var v = this.view || { w: CFG.W, h: CFG.H, top: 0 };
      var bottom = v.top + v.h;
      ctx.fillStyle = '#6b4429';
      ctx.fillRect(-40, CFG.groundY + 14, v.w + 80, Math.max(0, bottom - CFG.groundY - 14));
      ctx.fillStyle = '#3f8f5a';
      roundRect(ctx, -40, CFG.groundY, v.w + 80, 16, 6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fillRect(-40, CFG.groundY, v.w + 80, 3);

      var m = this.member();
      drawCharacter(ctx, m, CFG.playerX, CFG.groundY, 54, {
        sliding: false, airborne: false, phase: this.menuAnim, blink: false
      });

      // 地面滚动条纹
      var off = this.menuScroll % 80;
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#a97b52';
      for (var i = -1; i < v.w / 80 + 2; i++) {
        ctx.fillRect(i * 80 - off, CFG.groundY + 26, 40, 6);
      }
      ctx.restore();
    }

    drawGround() {
      var ctx = this.ctx;
      var pal = this.pal || this.palette();
      var v = this.view || { w: CFG.W, h: CFG.H, top: 0 };
      var groundBottom = v.top + v.h;
      for (var i = 0; i < this.segments.length; i++) {
        var s = this.segments[i];
        var w = s.x1 - s.x0;
        if (w <= 0) continue;
        // 泥土
        ctx.fillStyle = pal.dirt;
        ctx.fillRect(s.x0, CFG.groundY + 14, w, Math.max(0, groundBottom - CFG.groundY - 14));
        ctx.fillStyle = 'rgba(0,0,0,.18)';
        ctx.fillRect(s.x0, CFG.groundY + 60, w, Math.max(0, groundBottom - CFG.groundY - 60));
        // 草皮
        ctx.fillStyle = pal.grass;
        roundRect(ctx, s.x0, CFG.groundY, w, 16, 5);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        ctx.fillRect(s.x0, CFG.groundY, w, 3);
        // 纹理
        var startK = Math.floor(s.x0 / 70);
        var endK = Math.ceil(s.x1 / 70);
        ctx.fillStyle = 'rgba(255,255,255,.06)';
        for (var k = startK; k < endK; k++) {
          var x = k * 70;
          if (x < s.x0 || x > s.x1) continue;
          ctx.fillRect(x + 12, CFG.groundY + 34, 18, 5);
          ctx.fillRect(x + 44, CFG.groundY + 52, 12, 5);
        }
      }
    }

    drawPlatforms() {
      var ctx = this.ctx;
      var pal = this.pal || this.palette();
      for (var i = 0; i < this.platforms.length; i++) {
        var p = this.platforms[i];
        if (p.crushed) continue;
        ctx.fillStyle = 'rgba(0,0,0,.18)';
        roundRect(ctx, p.x + 4, p.y + 7, p.w, p.h, 8);
        ctx.fill();
        ctx.fillStyle = pal.platform;
        roundRect(ctx, p.x, p.y, p.w, p.h, 8);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.65)';
        roundRect(ctx, p.x, p.y, p.w, 7, 5);
        ctx.fill();
      }
    }

    /** 弹簧跳台 */
    drawSprings() {
      var ctx = this.ctx;
      for (var i = 0; i < this.springs.length; i++) {
        var s = this.springs[i];
        var squash = s.used ? 0 : Math.sin(s.phase) * 2;
        ctx.save();
        ctx.translate(s.x + s.w / 2, s.y + s.h);
        // 底座
        ctx.fillStyle = '#475569';
        roundRect(ctx, -s.w / 2, -6, s.w, 8, 3);
        ctx.fill();
        // 弹簧圈
        ctx.strokeStyle = s.used ? '#94a3b8' : '#34d399';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (var k = 0; k < 3; k++) {
          var y = -8 - k * 4 + squash * 0.5;
          ctx.moveTo(-9, y);
          ctx.lineTo(9, y - 2);
        }
        ctx.stroke();
        // 顶板
        ctx.fillStyle = s.used ? '#64748b' : '#6ee7b7';
        roundRect(ctx, -s.w / 2, -22 + squash, s.w, 8, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        roundRect(ctx, -s.w / 2 + 3, -20 + squash, s.w - 6, 3, 2);
        ctx.fill();
        ctx.restore();
      }
    }

    /** 道具图标（护盾/磁铁/双倍/慢动作） */
    drawPowerups() {
      var ctx = this.ctx;
      for (var i = 0; i < this.powerups.length; i++) {
        var pu = this.powerups[i];
        if (pu.taken) continue;
        var info = POWERUPS[pu.kind];
        var bob = Math.sin(pu.phase) * 5;
        var spin = Math.sin(pu.phase * 0.8) * 0.25;
        ctx.save();
        ctx.translate(pu.x + 15, pu.y + 15 + bob);
        // 光晕
        var glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
        glow.addColorStop(0, info.color);
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 34, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        // 方块
        ctx.rotate(spin);
        ctx.fillStyle = info.color;
        roundRect(ctx, -15, -15, 30, 30, 9);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.85)';
        ctx.lineWidth = 2;
        roundRect(ctx, -15, -15, 30, 30, 9);
        ctx.stroke();
        ctx.rotate(-spin);
        ctx.fillStyle = '#0b1020';
        ctx.textAlign = 'center';
        ctx.font = '800 15px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(info.icon, 0, 6);
        ctx.restore();
      }
    }

    drawCoins() {
      var ctx = this.ctx;
      for (var i = 0; i < this.coins_.length; i++) {
        var c = this.coins_[i];
        if (c.taken) continue;
        var sx = Math.max(0.22, Math.abs(Math.cos(c.phase)));
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(sx, 1);
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(0, 0, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath();
        ctx.arc(0, 0, c.r * 0.42, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.beginPath();
        ctx.ellipse(-c.r * 0.4, -c.r * 0.35, c.r * 0.22, c.r * 0.5, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    drawObstacles() {
      var ctx = this.ctx;
      for (var i = 0; i < this.obstacles.length; i++) {
        var o = this.obstacles[i];
        if (o.dead) continue;
        if (o.kind === 'crate') {
          ctx.fillStyle = '#c08457';
          roundRect(ctx, o.x, o.y, o.w, o.h, 5);
          ctx.fill();
          ctx.strokeStyle = '#8a5a3b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(o.x + 3, o.y + 3);
          ctx.lineTo(o.x + o.w - 3, o.y + o.h - 3);
          ctx.moveTo(o.x + o.w - 3, o.y + 3);
          ctx.lineTo(o.x + 3, o.y + o.h - 3);
          ctx.stroke();
          ctx.strokeRect(o.x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
        } else if (o.kind === 'gate') {
          ctx.fillStyle = '#e2e8f0';
          roundRect(ctx, o.x, o.y, o.w, o.h, 6);
          ctx.fill();
          ctx.save();
          ctx.beginPath();
          roundRect(ctx, o.x, o.y, o.w, o.h, 6);
          ctx.clip();
          ctx.fillStyle = 'rgba(250,204,21,.85)';
          for (var s = -o.h; s < o.w; s += 22) {
            ctx.beginPath();
            ctx.moveTo(o.x + s, o.y + o.h);
            ctx.lineTo(o.x + s + 11, o.y + o.h);
            ctx.lineTo(o.x + s + 11 + o.h, o.y);
            ctx.lineTo(o.x + s + o.h, o.y);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
          // 立柱
          ctx.fillStyle = '#64748b';
          ctx.fillRect(o.x + 4, o.y + o.h, 6, CFG.groundY - (o.y + o.h));
          ctx.fillRect(o.x + o.w - 10, o.y + o.h, 6, CFG.groundY - (o.y + o.h));
        } else if (o.kind === 'drone') {
          var t = this.time * 18;
          ctx.save();
          ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
          // 旋翼
          ctx.strokeStyle = 'rgba(30,41,59,.65)';
          ctx.lineWidth = 2.4;
          for (var d = 0; d < 2; d++) {
            var dx = d === 0 ? -20 : 20;
            ctx.beginPath();
            ctx.moveTo(dx - 12 * Math.cos(t), -12);
            ctx.lineTo(dx + 12 * Math.cos(t), -12);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(dx, -12);
            ctx.lineTo(dx, -4);
            ctx.stroke();
          }
          // 机身
          ctx.fillStyle = '#334155';
          roundRect(ctx, -24, -8, 48, 18, 8);
          ctx.fill();
          ctx.fillStyle = '#0ea5e9';
          ctx.beginPath();
          ctx.arc(0, 2, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(0, 2, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    drawParticles() {
      var ctx = this.ctx;
      for (var i = 0; i < this.particles.length; i++) {
        var p = this.particles[i];
        ctx.save();
        ctx.globalAlpha = clamp(p.life * 2, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    drawTexts() {
      var ctx = this.ctx;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '700 16px "PingFang SC","Microsoft YaHei",sans-serif';
      for (var i = 0; i < this.texts.length; i++) {
        var t = this.texts[i];
        ctx.globalAlpha = clamp(t.life, 0, 1);
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        ctx.fillText(t.text, t.x + 1, t.y + 1);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
      }
      ctx.restore();
    }

    drawPlayer() {
      var ctx = this.ctx;
      var p = this.player;
      var m = this.member();
      var cx = p.x + p.w / 2;
      var feetY = p.y + p.h;

      // 残影
      for (var i = 0; i < p.trail.length; i++) {
        var tr = p.trail[i];
        ctx.save();
        ctx.globalAlpha = clamp(tr.life * 1.1, 0, 0.26);
        drawCharacter(ctx, m, tr.x + p.w / 2, tr.y + tr.h, tr.sliding ? 48 : tr.h, {
          sliding: tr.sliding, airborne: true, phase: p.anim, blink: true
        });
        ctx.restore();
      }

      // 道具光环
      var cy = p.y + p.h / 2;
      if (this.buffs.shield > 0) {
        var fade = this.buffs.shield < 1.6 && Math.floor(this.time * 8) % 2 === 0 ? 0.25 : 0.85;
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.strokeStyle = '#7dd3fc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, 34 + Math.sin(this.time * 6) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = fade * 0.25;
        ctx.fillStyle = '#7dd3fc';
        ctx.fill();
        ctx.restore();
      }
      if (this.buffs.magnet > 0) {
        ctx.save();
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = '#f9a8d4';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.lineDashOffset = -this.time * 40;
        ctx.beginPath();
        ctx.arc(cx, cy, 46 + Math.sin(this.time * 4) * 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
      if (this.buffs.double > 0) {
        ctx.save();
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#fcd34d';
        for (var d = 0; d < 5; d++) {
          var a = this.time * 2.4 + d * 1.26;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * 30, cy + Math.sin(a) * 26, 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      if (this.buffs.slow > 0) {
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#c4b5fd';
        var sv = this.view || { w: CFG.W, h: CFG.H, top: 0 };
        ctx.fillRect(this.camX, sv.top, sv.w, sv.h);
        ctx.restore();
      }
      // 冲刺：橙色速度线 + 撞碎提示
      if (this.buffs.dash > 0) {
        ctx.save();
        ctx.globalAlpha = this.dashHit > 0 ? 0.95 : 0.75;
        ctx.strokeStyle = POWERUPS.dash.color;
        ctx.lineWidth = 2.5;
        for (var ds = 0; ds < 6; ds++) {
          var dyy = p.y + 6 + ds * 9;
          var dlen = 26 + ((this.time * 220 + ds * 33) % 46);
          ctx.beginPath();
          ctx.moveTo(p.x - dlen - 8, dyy);
          ctx.lineTo(p.x - 6, dyy);
          ctx.stroke();
        }
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 3;
        ctx.strokeStyle = POWERUPS.dash.color;
        ctx.beginPath();
        ctx.arc(cx, cy, 30 + Math.sin(this.time * 10) * 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      // 弹簧靴：脚下的绿色弹簧光环
      if (this.buffs.boots > 0) {
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = POWERUPS.boots.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, feetY + 2, 20 + Math.sin(this.time * 9) * 2, 6.5, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      // 免死一次：身边的心形光环
      if (this.buffs.heartSave > 0) {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = POWERUPS.heart.color;
        for (var hs = 0; hs < 3; hs++) {
          var ha = this.time * 2 + hs * 2.1;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(ha) * 26, cy + Math.sin(ha) * 24 - 6, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      if (p.invuln > 0 && this.buffs.dash <= 0 && Math.floor(this.time * 20) % 2 === 0) return;

      // 挤压拉伸
      var sy = 1, sx = 1;
      if (p.squash > 0) { sy = 1 - 0.3 * p.squash; sx = 1 + 0.24 * p.squash; }
      else if (!p.onGround && p.vy < -260) { sy = 1.12; sx = 0.9; }
      else if (p.springT > 0) { sy = 1.2; sx = 0.86; }

      ctx.save();
      ctx.translate(cx, feetY);
      ctx.scale(sx, sy);
      ctx.translate(-cx, -feetY);
      drawCharacter(ctx, m, cx, feetY, p.sliding ? 48 : p.h, {
        sliding: p.sliding,
        airborne: !p.onGround,
        phase: p.anim,
        blink: p.blinkDur > 0
      });
      ctx.restore();
    }

    /* --------------------------- 界面同步 --------------------------- */
    /** 难度选择一排大按钮（选人页与暂停页共用） */
    difficultyHtml() {
      var html = '<div class="nj-diffwrap"><div class="nj-difflabel">难度</div><div class="nj-diff">';
      for (var i = 0; i < DIFFICULTIES.length; i++) {
        var d = DIFFICULTIES[i];
        html += '<button class="nj-diffbtn' + (i === this.difficultyIndex ? ' is-active' : '') + '"' +
          ' data-act="difficulty" data-index="' + i + '" style="--c:' + d.grade + '">' +
          '<span>' + d.name + '</span><i>♥' + d.lives + ' · ' + d.baseSpeed + '→' + d.maxSpeed + '</i></button>';
      }
      html += '</div></div>';
      return html;
    }

    syncUi() {
      this.root.setAttribute('data-state', this.state);
      // 完全全屏：游玩时不显示任何操作提示（跳/滑铲/暂停按钮、顶部角色胶囊、全屏按钮）
      this.root.setAttribute('data-clean', this.completeFullscreen() ? '1' : '0');
      this.syncTopAction();
      this.overlay.hidden = this.state === 'playing';
      this.syncOrientation();
      var land = this.landscape;
      var touch = isTouch();
      var html = '';

      if (this.state === 'menu') {
        html += '<h1 class="nj-title">成员跑酷</h1>';
        html += '<p class="nj-sub">选一位成员开跑：跳过木箱与无人机，滑过限高横杆，吃 CD 攒连击，捡 8 种道具' +
          '（护盾 / 磁铁 / 双倍分 / 慢动作 / 冲刺 / 弹簧靴 / 复活心 / 金币雨）。</p>';
        html += '<div class="nj-members">';
        for (var i = 0; i < MEMBERS.length; i++) {
          var m = MEMBERS[i];
          html += '<button class="nj-member' + (i === this.memberIndex ? ' is-active' : '') + '"' +
            ' data-act="member" data-index="' + i + '" style="--c:' + m.color + '">' +
            '<span class="nj-avatar">' + m.initial + '</span>' +
            '<b>' + m.name + '</b><i>' + m.tag + '</i></button>';
        }
        html += '</div>';
        html += this.difficultyHtml();
        // 全屏开关那一行：主页已经全屏、或玩家已经走过"横屏并全屏/仍然竖屏玩"这个岔路口之后，
        // 就都不再出现（避免重复问"要不要全屏"）
        if (fullscreenApi() && !this.completeFullscreen() && !this.gateAnswered) {
          html += '<div class="nj-fsrow"><span>进入游戏自动全屏</span>' +
            '<button class="nj-toggle' + (this.settings.autoFs !== false ? ' is-on' : '') + '" data-act="autofs" role="switch" ' +
            'aria-checked="' + (this.settings.autoFs !== false) + '"><i></i></button>' +
            '<button class="nj-fsmini" data-act="fullscreen">现在就全屏</button></div>';
        }
        html += '<div class="nj-row"><button class="nj-btn" data-act="start">开始跑酷</button></div>';
        html += '<div class="nj-keys">' +
          (touch
            ? '手机：<b>点右半边屏幕 = 跳</b>，<b>按住左半边 = 滑铲</b>，右下角按钮可换人<br>'
            : '键盘：<b>空格 / ↑ = 跳</b>，<b>↓ = 滑铲</b>，<b>P / Esc = 暂停</b>，<b>1~5 = 换人</b><br>') +
          '当前难度 <b>' + this.diff().name + '</b>：生命 <b>' + this.diff().lives + '</b> 颗心，' +
          '撞障碍、掉坑各 -1 ♥' +
          // 内部系数只在桌面端露出来，手机上看人话就够了
          (touch ? '' : '（障碍密度 ×' + this.diff().density + '，道具频率 ×' + this.diff().power + '）') + '<br>' +
          'Hanni 跳最高、Hyein 能三段跳、Haerin 滑最久、Danielle 跑最快；每 5 张 CD 提升一级连击倍率（最高 ×5）<br>' +
          (land ? '想更大画面就点右上角全屏按钮。' : '把手机横过来画面更大；也可以点右上角全屏按钮。') +
          '</div>';
      } else if (this.state === 'paused') {
        html += '<h1 class="nj-title">已暂停</h1>';
        html += '<p class="nj-sub">当前分数 ' + this.score + ' · 已跑 ' + Math.floor(this.distance / 50) + ' m · ' +
          this.diff().name + '</p>';
        html += this.difficultyHtml();
        html += '<div class="nj-row">' +
          '<button class="nj-btn" data-act="resume">继续</button>' +
          '<button class="nj-btn ghost" data-act="restart">重来</button>' +
          '<button class="nj-btn ghost" data-act="menu">返回选人</button>' +
          '</div>';
      } else if (this.state === 'over') {
        var isBest = this.isNewBest;
        html += '<h1 class="nj-title">游戏结束</h1>';
        html += '<p class="nj-ran"><b>' + this.member().name + '</b> 跑了 <b>' +
          Math.floor(this.distance / 50) + '</b> m</p>';
        if (this.overReason) html += '<p class="nj-sub">' + this.overReason + '</p>';
        html += '<div class="nj-score">' + this.score + '</div>';
        html += '<p class="nj-sub">' + (isBest ? '🎉 新纪录！' : '最好成绩 ' + this.best) +
          '　·　CD ' + this.coins + ' 张　·　最高连击 ' + this.comboBest +
          '　·　难度 ' + this.diff().name + '</p>';
        html += '<div class="nj-row">' +
          '<button class="nj-btn" data-act="restart">再来一次</button>' +
          '<button class="nj-btn ghost" data-act="menu">换个成员</button>' +
          '</div>';
      }

      this.overlay.innerHTML = html;
    }
  }

  /** 是不是手机（触摸设备）：iOS Safari 标签页里没有全屏 API，但仍然要给它"干净的界面" */
  function isPhoneTouch() {
    var n = global.navigator || {};
    try {
      if (n.maxTouchPoints > 0 || n.msMaxTouchPoints > 0) return true;
    } catch (e) { /* ignore */ }
    if ('ontouchstart' in global) return true;
    if (typeof global.matchMedia === 'function') {
      var qs = ['(any-pointer: coarse)', '(pointer: coarse)', '(hover: none)', '(display-mode: standalone)'];
      for (var i = 0; i < qs.length; i++) {
        try { if (global.matchMedia(qs[i]).matches) return true; } catch (e2) { /* ignore */ }
      }
    }
    return n.standalone === true;
  }

  /**
   * 是不是触摸设备（决定要不要显示 滑铲/跳/暂停 按钮）。
   * 不能只看 `(pointer: coarse)`：**iOS「添加到主屏幕」的独立模式下这个媒体查询会失效**
   * （会被当成桌面设备），结果竖屏模式下一个按钮都不显示。所以这里多路判断，
   * 并且真正收到一次 touch 事件后也会强制切到触摸模式（见 bindEvents）。
   */
  function isTouch() {
    var n = global.navigator || {};
    try {
      if (n.maxTouchPoints > 0 || n.msMaxTouchPoints > 0) return true;
    } catch (e) { /* ignore */ }
    if ('ontouchstart' in global) return true;
    if (typeof global.matchMedia === 'function') {
      var qs = ['(pointer: coarse)', '(any-pointer: coarse)', '(hover: none)',
        '(display-mode: standalone)', '(display-mode: fullscreen)'];
      for (var i = 0; i < qs.length; i++) {
        try { if (global.matchMedia(qs[i]).matches) return true; } catch (e2) { /* ignore */ }
      }
    }
    if (n.standalone === true) return true;          // iOS 从主屏幕图标启动
    return false;
  }

  global.NewJeansParkour = Game;

  // 供外壳 / 测试读取难度表与道具表（只读用途）
  global.NJ_PARKOUR_DIFFICULTIES = DIFFICULTIES;
  global.NJ_PARKOUR_POWERUPS = POWERUPS;

  // 供首页（app.js）挂载：与 rhythm 模块保持同样的接口
  global.NJGames = global.NJGames || {};
  global.NJGames.parkour = {
    id: 'parkour',
    name: '成员跑酷',
    subtitle: '2D 横版跑酷 · 5 位成员',
