  function setBanner(text, kind) {
    if (!banner) return;
    if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
    if (!text) { banner.hidden = true; banner.textContent = ''; return; }
    banner.hidden = false;
    banner.textContent = text;
    banner.className = NS + '-banner' + (kind ? ' is-' + kind : '');
    bannerShown = true;
    // 提示不要一直挡在界面上：几秒后自动收起（也可以点一下立刻收起）
    bannerTimer = setTimeout(function () { setBanner(''); }, 4200);
  }

  function unlockAudio() {
    audioTried = true;
    var m = global.NJMusic;
    if (!m || !m.unlock) { setBanner('当前浏览器不支持 Web Audio，静音可玩', 'warn'); return; }
    var supported = true;
    if (m.isSupported) { try { supported = !!m.isSupported(); } catch (e) { supported = true; } }
    var bad = false;
    try { bad = m.unlock() === 'unsupported'; } catch (e2) { bad = true; }
    if (bad || !supported) { setBanner('当前浏览器不支持 Web Audio，静音可玩', 'warn'); return; }
    // 解锁成功不再弹提示（会挡住主界面），静默即可
    setBanner('');
  }

  function onFirstGesture() {
    doc.removeEventListener('pointerdown', onFirstGesture, true);
    doc.removeEventListener('touchstart', onFirstGesture, true);
    doc.removeEventListener('click', onFirstGesture, true);
    unlockAudio();
  }

  function toastMsg(text) {
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
  }

  /* ==================== 新版本检测（自动刷新） ====================
     老页面（比如之前 music 还没上线时打开的标签页）不会自己更新。这里定期比对构建号，
     发现服务端已经是新版本就自动刷新；正在玩的时候不打断，等回到首页再刷。
     刷新时带 ?v=构建号，避免"缓存里的旧 HTML + 新的 version.json"刷成死循环。 */
  var buildChecking = false;
  function updateBar() {
    if (doc.getElementById('nj-update-bar')) return;
    var bar = make('div', NS + '-update');
    bar.id = 'nj-update-bar';
    bar.innerHTML = '<span>页面还是旧版本，自动刷新没成功</span>';
    var btn = make('button', NS + '-update-btn', '强制刷新');
    btn.setAttribute('type', 'button');
    btn.addEventListener('click', function () {
      location.replace(location.pathname + '?v=' + Date.now() + location.hash);
    });
    bar.appendChild(btn);
    modalMount().appendChild(bar);      // 全屏时也要挂进全屏元素里，否则看不见
  }
  /** 是不是"真的在跑一局"（只有这种情况才值得为自动刷新等一等） */
  function runningRun() {
    if (!current || !current.game) return false;
    var id = current.game.id;
    try {
      if (id === 'rhythm') {
        var r = global.__njRhythm;
        return !!(r && r.getDebug && r.getDebug().state === 'playing');
      }
      if (id === 'parkour') {
        var p = global.__njParkour;
        return !!(p && p.state === 'playing');
      }
    } catch (e) { /* ignore */ }
    return false;
  }

  function checkBuild() {
    if (buildChecking) return;
    buildChecking = true;
    var mine = global.__NJ_BUILD;
    if (!mine) { buildChecking = false; return; }
    var req;
    try { req = global.fetch('version.json?_=' + Date.now(), { cache: 'no-store' }); } catch (e) { buildChecking = false; return; }
    Promise.resolve(req).then(function (r) { return r && r.ok ? r.json() : null; }).then(function (j) {
      buildChecking = false;
      if (!j || !j.build || j.build === mine) {
        try { global.sessionStorage.removeItem('nj-reloaded-for'); } catch (e2) { /* ignore */ }
        return;
      }
      // 只在"正在跑一局"时延后，选歌/菜单/首页都直接刷
      if (runningRun()) { setTimeout(checkBuild, 4000); return; }
      var tried = '';
      try { tried = global.sessionStorage.getItem('nj-reloaded-for') || ''; } catch (e3) { /* ignore */ }
      if (tried === j.build) { updateBar(); return; }   // 已经为这个版本刷过还是旧的 → 不循环，留手动兜底
      try { global.sessionStorage.setItem('nj-reloaded-for', j.build); } catch (e4) { /* ignore */ }
      location.replace(location.pathname + '?v=' + encodeURIComponent(j.build) + location.hash);
    }).catch(function () { buildChecking = false; });
  }
  function watchBuild() {
    checkBuild();
    global.addEventListener('focus', checkBuild);
    doc.addEventListener('visibilitychange', function () { if (!doc.hidden) checkBuild(); });
    setInterval(checkBuild, 30000);
  }

  /* ============================ 首页视图 ============================ */
  function buildHome() {
    var home = make('div', NS + '-home');
    var syncers = [];                       // 需要同步的 UI 刷新函数
    function syncAll() { for (var i = 0; i < syncers.length; i++) syncers[i](); }
    /* --- 标题 --- */
    var hero = make('div', NS + '-hero');
    var heroText = make('div', NS + '-hero-text');
    heroText.appendChild(make('h1', NS + '-title', 'NewJeans 小游戏'));
    heroText.appendChild(make('p', NS + '-sub',
      '手机上随点随玩的两个小游戏：跟着伴奏打击节拍，或者选一位成员一直跑下去。'));
    hero.appendChild(heroText);
    home.appendChild(hero);

    /* --- 两张游戏大卡片 --- */
    var secGames = make('div', NS + '-section');
    secGames.appendChild(make('p', NS + '-label', '开始游戏'));
    for (var i = 0; i < GAMES.length; i++) {
      secGames.appendChild(buildCard(GAMES[i]));
    }
    home.appendChild(secGames);

    /* --- 设置 --- */
    var secSet = make('div', NS + '-section');
    secSet.appendChild(make('p', NS + '-label', '设置'));
    var panel = make('div', NS + '-panel');

    // 全屏开关：支持的浏览器给开关；不支持的（iPhone Safari / 微信内置）给"怎么全屏"的说明
    var fsRow = make('div', NS + '-row' + ' ' + NS + '-row-first');
    var fsMain = make('div', NS + '-row-main');
    fsMain.appendChild(make('div', null, '全屏'));
    var fsHint = make('p', NS + '-hint', '进入游戏后也更沉浸');
    fsMain.appendChild(fsHint);
    fsRow.appendChild(fsMain);
    var fsBtn = make('button', NS + '-switch', '⛶ 全屏');
    fsBtn.type = 'button';
    fsBtn.addEventListener('click', function () {
      if (fullscreenApi()) toggleFullscreen();
      else showFullscreenHelp();
    });
    fsRow.appendChild(fsBtn);
    panel.appendChild(fsRow);
    syncers.push(function () {
      var st = fullscreenState();
      if (st === 'unsupported') {
        fsBtn.textContent = '怎么全屏';
        fsHint.textContent = isInApp() ? '内置浏览器不支持，需在浏览器里打开' :
          (isIOS() ? 'iPhone 需「添加到主屏幕」后从图标打开' : '这个浏览器不支持网页全屏');
      } else if (st === 'standalone') {
        fsBtn.textContent = '已是全屏';
        fsHint.textContent = '从主屏幕图标启动，没有地址栏';
      } else {
        fsBtn.textContent = fullscreenEl() ? '退出全屏' : '⛶ 全屏';
        fsHint.textContent = '进入游戏后也更沉浸';
      }
    });

    // 音量滑块
    var volRow = make('div', NS + '-row' + ' ' + NS + '-row-first');
    var volMain = make('div', NS + '-row-main');
    var volTop = make('div', NS + '-row-top');
    volTop.appendChild(make('span', null, '音量'));
    var volVal = make('b', null, '');
    volTop.appendChild(volVal);
    volMain.appendChild(volTop);
    var range = doc.createElement('input');
    range.type = 'range';
    range.className = NS + '-range';
    range.min = '0';
    range.max = '100';
    range.step = '1';
    range.setAttribute('aria-label', '音量');
    volMain.appendChild(range);
    volRow.appendChild(volMain);
    panel.appendChild(volRow);

    range.addEventListener('input', function () {
      state.volume = clamp(parseInt(range.value, 10) / 100, 0, 1);
      var m = global.NJMusic;
      if (m && m.setVolume) { try { m.setVolume(state.volume); } catch (e) { /* ignore */ } }
      syncAll();
      savePrefs();
    });
    range.addEventListener('change', function () {
      savePrefs();
      playUi();
    });

    // 静音开关
    var muteRow = make('div', NS + '-row');
    var muteMain = make('div', NS + '-row-main');
    muteMain.appendChild(make('div', null, '静音'));
    muteMain.appendChild(make('p', NS + '-hint', '关掉声音也照样能玩'));
    muteRow.appendChild(muteMain);
    var muteBtn = make('button', NS + '-switch', '');
    muteBtn.type = 'button';
    muteBtn.addEventListener('click', function () {
      state.muted = !state.muted;
      var m = global.NJMusic;
      if (m && m.setMuted) { try { m.setMuted(state.muted); } catch (e) { /* ignore */ } }
      if (!state.muted && !audioTried) unlockAudio();
      syncAll();
      savePrefs();
      playUi();
    });
    muteRow.appendChild(muteBtn);
    panel.appendChild(muteRow);

    // 成员选择（圆形色块，进跑酷时通过 opts.member 传入）
    var members = global.MEMBERS_NEWJEANS || [];
    var memWrap = null;
    if (members.length) {
      state.member = clamp(state.member, 0, members.length - 1);
      memWrap = make('div', NS + '-picks');
      for (var k = 0; k < members.length; k++) {
        memWrap.appendChild(buildPick(members[k] || {}, k));
      }
      panel.appendChild(memWrap);
    }
    home.appendChild(secSet);
    secSet.appendChild(panel);

    function buildPick(mem, idx) {
      var pick = make('button', NS + '-pick');
      pick.type = 'button';
      pick.setAttribute('data-index', String(idx));
      pick.style.setProperty('--c', mem.color || '#7dd3fc');
      var initial = mem.initial || (mem.name ? String(mem.name).charAt(0) : String(idx + 1));
      pick.appendChild(make('span', 'dot', initial));
      pick.appendChild(make('span', 'nm', mem.name || ('成员 ' + (idx + 1))));
      if (mem.tag) pick.setAttribute('aria-label', (mem.name || '') + ' · ' + mem.tag);
      pick.addEventListener('click', function () {
        state.member = idx;
        syncAll();
        savePrefs();
        playUi();
        if (current && current.setMember) current.setMember(idx);
      });
      return pick;
    }

    /* --- 底部小字 --- */
    var foot = make('p', NS + '-foot');
    foot.appendChild(make('span', null, '节奏打击里的曲目用你自己放在 music/ 的音频文件，谱面由音频分析生成；'));
    foot.appendChild(doc.createElement('br'));
    foot.appendChild(make('span', null, '「我的音乐」也能载入你自己的音频，全部在本机分析。'));
    foot.appendChild(doc.createElement('br'));
    foot.appendChild(make('span', null, '进度、曲库与设置只保存在这台设备上，建议竖屏使用。'));
    home.appendChild(foot);

    /* --- 最底部：联系我 --- */
    var contactRow = make('div', NS + '-contact');
    var contactBtn = make('button', NS + '-contact-btn', '联系我');
    contactBtn.setAttribute('type', 'button');
    contactBtn.addEventListener('click', function () { showContact(); });
    contactRow.appendChild(contactBtn);
    home.appendChild(contactRow);

    /* --- 同步 --- */
    syncers.push(function () {
      var p = Math.round(state.volume * 100);
      if (range.value !== String(p)) range.value = String(p);
      volVal.textContent = state.muted ? p + '% · 静音' : p + '%';
      muteBtn.textContent = state.muted ? '已静音' : '有声';
      muteBtn.setAttribute('aria-pressed', state.muted ? 'true' : 'false');
      if (memWrap) {
        var picks = memWrap.querySelectorAll('.' + NS + '-pick');
        for (var j = 0; j < picks.length; j++) {
          if (j === state.member) picks[j].classList.add('is-on');
          else picks[j].classList.remove('is-on');
        }
      }
    });
    syncAll();

    homeRefresh = syncAll;
    return home;
  }

  function playUi() {
    var m = global.NJMusic;
    if (!m || !m.sfx || state.muted) return;
    try { m.sfx('ui'); } catch (e) { /* ignore */ }
  }

  function buildCard(def) {
    var game = global.NJGames ? global.NJGames[def.id] : null;
    var card = make('button', NS + '-card');
    card.type = 'button';
    card.setAttribute('data-game', def.id);
    card.appendChild(make('span', 'glyph', def.glyph));
    var info = make('span', 'info');
    info.appendChild(make('b', null, (game && game.name) || def.fallbackName));
    info.appendChild(make('em', null, (game && game.subtitle) || def.fallbackSub));
    info.appendChild(make('i', null, metaOf(def)));
    card.appendChild(info);
    card.appendChild(make('span', 'go', def.action));
    card.addEventListener('click', function () { goRoute('#/' + def.id); });
    return card;
  }

  /* ============================ 游戏视图 ============================ */
  var topActions = null;        // 顶栏右侧的动作插槽（游戏可放"暂停"等按钮）
  var topActionEls = {};
  /** 游戏往顶栏加一个按钮，例如跑酷的"暂停" */
  function setTopAction(id, label, onClick) {
    if (!topActions) return;
    clearTopAction(id);
    var b = make('button', NS + '-topact', label);
    b.type = 'button';
    b.setAttribute('data-topact', id);
    b.addEventListener('click', function (e) { e.preventDefault(); onClick && onClick(); });
    topActions.appendChild(b);
    topActionEls[id] = b;
    return b;
  }
  function clearTopAction(id) {
    var el = topActionEls[id];
    if (el && el.parentNode) el.parentNode.removeChild(el);
    delete topActionEls[id];
  }
  function clearAllTopActions() {
    Object.keys(topActionEls).forEach(clearTopAction);
    if (topActions) topActions.innerHTML = '';
  }

  function buildGame(game) {
    var wrap = make('div', NS + '-view');

    var bar = make('div', NS + '-stagebar');
    var back = make('button', NS + '-back', '‹ 返回');
    back.type = 'button';
    back.addEventListener('click', function () {
      // 先让游戏自己处理（比如节奏打击在结算界面时，返回 = 回到选曲目）
      var inst = current && current.inst;
      if (inst && typeof inst.onShellBack === 'function') {
        var handled = false;
        try { handled = inst.onShellBack() === true; } catch (e) { handled = false; }
        if (handled) return;
      }
      exitToHome();
    });
    bar.appendChild(back);
    bar.appendChild(make('div', NS + '-stagebar-title', game.name || '小游戏'));
    topActions = make('div', NS + '-actions');
    topActionEls = {};
    bar.appendChild(topActions);
    wrap.appendChild(bar);

    var stage = make('div', NS + '-stage');   // 占满屏幕的容器：position:relative; flex:1; min-height:0
    wrap.appendChild(stage);

    return { wrap: wrap, stage: stage };
  }

  function enterGame(id) {
    var game = gameOf(id);
    if (!game || typeof game.create !== 'function') {
      toastMsg('「' + id + '」还没准备好，稍后再试');
      goRoute('#/');
      return;
    }
    goingBack = false;
    var built = buildGame(game);
    var inst = null;
    try {
      inst = game.create(built.stage, {
        member: state.member,
        onExit: exitToHome                       // 游戏内自带的返回按钮走这条路
      });
    } catch (e) {
      if (global.console && console.error) console.error('[shell] 游戏初始化失败：', e);
      toastMsg('「' + (game.name || id) + '」启动失败，已退回首页');
      goingBack = false;
      goRoute('#/');
      return;
    }

    current = {
      game: game,
      inst: inst,
      el: built.wrap,
      container: built.stage,
      setMember: (inst && typeof inst.setMember === 'function')
        ? function (m) { try { inst.setMember(m); } catch (e) { /* ignore */ } }
        : null
    };
    doc.body.classList.add('is-nj-game');
    viewHost.innerHTML = '';
    viewHost.appendChild(built.wrap);
    if (FORCE_FULLSCREEN) tryEnterFullscreen();
    resizeGameSoon();
  }

  /** 回到首页永远是竖屏（全屏状态下可以直接锁朝向；非全屏就解锁，交给设备自己转） */
  function orientationToPortrait() {
    try {
      var so = global.screen && global.screen.orientation;
      if (!so) return;
      if (fullscreenEl()) {
        if (typeof so.lock === 'function') {
          var r = so.lock('portrait');
          if (r && r.catch) r.catch(function () { /* ignore */ });
        }
      } else if (typeof so.unlock === 'function') {
        so.unlock();
      }
    } catch (e) { /* ignore */ }
  }

  function exitToHome() {
    clearAllTopActions();
    orientationToPortrait();
    if (goingBack) return;
    goingBack = true;
    if (location.hash === '#/' || location.hash === '') {
      goingBack = false;      // 已经在首页，没有 hashchange 会来，直接重绘防卡死
      render();
      return;
    }
    location.hash = '#/';
  }

  function teardownGame() {
    var cur = current;
    current = null;
    if (!cur) return;
    if (cur.inst && typeof cur.inst.destroy === 'function') {
      try { cur.inst.destroy(); } catch (e) {
        if (global.console && console.error) console.error('[shell] destroy() 出错：', e);
      }
    }
    if (global.NJMusic && global.NJMusic.stop) { try { global.NJMusic.stop(); } catch (e2) { /* ignore */ } }
    if (cur.container) cur.container.innerHTML = '';
    if (cur.el && cur.el.parentNode) cur.el.parentNode.removeChild(cur.el);
  }

  function resizeGameSoon() {
    if (resizeTimer) global.clearTimeout(resizeTimer);
    resizeTimer = global.setTimeout(function () {
      resizeTimer = 0;
      if (!root) return;
      // 没有游戏实例时也别空转
      if (!current || !current.inst || typeof current.inst.resize !== 'function') return;
      try { current.inst.resize(); } catch (e) { /* ignore */ }
    }, RESIZE_DEBOUNCE);
  }

  /* ============================ 路由 ============================ */
  function routeOf() {
    var h = String(location.hash || '');
    h = h.replace(/^#/, '').replace(/^\/+/, '');
    if (h.indexOf('?') >= 0) h = h.slice(0, h.indexOf('?'));
    if (h.charAt(h.length - 1) === '/') h = h.slice(0, -1);
    return h;
  }

  /** 统一的跳转入口：只改 hash，真正的视图切换都交给 hashchange → render() */
  function goRoute(hash) {
    if (location.hash === hash) { goingBack = false; render(); return; }
    location.hash = hash;
  }

  function gameOf(id) {
    return (id && global.NJGames) ? (global.NJGames[id] || null) : null;
  }

  function render() {
    if (!root) return;
    homeRefresh = null;
    var name = routeOf();
    var game = gameOf(name);

    if (!name) {
      if (current) teardownGame();
      doc.body.classList.remove('is-nj-game');
      viewHost.innerHTML = '';
      viewHost.appendChild(buildHome());
    } else if (game && typeof game.create === 'function') {
      if (current && current.game === game) return;      // 同一个游戏：不重建实例
      if (current) teardownGame();
      enterGame(name);
    } else {
      if (current) teardownGame();
      doc.body.classList.remove('is-nj-game');
      toastMsg('没有这个页面：' + name);
      goRoute('#/');                                      // 兜底回首页
    }
    if (resizeTimer) { global.clearTimeout(resizeTimer); resizeTimer = 0; }
    resizeGameSoon();
  }

  function onHashChange() {
    goingBack = false;      // 路由真的变了，解除「正在返回」的闸门
    render();
  }

  /* ============================ 全屏 ============================ */
  function fullscreenApi() {
    var el = doc.documentElement;
    if (el.requestFullscreen) return { enter: 'requestFullscreen', exit: 'exitFullscreen' };
    if (el.webkitRequestFullscreen) return { enter: 'webkitRequestFullscreen', exit: 'webkitExitFullscreen' };
    if (el.mozRequestFullScreen) return { enter: 'mozRequestFullScreen', exit: 'mozCancelFullScreen' };
    return null;
  }

  function fullscreenEl() {
    return doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || null;
  }

  /* ---- 平台判断：不支持的浏览器要给替代方案，而不是把按钮整个藏掉 ---- */
  function ua() { return String((global.navigator && global.navigator.userAgent) || ''); }
  function isIOS() {
    var u = ua();
    if (/iPad|iPhone|iPod/.test(u)) return true;
    // iPadOS 桌面级 UA：Mac + 多点触控
    return /Macintosh/.test(u) && !!(global.navigator && global.navigator.maxTouchPoints > 1);
  }
  function isInApp() { return /MicroMessenger|QQ\/|Weibo|AlipayClient|DingTalk|Feishu|Lark/i.test(ua()); }
  function isStandalone() {
    try {
      if (global.navigator && global.navigator.standalone === true) return true;
      if (typeof global.matchMedia === 'function' && global.matchMedia('(display-mode: standalone)').matches) return true;
      if (typeof global.matchMedia === 'function' && global.matchMedia('(display-mode: fullscreen)').matches) return true;
    } catch (e) { /* ignore */ }
    return false;
  }
  /**
   * 全屏状态：
   *   'on'          已经全屏（点了主页面设置里的全屏）
   *   'standalone'  从主屏幕图标启动（无地址栏，等于全屏）
   *   'off'         支持全屏但还没开
   *   'unsupported' 浏览器不支持（iPhone Safari / 微信内置浏览器等）→ 给"怎么全屏"的说明
   */
  function fullscreenState() {
    if (fullscreenEl()) return 'on';
    if (isStandalone()) return 'standalone';
    return fullscreenApi() ? 'off' : 'unsupported';
  }
  /** 已经处于"全屏体验"（全屏中或从主屏图标启动） */
  function fullscreenSatisfied() {
    var s = fullscreenState();
    return s === 'on' || s === 'standalone';
  }
  /** 不支持时的操作指引（分平台） */
  function fullscreenHelp() {
    var ios = isIOS();
    var inApp = isInApp();
    var steps = [];
    if (inApp) steps.push('现在这个页面是「' + (/MicroMessenger/.test(ua()) ? '微信' : 'App') + '内置浏览器」，它不支持网页全屏 —— 先点右上角「···」→「在浏览器打开」。');
    if (ios) {
      steps.push('点 Safari 底部中间的「分享」按钮（方框 + 向上箭头）。');
      steps.push('在列表里向下滑，选「添加到主屏幕」。');
      steps.push('回到桌面，点那个新图标打开 —— 没有地址栏，就是全屏效果（横屏游戏也更好操作）。');
    } else {
      steps.push('点浏览器右上角菜单（Chrome 是「⋮」，其他浏览器类似）。');
      steps.push('选「添加到主屏幕」（或「安装应用」）。');
      steps.push('从桌面图标打开，就没有地址栏了，等于全屏。');
    }
    return { ios: ios, inApp: inApp, steps: steps };
  }

  /** 弹出"怎么全屏"的说明弹窗 */
  function showFullscreenHelp() {
    var h = fullscreenHelp();
    var html = '<h2 class="' + NS + '-modal-title">怎么全屏玩</h2>' +
      '<p class="' + NS + '-modal-text">这个浏览器不支持网页全屏按钮，但可以这样达到同样效果：</p>' +
      '<ol class="' + NS + '-modal-steps">';
    for (var i = 0; i < h.steps.length; i++) html += '<li>' + h.steps[i] + '</li>';
    html += '</ol><div class="' + NS + '-modal-row">' +
      '<button class="' + NS + '-modal-btn" data-modal-act="close">知道了</button>' +
      '</div>';
    openModal(html);
  }

  function tryEnterFullscreen() {
    var api = fullscreenApi();
    if (!api || fullscreenEl()) return false;
    try {
      var r = root[api.enter]();
      if (r && r.catch) r.catch(function () { /* 被拒绝：忽略 */ });
      return true;
    } catch (e) { return false; }
  }

  function toggleFullscreen() {
    var api = fullscreenApi();
    if (!api) return;
    if (fullscreenEl()) {
      try {
        var r = doc[api.exit]();
        if (r && r.catch) r.catch(function () { /* ignore */ });
      } catch (e) { /* ignore */ }
    } else {
      tryEnterFullscreen();
    }
  }

  function onFullscreenChange() {
    var on = !!fullscreenEl();
    if (on) doc.body.classList.add('is-nj-fullscreen');
    else doc.body.classList.remove('is-nj-fullscreen');
    if (homeRefresh) homeRefresh();
    resizeGameSoon();
    // 全屏状态变了，游戏里的引导按钮也要跟着更新（已全屏就不再提示）
    try {
      if (global.__njRhythm && global.__njRhythm.refreshFullscreenHint) global.__njRhythm.refreshFullscreenHint();
      if (global.__njParkour && global.__njParkour.refreshFullscreenHint) global.__njParkour.refreshFullscreenHint();
    } catch (e) { /* ignore */ }
  }

  /* ============================ 启动 ============================ */
  function boot() {
    var host = doc.getElementById('app') || doc.body;
    injectStyle();

    // 防止 tree.js 的自动挂载在首页多起一个实例（它会去找 [data-nj-parkour] 节点）
    var stray = doc.querySelector('[data-nj-parkour]');
    if (stray) {
      if (stray.parentNode) stray.parentNode.removeChild(stray);
      if (global.njParkour && typeof global.njParkour.destroy === 'function') {
        try { global.njParkour.destroy(); } catch (e) { /* ignore */ }
      }
      global.njParkour = null;
      global.__NJ_PARKOUR_NO_AUTO__ = true;
    }

    root = make('div', NS);
    banner = make('div', NS + '-banner');
    banner.hidden = true;
    viewHost = make('div', NS + '-view');
    toast = make('div', NS + '-toast');
    toast.hidden = true;
    toast.setAttribute('role', 'status');
    toast.addEventListener('click', function () { toast.hidden = true; });

    root.appendChild(banner);
    root.appendChild(viewHost);
    root.appendChild(toast);
    host.appendChild(root);

    applyAudioPrefs();
    if (!global.NJMusic) setBanner('当前浏览器不支持 Web Audio，静音可玩', 'warn');

    // 首次用户手势解锁音频（iOS 必须）
    doc.addEventListener('pointerdown', onFirstGesture, true);
    doc.addEventListener('touchstart', onFirstGesture, true);
    doc.addEventListener('click', onFirstGesture, true);

    global.addEventListener('hashchange', onHashChange);
    global.addEventListener('resize', resizeGameSoon);
    global.addEventListener('orientationchange', resizeGameSoon);
    doc.addEventListener('fullscreenchange', onFullscreenChange);
    doc.addEventListener('webkitfullscreenchange', onFullscreenChange);
    doc.addEventListener('visibilitychange', function () {
      // 切到后台时把音频停掉，回来不会有一堆排队的事件同时炸响
      if (doc.hidden && global.NJMusic && global.NJMusic.stop) {
        try { global.NJMusic.stop(); } catch (e) { /* ignore */ }
      }
    });

    if (!location.hash) location.replace('#/');
    render();
    showWelcome();          // 打开网页先弹出制作/免责说明
    watchBuild();           // 盯着构建号，老页面会自动提示刷新
  }

  /* ============================ 弹窗 ============================ */
  var modalHost = null;
  /**
   * 弹窗挂到哪里。
   * 关键：**进入网页全屏后，浏览器只渲染"全屏元素及其子孙"**，
   * 挂在 document.body 上的弹窗会完全看不见 —— Android 手机上
   * "首页设置全屏后点联系我没反应"就是这个原因。
   * 所以有全屏元素时，弹窗要挂进全屏元素里面。
   */
  function modalMount() {
    var d = doc;
    var fs = d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement || d.msFullscreenElement || null;
    return fs || d.body;
  }

  function closeModal() {
    if (modalHost && modalHost.parentNode) modalHost.parentNode.removeChild(modalHost);
    modalHost = null;
  }
  function openModal(html, opts) {
    opts = opts || {};
    closeModal();
    var wrap = make('div', NS + '-modal');
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    var card = make('div', NS + '-modal-card');
    card.innerHTML = html;
    wrap.appendChild(card);
    wrap.addEventListener('click', function (e) {
      if (e.target === wrap && opts.dismissible !== false) closeModal();
      var act = e.target && e.target.closest ? e.target.closest('[data-modal-act]') : null;
      if (!act) return;
      var name = act.getAttribute('data-modal-act');
      if (name === 'close') closeModal();
      else if (name === 'copy') {
        var email = 'c585055143@163.com';
        try {
          if (global.navigator && global.navigator.clipboard) global.navigator.clipboard.writeText(email);
          else {
            var ta = doc.createElement('textarea');
            ta.value = email;
            var taHost = modalMount();
            taHost.appendChild(ta);
            ta.select();
            doc.execCommand && doc.execCommand('copy');
            taHost.removeChild(ta);
          }
          act.textContent = '已复制 ✓';
        } catch (e2) { act.textContent = email; }
      } else if (typeof opts.onAct === 'function') {
        opts.onAct(name, act);
      }
    });
    modalMount().appendChild(wrap);
    modalHost = wrap;
  }

  /** 打开网页时的说明弹窗 */
  function showWelcome() {
    openModal(
      '<h2 class="' + NS + '-modal-title">欢迎来到 NewJeans 小游戏</h2>' +
      '<p class="' + NS + '-modal-text">本游戏由 <b>Mosiy</b> 个人参与制作，仅供娱乐。</p>' +
      '<p class="' + NS + '-modal-text">因为采用的是<b>公网地址</b>，所以随时可能会失效。</p>' +
      '<div class="' + NS + '-modal-row">' +
      '  <button class="' + NS + '-modal-btn" data-modal-act="close">知道了，开始玩</button>' +
      '</div>',
      { dismissible: true }
    );
  }

  /** 联系我 */
  function showContact() {
    openModal(
      '<h2 class="' + NS + '-modal-title">联系我</h2>' +
      '<p class="' + NS + '-modal-text">有任何问题、建议，或者需要我下架内容，都可以发邮件：</p>' +
      '<p class="' + NS + '-modal-mail">c585055143@163.com</p>' +
      '<div class="' + NS + '-modal-row">' +
      '  <button class="' + NS + '-modal-btn ghost" data-modal-act="copy">复制邮箱</button>' +
      '  <button class="' + NS + '-modal-btn" data-modal-act="close">关闭</button>' +
      '</div>'
    );
  }

  function toastMsg(text) {
    if (!toast) return;
    toast.textContent = text;
    toast.hidden = false;
    setTimeout(function () { toast.hidden = true; }, 2200);
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();

  // 少量调试入口，方便在控制台里看状态
  global.NJShell = {
    go: function (route) { location.hash = route; },
    home: exitToHome,
    state: state,
    current: function () { return current; },
    /* ---- 给游戏用的全屏接口（两个游戏都按这里的"当前是否已全屏"决定要不要提示） ---- */
    supported: function () { return !!fullscreenApi() || isStandalone(); },
    /** 真的能进网页全屏吗（"添加到主屏幕"不算，它没有 requestFullscreen） */
    canElementFullscreen: function () { return !!fullscreenApi(); },
    /** 真的处于全屏中吗（"添加到主屏幕"不算） */
    isReallyFullscreen: function () { return fullscreenState() === 'on'; },
    /** 是否已经是"全屏体验"（真全屏 或 已添加到主屏幕）：用来决定还要不要提示全屏 */
    fullscreenOn: function () { return fullscreenSatisfied(); },
    fullscreenState: function () { return fullscreenState(); },
    needsStandaloneHelp: function () { return fullscreenState() === 'unsupported'; },
    showFullscreenHelp: showFullscreenHelp,
    setTopAction: setTopAction,
    clearTopAction: clearTopAction,
    enterFullscreen: function (el) {
      var api = fullscreenApi();
      if (!api || fullscreenEl()) return false;
      var target = el || root || doc.documentElement;
      if (!target || typeof target[api.enter] !== 'function') return false;
      try {
        var r = target[api.enter]();
        if (r && r.catch) r.catch(function () { /* 被拒：忽略 */ });
        return true;
      } catch (e) { return false; }
    },
    exitFullscreen: function () {
      var api = fullscreenApi();
      if (!api || !fullscreenEl()) return false;
      try {
        var r = doc[api.exit]();
        if (r && r.catch) r.catch(function () { /* ignore */ });
        return true;
      } catch (e) { return false; }
    },
    /** 顺带锁横屏（跑酷用；失败就算了） */
    lockLandscape: function () {
      try {
        var so = global.screen && global.screen.orientation;
        if (so && typeof so.lock === 'function') {
          var r = so.lock('landscape');
          if (r && r.catch) r.catch(function () { /* ignore */ });
          return true;
        }
      } catch (e) { /* ignore */ }
      return false;
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
